<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Celluworld: vive la célula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --hudf:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --bodyf:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --panel:#fbfbf8; --panel2:#efeee8; --ink:#1d1d1b; --muted:#66665f; --line:rgba(0,0,0,.13);
  --accent:#b8650a; --ok:#3d8a28; --bad:#c2362b;
  --ami:#ff8fb1; --gra:#ffd84d; --azu:#a6e36a; --nuc:#c49bff; --atp:#ffb347;
  --tgreen:rgba(110,190,80,.13); --tgreenb:rgba(110,190,80,.45);
  --tyellow:rgba(255,206,60,.13); --tyellowb:rgba(220,170,30,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#1c1c1a; --panel2:#272725; --ink:#f1f1ec; --muted:#a6a69d; --line:rgba(255,255,255,.14);
    --accent:#ffb347; --ok:#8bd36a; --bad:#ff6d60;
  }
}
:root[data-theme="dark"]{
  --panel:#1c1c1a; --panel2:#272725; --ink:#f1f1ec; --muted:#a6a69d; --line:rgba(255,255,255,.14);
  --accent:#ffb347; --ok:#8bd36a; --bad:#ff6d60;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{height:100%;background:#000;color:var(--ink);font-family:var(--bodyf);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:8}
.atp{min-width:130px;flex:0 0 auto}
.atp-top{display:flex;align-items:baseline;gap:8px;font-family:var(--hudf)}
.atp-l{font-weight:700;color:var(--accent);letter-spacing:.04em}
#atpN{font-weight:700;font-size:1.35rem;line-height:1}
.atp-bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:4px;border:1px solid var(--line)}
#atpFill{height:100%;width:30%;background:#8bd36a;transition:width .25s,background .25s}
.atp.crit #atpFill{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.stocks{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 auto;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.78rem;white-space:nowrap}
.chip b{font-family:var(--hudf);font-size:.9rem}
@media (max-width:640px){.chip{padding:2px 7px;font-size:.72rem;gap:4px}.chip b{font-size:.82rem}.stocks{gap:4px}}
.chip.dd{cursor:pointer;border-color:var(--nuc)}
#nucPop{position:absolute;left:10px;right:10px;top:100%;margin-top:6px;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.4);font-size:.85rem;display:none;max-width:380px}
#nucPop.open{display:block}
#nucPop .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
#nucPop .r:last-child{border-bottom:0}
#nucPop .r b{font-family:var(--hudf)}
#nucPop .h{font-family:var(--hudf);font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.hud-btns{display:flex;gap:6px;margin-left:auto;order:2}
.stocks{order:3}
@media (max-width:640px){.stocks{flex-basis:100%}}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;padding:0}
.ibtn svg{width:18px;height:18px}
.ibtn[aria-pressed="false"]{opacity:.5}

/* Stage */
#stage{position:relative;overflow:hidden;min-height:0}
#bg{position:absolute;inset:0;background:#000;background-size:cover;background-position:center}
#grid{position:absolute;inset:0;pointer-events:none;opacity:.9;
  background-image:linear-gradient(var(--gridc,rgba(255,255,255,.07)) 1px,transparent 1px),linear-gradient(90deg,var(--gridc,rgba(255,255,255,.07)) 1px,transparent 1px);
  background-size:32px 32px;background-position:center center}
#grid.off{display:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tutor{position:absolute;left:10px;bottom:10px;max-width:min(430px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 12px;font-size:.88rem;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:4}
#tutor .who{display:flex;align-items:center;gap:8px;font-family:var(--hudf);font-weight:600;color:var(--accent);margin-bottom:3px}
#tutor .who button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:.8rem;padding:2px 4px}
#tutor.min #tuText{display:none}
#tutor.warn{border-color:var(--bad)}
#stage.intro0 #tutor{display:none}
#icard{position:absolute;left:10px;bottom:10px;width:min(460px,calc(100% - 20px));background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:10px 12px;font-size:.88rem;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:4;display:none;max-height:58%;overflow-y:auto}
#stage.intro0 #icard{display:block}
#icard .ic-p{font-family:var(--hudf);font-weight:600;color:var(--accent);font-size:.78rem;display:flex;justify-content:space-between;align-items:center}
#icard .ic-p button{background:none;border:0;color:var(--muted);font-size:.78rem;padding:2px 4px}
#icard h3{font-family:var(--hudf);font-size:1.12rem;margin:2px 0 4px}
#icard p{margin:.3em 0}
#icard .ic-fn{background:var(--panel2);border-radius:10px;padding:6px 9px;font-size:.83rem}
#icard .ic-dots{display:flex;gap:4px;margin:6px 0 2px}
#icard .ic-dots i{flex:1;height:4px;border-radius:2px;background:var(--panel2)}
#icard .ic-dots i.on{background:var(--accent)}
#icard.min .ic-body{display:none}
#icard [hidden]{display:none!important}
@media (max-width:640px){.menu button{padding:10px 14px}.menu .opts{gap:8px}}
.zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.35rem;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.zoom #zReset svg{width:18px;height:18px}
#placing button{border:0;background:#1d1d1b;color:#fff;border-radius:999px;padding:7px 22px;font-weight:600;font-size:.9rem;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#placing span{background:var(--accent);color:#1b1100;padding:8px 14px;border-radius:14px;text-align:center;white-space:normal}
#placing{flex-direction:column;gap:8px;align-items:center;position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#1b1100;font-weight:600;font-size:.88rem;display:none;z-index:4;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#toasts{position:absolute;top:52px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none;width:min(92%,440px)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:8px 12px;border-radius:10px;font-size:.85rem;box-shadow:0 4px 18px rgba(0,0,0,.35);animation:tin .25s ease}
.toast.bad{border-left-color:var(--bad)}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#logroFlash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:7}
.lf{background:var(--panel);border:2px solid var(--atp);border-radius:18px;padding:16px 22px;text-align:center;box-shadow:0 0 60px rgba(255,179,71,.45);animation:pop 2.6s ease forwards;max-width:86%}
.lf small{display:block;color:var(--accent);font-family:var(--hudf);font-weight:600;font-size:.85rem}
.lf strong{display:block;font-family:var(--hudf);font-size:1.4rem;margin:2px 0}
.lf span{font-size:.85rem;color:var(--muted)}
@keyframes pop{0%{opacity:0;transform:scale(.8)}12%{opacity:1;transform:scale(1.04)}20%{transform:scale(1)}82%{opacity:1}100%{opacity:0}}

/* Dock */
.dock{display:flex;gap:4px;padding:6px 6px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;z-index:5}
.dock button{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid transparent;background:none;border-radius:12px;font-size:.72rem;color:var(--muted)}
.dock button svg{width:24px;height:24px}
.dock button:hover{background:var(--panel2);color:var(--ink)}
.dock button.hl{color:var(--ink);border-color:var(--accent);background:var(--panel2)}

/* Sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;z-index:30;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s ease;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.45)}
.sheet.open{transform:none}
@media (min-width:880px){
  .sheet{left:auto;top:0;width:410px;max-height:none;border-radius:0;transform:translateX(105%);padding-top:env(safe-area-inset-top,0px)}
  .sheet.open{transform:none}
}
.sh-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-family:var(--hudf);font-size:1.15rem;flex:1}
.sh-head .back{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:4px 10px;font-size:.8rem}
.sh-body{overflow-y:auto;padding:12px 14px 18px;font-size:.9rem;line-height:1.45}
.sh-body p{margin:.4em 0}
.muted{color:var(--muted)}
.small{font-size:.8rem}

.orggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.orgbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-size:.78rem}
.orgbtn svg{width:46px;height:46px}
.group{border-radius:14px;padding:10px;margin:10px 0;border:1px solid}
.group.t{background:var(--tgreen);border-color:var(--tgreenb)}
.group.e{background:var(--tyellow);border-color:var(--tyellowb)}
.group h3{margin:0 0 8px;font-family:var(--hudf);font-size:.95rem}
.bp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-top:8px}
.bp-h{display:flex;align-items:center;gap:8px}
.bp-h strong{flex:1;font-size:.92rem}
.bp .tipo{font-size:.76rem;color:var(--accent);font-weight:500}
.bp .hace{font-size:.82rem;margin:4px 0}
.cost{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cost .chip{font-size:.74rem}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 12px;font-size:.85rem;font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1100}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.compo{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line);margin:6px 0 4px}
.compo div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.74rem;color:var(--muted)}

/* Build */
.build{display:grid;grid-template-columns:1fr 112px;gap:10px;margin-top:10px}
.mold{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:150px;transition:border-color .15s,background .15s}
.mold.over{border-color:var(--accent);background:var(--panel2)}
.mold h4{margin:0 0 6px;font-family:var(--hudf);font-size:.85rem;color:var(--muted);font-weight:600}
.bar{margin:8px 0}
.bar-l{display:flex;justify-content:space-between;font-size:.76rem;margin-bottom:3px}
.bar-t{height:14px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.bar-f{height:100%;width:0;transition:width .25s}
.bar.full .bar-l b{color:var(--ok)}
.palette{display:flex;flex-direction:column;gap:7px}
.blk{touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px;padding:8px 6px;text-align:center;font-size:.72rem;font-weight:600;color:#201a10;border:1px solid rgba(0,0,0,.25);cursor:grab;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.blk span{display:block;font-family:var(--hudf);font-size:1rem}
.blk.empty{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;width:64px;height:40px;border-radius:9px;transform:translate(-50%,-50%) rotate(-6deg);box-shadow:0 8px 20px rgba(0,0,0,.4);border:1px solid rgba(0,0,0,.3)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--panel2);width:32px;height:30px}
.qty b{min-width:36px;text-align:center;font-family:var(--hudf)}

/* Mito levers */
.factory{display:flex;gap:14px;justify-content:center;margin:12px 0;padding:14px 10px;border-radius:14px;background:repeating-linear-gradient(135deg,var(--panel2) 0 10px,var(--panel) 10px 20px);border:1px solid var(--line)}
.lever{display:flex;flex-direction:column;align-items:center;gap:6px;width:110px}
.lv-read{font-family:var(--hudf);font-weight:700;font-size:1.6rem;background:#111;color:var(--atp);border-radius:8px;padding:2px 12px;min-width:64px;text-align:center;border:1px solid #333;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.lv-track{position:relative;width:34px;height:150px;touch-action:none;cursor:ns-resize}
.lv-slot{position:absolute;left:13px;top:0;bottom:0;width:8px;border-radius:4px;background:#2a2a28;box-shadow:inset 0 2px 4px rgba(0,0,0,.7)}
.lv-knob{position:absolute;left:0;width:34px;height:26px;border-radius:7px;background:linear-gradient(#e8e4da,#a9a59a);border:1px solid #555;box-shadow:0 3px 6px rgba(0,0,0,.45)}
.lv-knob::after{content:"";position:absolute;left:6px;right:6px;top:11px;height:3px;background:#c8740a;border-radius:2px}
.lv-btns{display:flex;gap:4px}
.lv-btns button{width:36px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel)}
.lv-name{font-size:.8rem;font-weight:600;text-align:center}
.readout{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel2);font-size:.86rem}
.readout .k{color:var(--muted)}
.switch{display:flex;align-items:center;gap:10px}
.toggle{width:52px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--panel2);position:relative;padding:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.toggle[aria-pressed="true"]{background:var(--accent)}
.toggle[aria-pressed="true"]::after{left:25px;background:#fff}
.route{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px;margin-top:6px;background:var(--panel2)}
.route div{flex:1}
select{font:inherit;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.logro{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.logro .st{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;border:2px solid var(--line);font-size:.8rem}
.logro.done{border-color:var(--atp)}
.logro.done .st{background:var(--atp);border-color:var(--atp);color:#1b1100}
.bgopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.bgopt{height:62px;border-radius:12px;border:2px solid var(--line);position:relative;overflow:hidden;font-size:.72rem;display:flex;align-items:flex-end;padding:5px;color:#fff;text-shadow:0 1px 2px #000}
.bgopt[aria-pressed="true"]{border-color:var(--accent)}

/* Modal */
#modal{position:fixed;inset:0;z-index:95;display:none;place-items:center;background:rgba(0,0,0,.6);padding:20px}
#modal.open{display:grid}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:420px;width:100%}
.mbox h2{font-family:var(--hudf);margin:0 0 6px}

/* Barra de potencia de la cola */
#power{position:absolute;left:10px;top:10px;width:58px;height:min(260px,42%);display:none;flex-direction:column;align-items:center;gap:6px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 6px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#power.on{display:flex}
#power .pw-l{font-family:var(--hudf);font-weight:700;font-size:.72rem;color:var(--muted)}
#power .pw-t{flex:1;width:18px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
#power .pw-f{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffd84d,#ffb347);transition:height .4s}
#power .pw-n{font-family:var(--hudf);font-weight:700;font-size:1rem}
#power .pw-m{font-size:.66rem;color:var(--muted);text-align:center;line-height:1.2}
/* Carrera */
#race{position:absolute;left:8px;right:8px;top:8px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px 8px;display:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#stage.racing #race{display:block}
#stage.racing #placing{top:128px}
#stage.racing #toasts{top:170px}
#stage.racing #power{top:128px}
.rc-top{display:flex;gap:12px;align-items:baseline;font-family:var(--hudf);font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.rc-top b{color:var(--ink);font-size:1.05rem}
.lane{position:relative;height:12px;margin-top:3px;border-radius:6px;background:var(--panel2)}
.lane .fin{position:absolute;right:0;top:0;bottom:0;width:3px;background:repeating-linear-gradient(#000 0 3px,#fff 3px 6px);border-radius:0}
.lane .rn{position:absolute;top:50%;width:22px;height:9px;border-radius:5px;transform:translate(-50%,-50%);border:1px solid rgba(0,0,0,.4);transition:left .25s linear}
.lane .rn::after{content:"";position:absolute;right:100%;top:50%;width:10px;height:2px;background:inherit;transform:translateY(-50%)}
.lane .nm{position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:.6rem;color:var(--muted);pointer-events:none;white-space:nowrap}
.lane.me{outline:1.5px solid var(--accent)}
#raceIntro{position:fixed;inset:0;z-index:85;background:#000;display:none;place-items:center;color:#f4f4ef;overflow:hidden}
#raceIntro.on{display:grid}
#raceIntro .ri{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .5s}
#raceIntro .ri.on{opacity:1}
#raceIntro svg{width:min(88vw,620px);height:auto}
#raceIntro .call{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--hudf);font-weight:700;font-size:clamp(2rem,9vw,4rem);letter-spacing:.02em}
#raceIntro .skip{position:absolute;right:14px;bottom:14px;background:none;border:1px solid rgba(255,255,255,.4);color:#f4f4ef;border-radius:999px;padding:6px 14px;font-size:.85rem}
.rank{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
.rank td,.rank th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.rank th{font-size:.75rem;color:var(--muted);font-weight:500}
.rank .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;border:1px solid rgba(128,128,128,.6)}
.menu .rkb{flex:0 0 auto;text-align:center;padding:8px 18px;border-radius:999px;font-size:.9rem}
/* Intro */
.scene{position:absolute;left:50%;top:44%;width:min(86vmin,640px);transform:translate(-50%,-50%);opacity:0;transition:opacity 1.6s ease;filter:blur(1.3px) drop-shadow(0 0 8px rgba(255,255,255,.7));pointer-events:none}
.scene.on{opacity:.34}
.scene svg{width:100%;height:auto;display:block;overflow:visible}
.scene svg .k{fill:none;stroke:rgba(255,255,255,.95);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.scene svg .f{fill:rgba(255,255,255,.85);stroke:none}
.sc-drop{animation:scFall 2.4s ease-in infinite}
@keyframes scFall{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{transform:translateY(44px);opacity:1}100%{transform:translateY(44px);opacity:0}}
.sc-spread{transform-origin:200px 250px;animation:scSpread 2.4s ease-out infinite}
@keyframes scSpread{0%,75%{transform:scale(.2);opacity:0}85%{opacity:1}100%{transform:scale(1.4);opacity:.2}}
.sc-slide{animation:scSlide 4s ease-in-out infinite alternate}
@keyframes scSlide{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
.sc-beam{animation:scBeam 2s ease-in-out infinite alternate}
@keyframes scBeam{from{opacity:.2}to{opacity:.9}}
.sc-loop{animation:scLoop 3s ease-in-out infinite}
@keyframes scLoop{0%{transform:translate(-50px,-30px)}25%{transform:translate(40px,-10px)}50%{transform:translate(-40px,10px)}75%{transform:translate(45px,30px)}100%{transform:translate(-50px,-30px)}}
.sc-rotor{transform-origin:200px 160px;animation:scSpin .45s linear infinite}
@keyframes scSpin{to{transform:rotate(360deg)}}
.sc-bub{animation:scBub 2.6s ease-in infinite}
@keyframes scBub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-90px);opacity:0}}
.menu{position:absolute;left:0;right:0;bottom:9%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 20px;opacity:0;pointer-events:none;transition:opacity .9s ease}
#intro.play .menu{opacity:1;pointer-events:auto;transition-delay:1.6s}
.menu h1{font-family:var(--hudf);font-weight:700;font-size:clamp(2.4rem,9vw,4.4rem);margin:0;line-height:1;letter-spacing:.02em;text-shadow:0 0 24px rgba(255,255,255,.35)}
.menu p{margin:0 0 6px;color:rgba(255,255,255,.65);font-size:.95rem}
.menu .opts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:560px}
.menu button{flex:1 1 220px;background:rgba(255,255,255,.08);color:#f4f4ef;border:1px solid rgba(255,255,255,.45);border-radius:16px;padding:14px 16px;text-align:left;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.menu button:hover{background:rgba(255,255,255,.16)}
.menu button b{display:block;font-family:var(--hudf);font-size:1.15rem}
.menu button span{font-size:.82rem;color:rgba(255,255,255,.7)}
#intro{position:fixed;inset:0;z-index:80;background:#000;overflow:hidden;transition:opacity .9s ease;color:#f4f4ef}
#intro.gone{opacity:0;pointer-events:none}
.glint{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 65%);filter:blur(2px);opacity:0;animation:glint 6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:0;transform:translate(0,0) scale(.7)}40%{opacity:.75}60%{opacity:.2;transform:translate(18px,-10px) scale(1.15)}}
.caustic{position:absolute;inset:-20%;opacity:.16;background:
  radial-gradient(ellipse 30% 8% at 30% 40%,rgba(255,255,255,.8),transparent 70%),
  radial-gradient(ellipse 22% 6% at 70% 60%,rgba(255,255,255,.7),transparent 70%),
  radial-gradient(ellipse 26% 5% at 50% 25%,rgba(255,255,255,.6),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg)}}
.igrid{position:absolute;inset:0;opacity:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:32px 32px;background-position:center}
.pip{position:absolute;top:50%;left:calc(50% + 34px);width:min(64vw,620px);transform:translate(120vw,-50%);opacity:.95}
.pip svg{width:100%;height:auto;display:block}
.idrop{position:absolute;top:50%;left:calc(50% + 34px);width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);opacity:0;border:2px solid rgba(255,255,255,.85);background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.35),rgba(255,255,255,.05))}
.ititle{position:absolute;left:0;right:0;bottom:12%;text-align:center;opacity:0;padding:0 20px}
.ititle h1{font-family:var(--hudf);font-weight:700;font-size:clamp(2.4rem,9vw,4.6rem);margin:0;letter-spacing:.02em;line-height:1}
.ititle p{margin:.5em 0 1.1em;color:rgba(255,255,255,.7)}
.ititle button{background:#f4f4ef;color:#000;border:0;border-radius:999px;padding:12px 30px;font-weight:600;font-size:1rem}
.tapstart{position:absolute;inset:0;background:none;border:0;color:rgba(255,255,255,.7);font-size:1rem;display:grid;place-items:center;letter-spacing:.02em}
.tapstart span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 22px;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}
#intro.play .tapstart{display:none}
#intro.play .pip{animation:pipIn 2.2s cubic-bezier(.2,.8,.2,1) .5s forwards, pipOut 1.4s ease-in 4.6s forwards}
@keyframes pipIn{to{transform:translate(0,-50%)}}
@keyframes pipOut{from{transform:translate(0,-50%)}to{transform:translate(120vw,-50%)}}
#intro.play .idrop{animation:dropOut 1.8s ease 2.9s forwards}
@keyframes dropOut{0%{opacity:0;left:calc(50% + 34px);width:6px;height:6px}15%{opacity:1}55%{left:50%;width:30px;height:30px}100%{opacity:1;left:50%;width:min(52vmin,330px);height:min(52vmin,330px)}}
#intro.play .igrid{animation:fadeIn 1.6s ease 4.6s forwards}
#intro.play .ititle{animation:fadeIn 1.2s ease 5.6s forwards}
@keyframes fadeIn{to{opacity:1}}
@media (prefers-reduced-motion: reduce){
  #intro.play .pip{animation:none;transform:translate(120vw,-50%)}
  #intro.play .idrop{animation:none;opacity:1;left:50%;width:min(52vmin,330px);height:min(52vmin,330px)}
  #intro.play .igrid,#intro.play .ititle{animation:none;opacity:1}
  .glint,.caustic{animation:none}
  .sheet{transition:none}
}
/* ---------- Minijuego: Fábrica de pelo (queratina) ---------- */
#kera{-webkit-user-select:none;user-select:none;position:fixed;inset:0;z-index:90;background:#07090c;color:#f1f1ec;display:none;grid-template-rows:auto 1fr;font-family:var(--bodyf);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#kera.on{display:grid}
.kr-top{display:flex;align-items:center;gap:8px 10px;padding:8px 10px;background:#121418;border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.kr-top h2{margin:0;font-family:var(--hudf);font-size:1.08rem;letter-spacing:.02em;white-space:nowrap}
.kr-steps{display:flex;gap:4px;flex-wrap:wrap}
.kr-steps i{font-style:normal;font-family:var(--hudf);font-size:.72rem;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:#a6a69d;white-space:nowrap}
.kr-steps i.done{color:#8bd36a}
.kr-steps i.on{background:#ffb347;color:#1b1100}
#krBack{margin-left:auto}
.kr-chips{display:flex;gap:5px;flex-wrap:wrap;flex-basis:100%}
.kr-chips:empty{display:none}
.kr-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:#272725;border:1px solid rgba(255,255,255,.14);font-size:.76rem;white-space:nowrap}
.kr-chip b{font-family:var(--hudf);font-size:.88rem}
.kr-chip.low{border-color:#ff6d60}
.kr-main{display:grid;grid-template-rows:1fr auto;min-height:0}
.kr-view{position:relative;overflow:hidden;min-height:0;order:1}
#krCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.kr-zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:3}
.kr-zoom button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(28,28,26,.9);color:#f1f1ec;font-size:1.25rem;line-height:1;display:grid;place-items:center;padding:0}
.kr-zoom button svg{width:17px;height:17px}
.kr-panel{order:2;height:38vh;overflow-y:auto;background:#1c1c1a;border-top:1px solid rgba(255,255,255,.14);padding:9px 12px 12px;font-size:.88rem;line-height:1.45}
.kr-panel.min{height:auto}
.kr-panel.min #krBody,.kr-panel.min #krMsgs{display:none}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  .kr-main{grid-template-columns:350px 1fr;grid-template-rows:1fr}
  .kr-panel{order:0;height:auto;border-top:0;border-right:1px solid rgba(255,255,255,.14);border-left:4px solid #ffb347}
  #krMin{display:none}
}
.kr-ch{display:flex;justify-content:space-between;align-items:center;font-family:var(--hudf);font-weight:600;color:#ffb347;font-size:.78rem}
.kr-ch button{background:none;border:0;color:#a6a69d;font-size:.78rem;padding:2px 4px}
.kr-hint{background:#ffb347;color:#1b1100;font-weight:600;font-size:.86rem;padding:6px 10px;border-radius:10px;margin:6px 0}
.kr-hint:empty{display:none}
.kr-msg{background:#272725;border-left:4px solid #ffb347;border-radius:8px;padding:6px 9px;margin:6px 0;font-size:.83rem;animation:tin .25s ease}
.kr-msg.bad{border-left-color:#ff6d60}
.kr-msg.ok{border-left-color:#8bd36a}
.kr-panel h3{font-family:var(--hudf);font-size:1.12rem;margin:4px 0}
.kr-panel p{margin:.35em 0}
.kr-box{background:#272725;border-radius:10px;padding:7px 10px;margin:8px 0;font-size:.84rem}
.kr-box b.t{font-family:var(--hudf);font-size:.98rem;display:block}
.kr-tag{display:inline-block;font-size:.72rem;font-family:var(--hudf);color:#1b1100;background:#9ee0c6;border-radius:999px;padding:0 8px;margin:2px 0 3px}
.kr-goals{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:3px}
.kr-goals li{display:flex;gap:7px;align-items:flex-start;color:#a6a69d;font-size:.84rem}
.kr-goals li::before{content:"";flex:0 0 12px;height:12px;margin-top:4px;border-radius:50%;border:2px solid #66665f}
.kr-goals li.done{color:#8bd36a}
.kr-goals li.done::before{background:#8bd36a;border-color:#8bd36a}
.kr-goals li.now{color:#f1f1ec;font-weight:500}
.kr-goals li.now::before{border-color:#ffb347;background:#ffb347}
.kr-bar{height:9px;border-radius:5px;background:#272725;border:1px solid rgba(255,255,255,.14);overflow:hidden;margin:4px 0 6px}
.kr-bar div{height:100%;background:#ffb347;transition:width .3s}
.kr-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kr-btn{border:1px solid rgba(255,255,255,.22);background:#272725;color:#f1f1ec;border-radius:10px;padding:7px 12px;font-size:.85rem;font-weight:500}
.kr-btn.pri{background:#ffb347;color:#1b1100;border-color:#ffb347;font-weight:600}
.kr-btn:disabled{opacity:.45;cursor:not-allowed}
.kr-btn small{display:block;font-weight:400;opacity:.8;font-size:.76rem}
.kr-gene{border:2px solid #c49bff;border-radius:12px;padding:8px 10px;margin:6px 0;background:rgba(196,155,255,.08)}
.kr-gene .kr-btn{display:block;width:100%;text-align:left;margin-top:6px}
.kr-q{margin:8px 0;padding-top:6px;border-top:1px solid rgba(255,255,255,.1)}
.kr-q .kr-btns{margin-top:4px}
.kr-q .kr-btn{font-size:.8rem;padding:5px 9px}
.kr-q .kr-btn.ok{background:#3d8a28;border-color:#8bd36a;color:#fff}
.kr-q .kr-btn.no{border-color:#ff6d60;background:#c2362b;color:#fff;animation:krShake .3s}
.kr-q .kr-btn.ok:disabled{opacity:1}
@keyframes krShake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="atp" id="atpBox" title="Energía de la célula">
      <div class="atp-top"><span class="atp-l">ATP</span><span id="atpN">25</span></div>
      <div class="atp-bar"><div id="atpFill"></div></div>
    </div>
    <div class="stocks" id="stocks"></div>
    <div id="nucPop" role="dialog" aria-label="Nucleótidos por lugar"></div>
    <div class="hud-btns">
      <button class="ibtn" id="musicBtn" aria-pressed="true" aria-label="Música"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
      <button class="ibtn" id="setBtn" aria-label="Ajustes y fondo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <main id="stage">
    <div id="bg"></div>
    <div id="grid"></div>
    <canvas id="cv"></canvas>
    <div id="placing"></div>
    <div class="zoom" aria-label="Zoom">
      <button id="zIn" aria-label="Acercar">+</button>
      <button id="zReset" aria-label="Volver a la vista normal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="7"/></svg></button>
      <button id="zOut" aria-label="Alejar">−</button>
    </div>
    <div id="toasts"></div>
    <div id="logroFlash"></div>
    <div id="race"><div class="rc-top"><span>Tiempo <b id="rcT">0:00.0</b></span><span>Velocidad <b id="rcV">0</b> µm/s</span><span>Recorrido <b id="rcD">0</b> / 10.000 µm</span></div><div id="rcLanes"></div></div>
    <div id="power"><div class="pw-l">COLA</div><div class="pw-t"><div class="pw-f" id="pwF"></div></div><div class="pw-n" id="pwN">0%</div><div class="pw-m" id="pwM">0/10</div></div>
    <div id="icard" aria-live="polite">
      <div class="ic-p"><span id="icP"></span><button id="icMin">ocultar</button></div>
      <div class="ic-body">
        <div class="ic-dots" id="icD"></div>
        <h3 id="icT"></h3>
        <p id="icX"></p>
        <p class="ic-fn" id="icF"></p>
        <div id="icS" class="small"></div>
        <div class="row" style="margin-top:8px"><button class="btn pri" id="icB"></button><button class="btn" id="icE" hidden>Menú</button></div>
      </div>
    </div>
    <div id="tutor">
      <div class="who"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Guía<button id="tuMin">ocultar</button></div>
      <div id="tuText"></div>
    </div>
  </main>

const cv = $("#cv"), ctx = cv.getContext("2d");

const VIEW = { z: ZDEF, px: 0, py: 0 };
function draw(time) {

  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }

  const vx0 = Math.min(CX - 650, -ox / sc - 20), vx1 = Math.max(CX + 650, (W - ox) / sc + 20), vy0 = Math.min(CY - 650, -oy / sc - 20), vy1 = Math.max(CY + 650, (H - oy) / sc + 20);

    const d = Math.hypot(p.x - CX, p.y - CY);
    if (d < R + 18) { const k = (R + 18) / d; p.x = CX + (p.x - CX) * k; p.y = CY + (p.y - CY) * k; p.vx = -p.vx; p.vy = -p.vy; }

function clampView() {
  VIEW.z = Math.max(ZMIN, Math.min(ZMAX, VIEW.z));

}
function zoomAt(f, mx, my) { // mx,my relativos al canvas
  const W = cv.clientWidth, H = cv.clientHeight;
  if (mx == null) { mx = W / 2; my = H / 2; }
  const wx = (mx - W / 2) / sc + CX + VIEW.px, wy = (my - H / 2) / sc + CY + VIEW.py;
  VIEW.z = Math.max(ZMIN, Math.min(ZMAX, VIEW.z * f));
  const ns = baseSc * VIEW.z;
  VIEW.px = wx - CX - (mx - W / 2) / ns; VIEW.py = wy - CY - (my - H / 2) / ns;

}

cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (PTR.size === 1) { downAt = { x: e.clientX, y: e.clientY }; moved = false; gesture = null; }
  if (PTR.size === 2) { const [a, b] = [...PTR.values()]; gesture = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; moved = true; }
});
cv.addEventListener("pointermove", e => {
  if (!PTR.has(e.pointerId)) return;
  const prev = PTR.get(e.pointerId); PTR.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const rect = cv.getBoundingClientRect();
  if (PTR.size >= 2 && gesture) {
    const [a, b] = [...PTR.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    VIEW.px -= (mx - gesture.mx) / sc; VIEW.py -= (my - gesture.my) / sc;
    if (gesture.d > 0) zoomAt(d / gesture.d, mx - rect.left, my - rect.top);

    if (!moved && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 10) moved = true;

});
function ptrEnd(e) {

function tapWorld(x, y) {

  for (const rb of S.ribos) if (Math.hypot(x - CX - rb.x, y - CY - rb.y) < 36) return openSheet("ribo", rb.id);
  for (const o of sources()) if (Math.hypot(x - o.x, y - o.y) < 20 + 2 * Math.sqrt(o.n)) return openSheet("pool", o.id);
  for (const tr of S.trans) { const tx = CX + Math.cos(tr.ang) * R, ty = CY + Math.sin(tr.ang) * R; if (Math.hypot(x - tx, y - ty) < 24) return openSheet("trinfo", S.trans.indexOf(tr)); }

  if (vis("nucleo") && dN < 66) return openSheet("org", "nucleo");
  const G = stPos("golgi"); if (vis("golgi") && Math.hypot(x - G.x, y - G.y) < 48) return openSheet("golgi");
  const Ls = stPos("lisosoma"); if (vis("lisosoma") && Math.hypot(x - Ls.x, y - Ls.y) < 22) return openSheet("org", "lisosoma");

}

function modeTap(x, y) {
  const md = S.mode;
  if (md.k === "tubeA") {
    let best = null, bd = 42;
    for (const o of sources()) { const d = Math.hypot(x - o.x, y - o.y); if (d < bd) { bd = d; best = o; } }
    if (!best) for (const o of sources()) if (o.tr) { const tx = CX + Math.cos(o.tr.ang) * S.radius, ty = CY + Math.sin(o.tr.ang) * S.radius; if (Math.hypot(x - tx, y - ty) < 30) best = o; }
    if (!best) return toast("Tocá una acumulación de puntitos: junto a un canal, al núcleo o a los ribosomas.", "bad");

    { const q = stPos("nucleo"); if (Math.hypot(x - q.x, y - q.y) < 64) dst = "nucleo"; }
    S.ribos.forEach(rb => { if (Math.hypot(x - CX - rb.x, y - CY - rb.y) < 42) { dst = "ribosomas"; ref = rb.id; } });

      id === "amino" ? "Ojo: este transportador no gasta ATP por sí mismo. El ATP lo gasta la bomba sodio-potasio que arma el gradiente. Para ahorrar ATP, apagá la bomba (y este se detiene)." :

          <div class="switch"><button class="toggle" id="mAuto" aria-pressed="${LM.auto}" aria-label="Automático"></button><span>Automático</span></div>

        <p class="small muted">La mitocondria tiene su propio ADN y lo copia en ARN para fabricar 13 proteínas de la cadena respiratoria. Ese ARN se gasta al producir ATP; para renovarlo usa 1 nucleótido de la reserva y medio ATP. El resto de sus proteínas (la gran mayoría) vienen del núcleo.</p>
        <div class="factory">${lever("azu", "Azúcar por ciclo", 3)}${lever("o2", "Oxígeno por ciclo", 18)}</div>

/* ---------- build panel ---------- */
const req = c => (BP[B.id].cost[c] || 0) * B.qty;
function maxQty() {
  const b = BP[B.id]; let m = 40;
  for (const c in b.cost) m = Math.min(m, Math.floor((S.stock[c] + B.fill[c]) / b.cost[c]));
  m = Math.min(m, Math.floor(S.atp / b.atp));
  if (B.id === "fosfo") m = Math.min(m, Math.floor((290 - S.radius) / 1.5));
  return Math.max(0, m);
}
function renderBuild() {
  if (!B) return;
  const b = BP[B.id];
  const anyFill = Object.values(B.fill).some(v => v > 0);
  const all = Object.keys(b.cost).every(c => B.fill[c] >= req(c));
  const needWater = B.id === "fosfo" && !count("acua");
  const needCount = Object.keys(b.cost);
  let h = `<div class="tipo small" style="color:var(--accent)">${b.tipo}</div><p class="small">${b.hace}</p>`;
  if (b.batch) h += `<div class="row"><span class="small">Cantidad</span><span class="qty"><button id="qDn" ${anyFill ? "disabled" : ""}>−</button><b>${B.qty}</b><button id="qUp" ${anyFill ? "disabled" : ""}>+</button></span><span class="small muted">Máximo con tus reservas: ${maxQty()}</span></div>`;
  if (needWater) h += `<p class="small" style="color:var(--bad)">La célula necesita agua para crecer. Construí primero una acuaporina.</p>`;
  h += `<div class="build"><div class="mold" id="mold"><h4>Molde: arrastrá los bloques acá</h4>`;
  for (const c of needCount) {
    const r = req(c), f = B.fill[c], p = Math.round(f / r * 100);
    h += `<div class="bar ${p >= 100 ? "full" : ""}"><div class="bar-l"><span>${COMP[c].n} ${f}/${r}</span><b>${p}%</b></div><div class="bar-t"><div class="bar-f" style="width:${p}%;background:${COMP[c].c}"></div></div></div>`;
  }
  h += `</div><div class="palette">`;
  for (const c in COMP) h += `<div class="blk ${S.stock[c] ? "" : "empty"}" data-c="${c}" style="background:${COMP[c].c}">${COMP[c].s}<span>${S.stock[c]}</span></div>`;
  h += `</div></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="bOk" ${all && !needWater ? "" : "disabled"}>Construir (−${b.atp * B.qty} ATP)</button><button class="btn" id="bNo">Cancelar</button></div>
    <p class="small muted">También podés tocar un bloque para sumarlo.</p>`;
  $("#buildBox").innerHTML = h;
  if (b.batch) {
    $("#qUp").onclick = () => { if (B.qty < Math.max(1, maxQty())) { B.qty++; renderBuild(); } else toast("No te alcanzan los nutrientes o el ATP para más.", "bad"); };
    $("#qDn").onclick = () => { if (B.qty > 1) { B.qty--; renderBuild(); } };
  }
  $("#bNo").onclick = () => { cancelBuild(); closeSheet(); };
  $("#bOk").onclick = confirmBuild;
  document.querySelectorAll(".blk").forEach(el => el.addEventListener("pointerdown", dragStart));
}
function addComp(c) {
  const r = req(c);
  if (!r) return toast(`${BP[B.id].name} no lleva ${COMP[c].n.toLowerCase()}.`, "bad");
  if (B.fill[c] >= r) return toast(`${COMP[c].n}: ya está al 100%. No entra más.`, "bad");
  if (S.stock[c] <= 0) return toast(c === "prot" ? "No te quedan proteínas. Las fabrica el retículo rugoso (RER), y también los ribosomas sueltos." : c === "fos" || c === "col" ? `No te queda ${COMP[c].n.toLowerCase()}. Lo fabrica el retículo liso (REL).` : `No te quedan ${COMP[c].n.toLowerCase()}. Hacelos entrar por la membrana.`, "bad");
  const add = Math.min(Math.max(1, Math.ceil(r / 4)), r - B.fill[c], S.stock[c]);
  B.fill[c] += add; S.stock[c] -= add; renderBuild(); hud();
}
function cancelBuild() { if (!B) return; if (B.fromMito) { B.fromMito.m.box.nuc = Math.min(20, B.fromMito.m.box.nuc + B.fromMito.n); B.fill.nuc -= B.fromMito.n; } for (const c in B.fill) S.stock[c] += B.fill[c]; B = null; hud(); }
function confirmBuild() {
  const b = BP[B.id], cost = b.atp * B.qty;
  if (S.atp < cost) return toast("No alcanza el ATP. Esperá a que las mitocondrias produzcan más.", "bad");
  S.atp -= cost; const id = B.id, qty = B.qty; B = null; closeSheet();
  S.placeRefund = { atp: cost, cost: Object.fromEntries(Object.entries(b.cost).map(([k, v]) => [k, v * qty])) };
  if (b.place === "membrana") { S.placing = id; toast("Ahora tocá la membrana donde quieras ubicarlo."); }
  else if (id === "mito") { const par = S.mitos.find(m => m.id === S.fissionParent); S.fissionParent = null; if (par) fission(par); else S.placing = "mito"; }
  else if (id === "motora") { S.freeMotors += qty; toast(`${qty} proteína${qty > 1 ? "s" : ""} motora${qty > 1 ? "s" : ""} lista${qty > 1 ? "s" : ""}.`, "ok"); }
  else if (id === "ribo") S.placing = "ribo";
  else if (id === "fosfo") { S.radius = Math.min(290, S.radius + qty * 1.5); S.phosp += qty; toast(`Se sumaron ${qty} fosfolípidos: la membrana creció.`, "ok"); }
  ping(); hud();
}
let drag = null;
function dragStart(e) {
  const c = e.currentTarget.dataset.c;
  drag = { c, x: e.clientX, y: e.clientY, moved: false, ghost: null };
  e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
  const el = e.currentTarget;
  const move = ev => {
    if (!drag) return;
    if (!drag.moved && Math.hypot(ev.clientX - drag.x, ev.clientY - drag.y) > 6) {
      drag.moved = true; const g = document.createElement("div"); g.className = "ghost"; g.style.background = COMP[c].c; document.body.appendChild(g); drag.ghost = g;
    }
    if (drag.ghost) {
      drag.ghost.style.left = ev.clientX + "px"; drag.ghost.style.top = ev.clientY + "px";
      const m = $("#mold"); if (m) { const r = m.getBoundingClientRect(); m.classList.toggle("over", ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom); }
    }
  };
  const up = ev => {
    el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
    const d = drag; drag = null; if (!d) return;
    if (d.ghost) d.ghost.remove();
    const m = $("#mold");
    if (!d.moved) { addComp(c); return; }
    if (m) {
      const r = m.getBoundingClientRect(); m.classList.remove("over");
      if (ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom) addComp(c);
    }
  };
  el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
}

    <label class="small" for="rkName">Tu nombre</label>

    c.font = `500 ${Math.max(13, sz * .32)}px Lexend, system-ui, sans-serif`; c.fillStyle = "#f1f1ec"; c.fillText("Tu célula ya es pelo. Volviendo al menú…", CW / 2, CH / 2 + sz * .55);
    c.globalAlpha = 1;
  }
  cardT += dt; if (cardT > .25) { cardT = 0; cardNow(); }
  raf = requestAnimationFrame(loop);
}
function open() {
  startMusic(); setMusicMode("game");
  ov.classList.add("on"); ov.setAttribute("aria-hidden", "false");
  reset(); KR.on = true; T = 0; setStage(1);
  lastT = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function close() {
  KR.on = false; cancelAnimationFrame(raf); ov.classList.remove("on"); ov.setAttribute("aria-hidden", "true");
  setMusicMode("ambient");
}
$("#menuKera").onclick = open;
$("#krBack").onclick = close;
if (window.ResizeObserver) new ResizeObserver(() => { if (KR.on) resize(); }).observe(view);
window.addEventListener("resize", () => { if (KR.on) resize(); });
KR.xf = () => ({ SC: KK(), OX: CW / 2 - cam.x * KK(), OY: CH / 2 - cam.y * KK() });
KR.cam = cam; KR.setStage = n => setStage(n);
window.__KR = KR;
})();
