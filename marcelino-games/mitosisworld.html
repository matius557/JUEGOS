        else if(o.mode=='bad'){
          if(tn-o.bt<350){o.lx+=(o.bx-o.lx)*0.25;o.ly+=(o.by-o.ly)*0.25;}

    ctx.beginPath();ctx.moveTo(f.p1[0],f.p1[1]);ctx.lineTo(f.p2[0],f.p2[1]);ctx.stroke();
  });
  trail=trail.filter(p=>now-p.t<260);
  ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){

}

function tone(f,t0,dur,type,vol,dest,att,fEnd){

function noise(t0,dur,vol,ft,f0,f1,dest){

function ripple(c,x,y,s){for(let i=0;i<N;i++){const a=i/N*6.2832,d=Math.hypot(c.x+Math.cos(a)*c.R-x,c.y+Math.sin(a)*c.R-y),m=c.R*0.7;if(d<m)c.vv[i]-=(1-d/m)*s;}}
function cellPts(c){
  const p=c.p,rho=1-0.4*p,d=0.6*p,ca=Math.cos(c.ax),sa=Math.sin(c.ax),P=[];
  for(let i=0;i<N;i++){
    const th=i/N*6.2832,cs=Math.cos(th),sn=Math.sin(th);
    const rad=(Math.abs(d*cs)+Math.sqrt(Math.max(0,rho*rho-d*d*sn*sn)))*c.rr[i]*c.R,X=cs*rad,Y=sn*rad;
    P.push([c.x+X*ca-Y*sa,c.y+X*sa+Y*ca]);
  }
  return P;
}
function ptsPath(P){
  const n=P.length;ctx.beginPath();
  ctx.moveTo((P[n-1][0]+P[0][0])/2,(P[n-1][1]+P[0][1])/2);
  for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
  ctx.closePath();
}
function drawCell(c){
  const P=cellPts(c),R0=c.R;ptsPath(P);
  const g=ctx.createRadialGradient(c.x-R0*0.3,c.y-R0*0.35,R0*0.1,c.x,c.y,R0*1.15);
  g.addColorStop(0,'rgba(150,235,200,0.55)');g.addColorStop(0.7,'rgba(60,170,140,0.45)');g.addColorStop(1,'rgba(30,120,110,0.75)');
  ctx.fillStyle=g;ctx.fill();ctx.lineWidth=Math.max(1.5,Math.min(3,R0*0.03));ctx.strokeStyle='rgba(170,255,225,0.7)';ctx.stroke();
  ctx.save();ptsPath(P);ctx.clip();
  const h=ctx.createRadialGradient(c.x-R0*0.4,c.y-R0*0.5,0,c.x-R0*0.4,c.y-R0*0.5,R0*0.5);
  h.addColorStop(0,'rgba(255,255,255,0.35)');h.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=h;ctx.fillRect(c.x-R0*1.3,c.y-R0*1.3,R0*2.6,R0*2.6);ctx.restore();
}
function splitCell(c){
  const ca=Math.cos(c.ax),sa=Math.sin(c.ax),rad=c.R*0.6;
  const kids=[-1,1].map((s,i)=>{const k=mkCell(c.x+ca*s*rad,c.y+sa*s*rad,rad);k.pi=c.ax===0?i:c.pi;k.sd=i;k.TR=rad;k.TX=k.x;k.TY=k.y;return k;});
  MZ.chs.forEach(ch=>{
    if(ch.cell!==c)return;
    const ox=ch.x*c.R,oy=ch.y*c.R,s=(ox*ca+oy*sa)<0?0:1,sg=s?1:-1,kc=kids[s];
    const cv2=(x,y)=>[(x*c.R-sg*ca*rad)/rad,(y*c.R-sg*sa*rad)/rad];
    const a=cv2(ch.x,ch.y),b=cv2(ch.tx,ch.ty);
    ch.cell=kc;ch.x=a[0];ch.y=a[1];ch.tx=b[0];ch.ty=b[1];
  });
  MZ.cells=MZ.cells.filter(x=>x!==c).concat(kids);
  return kids;
}

/* --- cromosomas --- */
const Lc=ch=>Math.max(15,ch.cell.R*0.15)*ch.sz;
function mkChs(c){
  const st=[[-0.5,-0.32],[0.52,0.3],[0.4,-0.5],[-0.42,0.46]];
  return CCOL.map((col,i)=>{
    const b=chromo.find(q=>q.col===col)||{x:0,y:0,r:0};
    return{id:i,col,pair:i>>1,sz:i<2?1:0.74,cell:c,x:b.x,y:b.y,tx:st[i][0],ty:st[i][1],rot:b.r,trot:0,sep:0,flip:0,sc:1,seg:[null,null],single:null,tet:null,grab:false,u:0,slot:-1,ph:i*1.7,fib:null,hx:0,hy:0,gx:0,gy:0,bx:0,k:0.16};
  });
}
function chromatid(x,y,L,ux,uy,col,seg,lw,u,ph){
  const vx=-uy,vy=ux,ex=x+ux*0.8*L,ey=y+uy*0.8*L,a=[ex+vx*L,ey+vy*L],b=[ex-vx*L,ey-vy*L],T=performance.now()/1000;
  ctx.lineCap='round';ctx.lineJoin='round';
  const poly=(w,cl2)=>{
    ctx.strokeStyle=cl2;ctx.lineWidth=w;ctx.beginPath();
    if(u>0.03){
      for(let k=0;k<=24;k++){
        const t=k/24,q=t<0.5?[a[0]+(x-a[0])*t*2,a[1]+(y-a[1])*t*2]:[x+(b[0]-x)*(t-0.5)*2,y+(b[1]-y)*(t-0.5)*2];
        const wv=Math.sin(t*13+ph*2+T*2)*L*0.45*u,wv2=Math.cos(t*9+ph+T*1.5)*L*0.2*u,sh=1-0.35*u;
        const px2=x+(q[0]-x)*sh+ux*wv+vx*wv2,py2=y+(q[1]-y)*sh+uy*wv+vy*wv2;
        if(k)ctx.lineTo(px2,py2);else ctx.moveTo(px2,py2);
      }
    }else{ctx.moveTo(a[0],a[1]);ctx.lineTo(x,y);ctx.lineTo(b[0],b[1]);}
    ctx.stroke();
  };
  poly(lw*(1-0.6*u),col);
  if(u<0.7)poly(lw*0.3,'rgba(255,255,255,'+(0.35*(1-u/0.7))+')');
  if(seg&&u<0.5){ctx.strokeStyle=seg;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo((a[0]+x)/2,(a[1]+y)/2);ctx.lineTo(a[0],a[1]);ctx.stroke();}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,Math.max(1,lw*0.5*(1-u)),0,7);ctx.fill();
}
function drawCh(ch,ts){
  const c=ch.cell,L=Lc(ch)*ch.sc;if(L<1)return;
  let x=c.x+ch.x*c.R,y=c.y+ch.y*c.R;
  if(MZ.ms==='syn'&&!ch.grab&&!ch.tet){x+=Math.sin(ts*0.9+ch.ph)*c.R*0.012;y+=Math.cos(ts*0.8+ch.ph)*c.R*0.012;}
  const lw=Math.max(5,c.R*0.045),spp=ch.sep*c.R,f=1-2*ch.flip;
  ctx.save();ctx.globalAlpha=Math.min(1,ch.sc*1.5);
  if(ch.grab){ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,L*1.5,0,7);ctx.stroke();}
  (ch.single!==null?[ch.single]:[0,1]).forEach(k=>{
    const a=ch.rot+(k?0:Math.PI),ux=Math.cos(a),uy=Math.sin(a);
    chromatid(x+ux*spp,y+uy*spp,L,ux*f,uy*f,ch.col,ch.seg[k],lw,ch.u,ch.ph+k);
  });
  ctx.restore();
}
function drawCent(x,y,cr,ring){
  const gg=ctx.createRadialGradient(x,y,0,x,y,cr*2);
  gg.addColorStop(0,'rgba(255,235,90,0.9)');gg.addColorStop(1,'rgba(255,200,0,0)');
  ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y,cr*2,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,230,90,1)';ctx.lineWidth=2;
  for(let q=0;q<8;q++){const a2=q*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(a2)*cr,y+Math.sin(a2)*cr);ctx.lineTo(x+Math.cos(a2)*cr*1.9,y+Math.sin(a2)*cr*1.9);ctx.stroke();}
  ctx.fillStyle='#ffe95a';ctx.beginPath();ctx.arc(x,y,cr*0.6,0,7);ctx.fill();
  if(ring!==undefined){
    ctx.strokeStyle='rgba(255,240,120,'+(0.5+0.3*Math.sin(mTS()*5))+')';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(x,y,cr*2.6,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0.02,ring));ctx.stroke();
  }
}

/* --- inicio de la meiosis (tras romper la envoltura) --- */
function mInit(){
  MZ.on=true;phase=-50;MZ.ms='syn';
  const c=mkCell(cx,cy,R);for(let i=0;i<N;i++)c.rr[i]=r[i]/R;
  c.TX=W/2;c.TY=H/2;c.TR=RZ();
  MZ.cells=[c];MZ.chs=mkChs(c);MZ.tets=[];MZ.fib=[];MZ.pl=[0,0];MZ.holds={};MZ.sw={};MZ.drag=null;MZ.dragF=null;MZ.fl=[];
  cntEl.textContent='Apareados: 0/2';go('m_syn',true);
}

/* --- entradas --- */
function mPick(list){
  let best=null,bd=1e9;
  list.forEach(ch=>{const c=ch.cell,x=c.x+ch.x*c.R,y=c.y+ch.y*c.R,d=Math.hypot(px-x,py-y);if(d<Math.max(28,Lc(ch)*1.7)&&d<bd){bd=d;best=ch;}});
  return best;
}
function mGrab(ch,e){
  const c=ch.cell;ch.grab=true;ch.slot=-1;ch.hx=ch.x;ch.hy=ch.y;
  ch.gx=ch.x-(px-c.x)/c.R;ch.gy=ch.y-(py-c.y)/c.R;MZ.drag={ch};sfxGrab();cv.setPointerCapture(e.pointerId);
}
function placeTet(t,hard){
  const h=t.sp/2,s=t.dir,A=t.a,B=t.b;
  A.tx=t.cx-s*h;B.tx=t.cx+s*h;A.ty=B.ty=t.cy;A.trot=B.trot=s<0?Math.PI:0;
  if(hard){A.x=A.tx;B.x=B.tx;A.y=B.y=t.cy;}
}
function makeTet(a,b){
  const c=a.cell,t={a,b,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,dir:1,slot:-1,crossed:false,sp:2.1*Lc(a)/c.R,fl:0,grab:false,ox:0,oy:0,set:0};
  const l=Math.hypot(t.cx,t.cy);if(l>0.6){t.cx*=0.6/l;t.cy*=0.6/l;}
  a.tet=b.tet=t;MZ.tets.push(t);placeTet(t,false);
  MZ.fl.push({c,x:t.cx,y:t.cy,t:performance.now(),col:'120,255,170'});sfxSnap();
  cntEl.textContent='Apareados: '+MZ.tets.length+'/2';
  if(MZ.tets.length===2){MZ.ms='cross';go('m_cross',true);cntEl.textContent='Entrecruzamiento: 0/2';}
}
function synDrop(ch){
  const c=ch.cell,lim=2.7*Lc(ch)/c.R;let best=null,bd=lim;
  MZ.chs.forEach(o=>{if(o===ch)return;const d=Math.hypot(o.x-ch.x,o.y-ch.y);if(d<bd){bd=d;best=o;}});
  if(!best)return;
  if(best.pair===ch.pair&&!best.tet&&!ch.tet)makeTet(ch,best);
  else{ch.tx=ch.hx;ch.ty=ch.hy;MZ.fl.push({c,x:ch.x,y:ch.y,t:performance.now(),col:'255,80,80'});sfxBad();}
}
function doCross(t){
  t.crossed=true;t.fl=performance.now();
  t.a.seg[1]=t.b.col;t.b.seg[0]=t.a.col;
  MZ.fl.push({c:t.a.cell,x:t.cx,y:t.cy,t:performance.now(),col:'255,255,255',big:1});sfxSnap();sfxPop(900);
  const n=MZ.tets.filter(q=>q.crossed).length;cntEl.textContent='Entrecruzamiento: '+n+'/2';
  if(n===2)MZ.nextAt=performance.now()+1800;
}
function buildFib(){
  MZ.fib=[];
  [-1,1].forEach(sg=>{for(let j=0;j<10;j++)MZ.fib.push({sg,th:(j-4.5)/9*2.2,ph:Math.random()*6.28+j,x:0,y:0,ch:null,grab:false});});
}
function metaDrop(t){
  t.grab=false;t.a.grab=t.b.grab=false;
  if(Math.abs(t.cx)<0.24){
    let best=-1,bd=9;
    mSL.forEach((sy,i)=>{if(MZ.tets.some(o=>o!==t&&o.slot===i))return;const d=Math.abs(sy-t.cy);if(d<bd){bd=d;best=i;}});
    if(best>=0){t.slot=best;t.cx=0;t.cy=mSL[best];if(!t.set){t.set=1;t.dir=Math.random()<0.5?1:-1;}placeTet(t,false);sfxSnap();}
  }
  const n=MZ.tets.filter(q=>q.slot>=0).length;cntEl.textContent='Alineadas: '+n+'/2';
  if(n===2){MZ.ms='kineto';go('m_kineto',true);cntEl.textContent='Conectados: 0/4';}
}
function meta2Drop(ch){
  const c=ch.cell;
  if(Math.abs(ch.y)<0.24){
    const mates=MZ.chs.filter(o=>o!==ch&&o.cell===c);
    let best=-1,bd=9;
    mSL2.forEach((sx,i)=>{if(mates.some(o=>o.slot===i))return;const d=Math.abs(sx-ch.x);if(d<bd){bd=d;best=i;}});
    if(best>=0){ch.slot=best;ch.tx=mSL2[best];ch.ty=0;ch.trot=Math.PI/2;sfxSnap();}
  }
  const n=MZ.chs.filter(q=>q.slot>=0).length;cntEl.textContent='Alineados: '+n+'/4';
  if(n===4){MZ.ms='ana2';MZ.holds={};MZ.p2=[0,0];go('m_ana2',true);cntEl.textContent='Tensión: 0%';}
}
function mDown(e){
  px=e.clientX;py=e.clientY;
  const ms=MZ.ms,c0=MZ.cells[0];
  MZ.cells.forEach(c=>{if(Math.hypot(px-c.x,py-c.y)<c.R*1.1)ripple(c,px,py,0.06);});
  if(ms==='syn'){const ch=mPick(MZ.chs.filter(q=>!q.tet));if(ch)mGrab(ch,e);}
  else if(ms==='cross'){MZ.tets.forEach(t=>{if(t.crossed)return;const x=c0.x+t.cx*c0.R,y=c0.y+t.cy*c0.R;if(Math.hypot(px-x,py-y)<Math.max(34,t.sp*c0.R*0.8))doCross(t);});}
  else if(ms==='meta1'){
    const ch=mPick(MZ.chs);
    if(ch&&ch.tet){const t=ch.tet;t.slot=-1;t.grab=true;t.ox=t.cx-(px-c0.x)/c0.R;t.oy=t.cy-(py-c0.y)/c0.R;t.a.grab=t.b.grab=true;MZ.drag={t};sfxGrab();cv.setPointerCapture(e.pointerId);}
  }
  else if(ms==='kineto'){
    let best=null,bd=Math.max(28,c0.R*0.17);
    MZ.fib.forEach(f=>{if(f.ch)return;const d=Math.hypot(px-(c0.x+f.x*c0.R),py-(c0.y+f.y*c0.R));if(d<bd){bd=d;best=f;}});
    if(best){best.grab=true;MZ.dragF=best;sfxGrab();cv.setPointerCapture(e.pointerId);}
  }
  else if(ms==='tension'){
    [0,1].forEach(i=>{
      const sg=i?1:-1;
      if(Math.hypot(px-(c0.x+poleX(sg)*c0.R),py-c0.y)<Math.max(36,c0.R*0.22)){MZ.holds[e.pointerId]=i;MZ.pl[i]=Math.min(1,MZ.pl[i]+0.1);sfxClick();cv.setPointerCapture(e.pointerId);}
    });
  }
  else if(ms==='cyto1'||ms==='cyto2'){MZ.sw[e.pointerId]={x:px,y:py};cv.setPointerCapture(e.pointerId);}
  else if(ms==='meta2'){const ch=mPick(MZ.chs);if(ch)mGrab(ch,e);}
  else if(ms==='ana2'&&!MZ.sepT){
    MZ.cells.forEach(c=>{if(Math.hypot(px-c.x,py-c.y)<c.R*1.05){MZ.p2[c.pi]=Math.min(1,MZ.p2[c.pi]+0.11);MZ.holds[e.pointerId]=c;sfxTap();cv.setPointerCapture(e.pointerId);}});
  }
}
function mMove(e){
  const x=e.clientX,y=e.clientY,c0=MZ.cells[0],d=MZ.drag;
  if(d&&d.ch){
    const ch=d.ch,c=ch.cell;let nx2=(x-c.x)/c.R+ch.gx,ny2=(y-c.y)/c.R+ch.gy;const l=Math.hypot(nx2,ny2);
    if(l>0.82){nx2*=0.82/l;ny2*=0.82/l;}
    ch.x=ch.tx=nx2;ch.y=ch.ty=ny2;
  }
  if(d&&d.t){
    const t=d.t;let nx2=(x-c0.x)/c0.R+t.ox,ny2=(y-c0.y)/c0.R+t.oy;const l=Math.hypot(nx2,ny2);
    if(l>0.66){nx2*=0.66/l;ny2*=0.66/l;}
    t.cx=nx2;t.cy=ny2;placeTet(t,true);
  }
  if(MZ.dragF){MZ.dragF.x=(x-c0.x)/c0.R;MZ.dragF.y=(y-c0.y)/c0.R;}
  const sw=MZ.sw[e.pointerId];
  if(sw){
    if(MZ.ms==='cyto1'){
      if(Math.abs(x-c0.x)<c0.R*0.34)MZ.fu=Math.min(1,MZ.fu+Math.abs(y-sw.y)/(2*c0.R)*0.2);
      if(Math.abs(y-sw.y)>4)sfxPinch(MZ.fu);
    }else{
      let best=null,bd=1e9;
      MZ.cells.forEach(c=>{const dd=Math.hypot(x-c.x,y-c.y);if(dd<c.R*1.15&&dd<bd){bd=dd;best=c;}});
      if(best&&Math.abs(y-best.y)<best.R*0.34){MZ.fu2[best.pi]=Math.min(1,MZ.fu2[best.pi]+Math.abs(x-sw.x)/(2*best.R)*0.3);if(Math.abs(x-sw.x)>4)sfxPinch(MZ.fu2[best.pi]);}
    }
    sw.x=x;sw.y=y;trail.push({x,y,t:performance.now()});
  }
  px=x;py=y;
}
function mUp(e){
  delete MZ.sw[e.pointerId];delete MZ.holds[e.pointerId];
  const c0=MZ.cells[0];
  if(MZ.dragF){
    const f=MZ.dragF;MZ.dragF=null;f.grab=false;
    let best=null,bd=0.26;
    MZ.chs.forEach(ch=>{const dd=Math.hypot(ch.x-f.x,ch.y-f.y);if(dd<bd){bd=dd;best=ch;}});
    if(best){
      if(!best.fib&&(best.x<0?-1:1)===f.sg){f.ch=best;best.fib=f;sfxConnect();MZ.fl.push({c:c0,x:best.x,y:best.y,t:performance.now(),col:'255,235,90'});}
      else{sfxBad();MZ.fl.push({c:c0,x:best.x,y:best.y,t:performance.now(),col:'255,80,80'});}
    }
    const n=MZ.chs.filter(q=>q.fib).length;cntEl.textContent='Conectados: '+n+'/4';
    if(n===4){MZ.ms='tension';MZ.holds={};MZ.chs.forEach(ch=>{ch.bx=ch.x;});go('m_tension',true);cntEl.textContent='Tensión: 0%';}
    return;
  }
  const d=MZ.drag;if(!d)return;MZ.drag=null;
  if(d.ch){const ch=d.ch;ch.grab=false;if(MZ.ms==='syn')synDrop(ch);else if(MZ.ms==='meta2')meta2Drop(ch);}
  else if(d.t)metaDrop(d.t);
}

/* --- lógica por etapas --- */
function fibStep(now,ts){
  const mg=sm((now-MZ.tp)/2600);
  MZ.fib.forEach(f=>{
    if(f.grab)return;
    let tx,ty;
    if(f.ch){tx=f.ch.x+f.sg*0.035;ty=f.ch.y;}
    else{tx=f.sg*mg*(0.78-0.55*Math.cos(f.th))+Math.sin(ts*1.1+f.ph)*0.015;ty=Math.sin(f.th)*0.55*mg+Math.cos(ts*0.9+f.ph*1.3)*0.015;}
    f.x+=(tx-f.x)*0.15;f.y+=(ty-f.y)*0.15;
  });
}
function toAna1(now){
  MZ.ms='ana1';MZ.anaT=now;MZ.holds={};go('m_ana1',true);sfxSplit();cntEl.textContent='';
  [-1,1].forEach(sg=>{
    const list=MZ.chs.filter(ch=>(ch.bx<0?-1:1)===sg).sort((a,b)=>a.y-b.y);
    list.forEach((ch,i)=>{ch.tx=sg*0.58;ch.ty=i?0.22:-0.22;ch.k=0.035;});
  });
}
function toMeta2(now){
  MZ.ms='meta2';MZ.tp2=now;MZ.holds={};MZ.p2=[0,0];
  MZ.cells.forEach(c=>{c.TR=R2();c.TX=W/2+(c.pi?1:-1)*R2()*1.07;c.TY=H/2;});
  const sc=[[-0.45,-0.42],[0.42,0.4]];
  MZ.cells.forEach(c=>{MZ.chs.filter(ch=>ch.cell===c).forEach((ch,i)=>{ch.tx=sc[i][0];ch.ty=sc[i][1];ch.trot=Math.PI/2;ch.slot=-1;ch.fib=null;ch.k=0.16;});});
  go('m_meta2');cntEl.textContent='Alineados: 0/4';
}
function toCyto2(now){
  const out=[];
  MZ.chs.forEach(ch=>{[0,1].forEach(k=>{
    const a=ch.rot+(k?0:Math.PI),xx=ch.x+Math.cos(a)*ch.sep,yy=ch.y+Math.sin(a)*ch.sep;
    out.push({id:ch.id,col:ch.col,pair:ch.pair,sz:ch.sz,cell:ch.cell,x:xx,y:yy,tx:xx,ty:yy,rot:ch.rot,trot:ch.rot,sep:0,flip:1,sc:1,seg:ch.seg,single:k,tet:null,grab:false,u:0,slot:-1,ph:ch.ph+k,fib:null,hx:0,hy:0,gx:0,gy:0,bx:0,k:0.16});
  });});
  MZ.chs=out;MZ.ms='cyto2';MZ.sepT=0;MZ.fu2=[0,0];MZ.sw={};
  MZ.cells.forEach(c=>{c.ax=Math.PI/2;c.bandT=now;c.fvv=0;});
  go('m_cyto2',true);cntEl.textContent='Divididas: 0/2';
}
function toDone(now){
  MZ.ms='done';MZ.nucT=now;MZ.doneAt=now;MZ.nuc=0;MZ.sw={};
  const r4=R4();
  MZ.cells.forEach(c=>{c.TR=r4;c.TX=W/2+(c.pi?1:-1)*(r4+3);c.TY=H/2+(c.sd?1:-1)*(r4+3);});
  MZ.cells.forEach(c=>{MZ.chs.filter(ch=>ch.cell===c).forEach((ch,j)=>{ch.tx=j?0.16:-0.16;ch.ty=j?0.08:-0.08;ch.k=0.05;});});
  go('m_done',true);cntEl.textContent='';
}
function toEnd(now){MZ.ms='end';MZ.endT=now;MZ.ef={};cntEl.textContent='';}
function mStep(){
  const now=performance.now(),ts=now/1000,ms=MZ.ms;
  MZ.cells.forEach(cellStep);
  MZ.chs.forEach(ch=>{
    if(!ch.grab){ch.x+=(ch.tx-ch.x)*ch.k;ch.y+=(ch.ty-ch.y)*ch.k;}
    ch.rot+=(ch.trot-ch.rot)*0.15;
  });
  if(MZ.fib.length)fibStep(now,ts);
  MZ.fibA+=(((ms==='cyto1'||ms==='prop2')?0:1)-MZ.fibA)*0.05;
  MZ.freeA+=(((ms==='prometa'||ms==='meta1'||ms==='kineto')?1:0.12)-MZ.freeA)*0.05;
  const c0=MZ.cells[0];
  if(ms==='cross'){
    if(MZ.nextAt&&now>MZ.nextAt){MZ.nextAt=0;MZ.ms='prometa';MZ.tp=now;buildFib();go('m_prometa',true);cntEl.textContent='';}
  }
  else if(ms==='prometa'){
    if(now-MZ.tp>3200){MZ.ms='meta1';go('m_meta1');cntEl.textContent='Alineadas: 0/2';}
  }
  else if(ms==='tension'){
    Object.keys(MZ.holds).forEach(k=>{const i=MZ.holds[k];MZ.pl[i]=Math.min(1,MZ.pl[i]+0.007);});
    const T=(MZ.pl[0]+MZ.pl[1])/2;
    if(Object.keys(MZ.holds).length)sfxTension(T);
    MZ.chs.forEach(ch=>{const i=ch.bx<0?0:1,sg=i?1:-1;ch.x=ch.tx=ch.bx+sg*0.05*MZ.pl[i]+Math.sin(ts*45+ch.ph)*0.004*T;});
    cntEl.textContent='Tensión: '+Math.round(T*100)+'%';
    if(MZ.pl[0]>=1&&MZ.pl[1]>=1)toAna1(now);
  }
  else if(ms==='ana1'){
    if(now-MZ.anaT>3300){
      MZ.ms='cyto1';c0.TR=RC();c0.TX=W/2;c0.TY=H/2;MZ.bandT=now;MZ.fu=0;MZ.fv=0;MZ.sw={};
      MZ.chs.forEach(ch=>{ch.k=0.16;});go('m_cyto1');cntEl.textContent='Constricción: 0%';
    }
  }
  else if(ms==='cyto1'){
    MZ.fv+=(MZ.fu-MZ.fv)*0.08;c0.p=MZ.fv;cntEl.textContent='Constricción: '+Math.round(MZ.fv*100)+'%';
    if(MZ.fv>0.985){
      sfxDivide();splitCell(c0);MZ.fib=[];MZ.sw={};MZ.ms='prop2';MZ.nextAt=now+2600;MZ.fu2=[0,0];
      go('m_cyto1done',true);cntEl.textContent='';
    }
  }
  else if(ms==='prop2'){
    if(now>MZ.nextAt)toMeta2(now);
  }
  else if(ms==='ana2'){
    if(!MZ.sepT){
      Object.keys(MZ.holds).forEach(k=>{const c=MZ.holds[k];MZ.p2[c.pi]=Math.min(1,MZ.p2[c.pi]+0.006);});
      const T=(MZ.p2[0]+MZ.p2[1])/2;
      if(Object.keys(MZ.holds).length)sfxTension(T);
      MZ.chs.forEach(ch=>{const p=MZ.p2[ch.cell.pi];ch.sep=0.07*p+Math.sin(ts*45+ch.ph)*0.004*p;});
      cntEl.textContent='Tensión: '+Math.round(T*100)+'%';
      if(MZ.p2[0]>=1&&MZ.p2[1]>=1){MZ.sepT=now;sfxSplit();cntEl.textContent='';}
    }else{
      const u=sm((now-MZ.sepT)/2600);
      MZ.chs.forEach(ch=>{ch.sep=0.07+0.55*u;ch.flip=sm((u-0.15)/0.7);});
      if(now-MZ.sepT>2900)toCyto2(now);
    }
  }
  else if(ms==='cyto2'){
    MZ.cells.slice().forEach(c=>{
      if(c.ax===0)return;
      c.fvv+=(MZ.fu2[c.pi]-c.fvv)*0.08;c.p=c.fvv;
      if(c.fvv>0.985){sfxDivide();splitCell(c);}
    });
    const rem=MZ.cells.filter(c=>c.ax!==0).length;
    cntEl.textContent='Divididas: '+(2-rem)+'/2';
    if(rem===0)toDone(now);
  }
  else if(ms==='done'){
    MZ.nuc=sm((now-MZ.nucT-900)/3200);MZ.chs.forEach(ch=>{ch.u=MZ.nuc;});
    if(now-MZ.doneAt>10500)toEnd(now);
  }
}

/* --- dibujo de las etapas --- */
function ring(x,y,rd,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x,y,rd,0,7);ctx.stroke();}
function eqLine(x,y,R0,vert,al,ok,wid){
  ctx.save();ctx.shadowBlur=R0*0.1;ctx.shadowColor=ok?'#7dffb0':'#fff6a0';
  ctx.strokeStyle=(ok?'rgba(150,255,190,':'rgba(255,250,190,')+al+')';ctx.lineWidth=R0*0.015+(wid||0);
  ctx.beginPath();
  if(vert){ctx.moveTo(x,y-R0*0.92);ctx.lineTo(x,y+R0*0.92);}else{ctx.moveTo(x-R0*0.92,y);ctx.lineTo(x+R0*0.92,y);}
  ctx.stroke();ctx.restore();
}
function drawBand(c,now){
  const al=Math.min(1,(now-(c.bandT||MZ.bandT))/1200)*0.55*(1-c.p*0.5);
  ctx.save();ptsPath(cellPts(c));ctx.clip();ctx.translate(c.x,c.y);ctx.rotate(c.ax);
  const g=ctx.createLinearGradient(-c.R*0.17,0,c.R*0.17,0);
  g.addColorStop(0,'rgba(0,15,20,0)');g.addColorStop(0.5,'rgba(0,15,20,'+al+')');g.addColorStop(1,'rgba(0,15,20,0)');
  ctx.fillStyle=g;ctx.fillRect(-c.R*0.2,-c.R*1.3,c.R*0.4,c.R*2.6);ctx.restore();
  if(c.p>0.02){
    const rho=1-0.4*c.p,d=0.6*c.p,nh=Math.sqrt(Math.max(0,rho*rho-d*d))*c.R,ca=Math.cos(c.ax),sa=Math.sin(c.ax);
    [-1,1].forEach(s=>{
      const Y=s*nh,qx=c.x-Y*sa,qy=c.y+Y*ca;
      ctx.strokeStyle='rgba(255,190,110,'+Math.min(1,c.p*3)+')';ctx.lineWidth=3+c.p*3;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(qx-ca*c.R*0.09,qy-sa*c.R*0.09);ctx.lineTo(qx+ca*c.R*0.09,qy+sa*c.R*0.09);ctx.stroke();
    });
  }
}
function drawNuc(c,u){
  const nr=c.R*0.62,al=Math.min(1,u*1.3)*0.62,T6=6.2832;
  const g=ctx.createRadialGradient(c.x-nr*0.3,c.y-nr*0.3,nr*0.1,c.x,c.y,nr);
  g.addColorStop(0,'rgba(141,149,148,'+al+')');g.addColorStop(1,'rgba(74,81,80,'+al+')');
  ctx.beginPath();ctx.arc(c.x,c.y,nr,0,7);ctx.fillStyle=g;ctx.fill();
}
function drawNucEnv(c,u){
  const nr=c.R*0.62,T6=6.2832;ctx.lineWidth=Math.max(1.5,c.R*0.025);ctx.lineCap='round';
  for(let i=0;i<M;i++){
    if(jit[i]>u*1.05)continue;
    const a=(i+0.5)/M*T6+mTS()*0.5*(1-u);
    ctx.strokeStyle='rgba(205,215,212,'+(0.85-0.25*jit[i])+')';
    ctx.beginPath();ctx.arc(c.x,c.y,nr*(1+0.03*(jit[i]-0.5)),a-T6/M*0.55,a+T6/M*0.55);ctx.stroke();
  }
}
function drawFib1(c,now,ts){
  const mg=sm((now-MZ.tp)/2600);
  MZ.fib.forEach(f=>{
    const sx=c.x+poleX(f.sg)*c.R,sy=c.y,ex=c.x+f.x*c.R,ey=c.y+f.y*c.R,dx=ex-sx,dy=ey-sy,l=Math.hypot(dx,dy)||1;
    const off=Math.sin(ts*1.3+f.ph)*c.R*0.035*(f.ch?0.3*(1-MZ.pl[f.sg<0?0:1]):1);
    const a=(f.ch?0.95:0.6*MZ.freeA)*mg*MZ.fibA;
    if(a<0.02)return;
    ctx.strokeStyle='rgba(255,222,70,'+a+')';ctx.lineWidth=f.ch?c.R*0.011:Math.max(1,c.R*0.007);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo((sx+ex)/2-dy/l*off,(sy+ey)/2+dx/l*off,ex,ey);ctx.stroke();
    if((MZ.ms==='kineto'&&!f.ch)||f.grab){ctx.fillStyle='rgba(255,240,120,0.95)';ctx.beginPath();ctx.arc(ex,ey,c.R*(f.grab?0.026:0.014),0,7);ctx.fill();}
  });
}
function drawFib2(now,ts){
  const mg=sm((now-MZ.tp2)/1800);if(mg<0.02)return;
  MZ.cells.forEach(c=>{
    if(c.ax===0&&MZ.ms==='cyto2')return;
    [-1,1].forEach(sg=>{
      const sx=c.x,sy=c.y+sg*0.78*mg*c.R;
      ctx.lineCap='round';
      for(let j=0;j<6;j++){
        const th=(j-2.5)/5*1.8,ex=c.x+Math.sin(th)*0.55*mg*c.R,ey=c.y+sg*(0.78-0.4*Math.cos(th))*mg*c.R;
        const dx=ex-sx,dy=ey-sy,l=Math.hypot(dx,dy)||1,off=Math.sin(ts*1.3+j+sg)*c.R*0.03;
        ctx.strokeStyle='rgba(255,222,70,'+0.4*mg+')';ctx.lineWidth=Math.max(1,c.R*0.01);
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo((sx+ex)/2-dy/l*off,(sy+ey)/2+dx/l*off,ex,ey);ctx.stroke();
      }
      MZ.chs.forEach(ch=>{
        if(ch.cell!==c)return;
        let x=c.x+ch.x*c.R,y=c.y+ch.y*c.R;
        if(ch.single===null){if(ch.slot<0)return;y+=sg*ch.sep*c.R;}
        else if((sg<0)!==(ch.single===0))return;
        ctx.strokeStyle='rgba(255,226,80,0.9)';ctx.lineWidth=Math.max(1.5,c.R*0.012);
        ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(x,y);ctx.stroke();
      });
    });
  });
}
function mDraw(){
  const now=performance.now(),ts=now/1000,ms=MZ.ms;
  if(ms==='end'){drawEnd(now);return;}
  const c0=MZ.cells[0];
  MZ.cells.forEach(drawCell);
  if(ms==='cyto1'||ms==='cyto2')MZ.cells.forEach(c=>{if(c.ax!==0||ms==='cyto1')drawBand(c,now);});
  if(MZ.nuc>0.02)MZ.cells.forEach(c=>drawNuc(c,MZ.nuc));
  // líneas ecuatoriales
  if(ms==='meta1'){
    const near=MZ.drag&&MZ.drag.t?Math.max(0,1-Math.abs(MZ.drag.t.cx)/0.3):0;
    eqLine(c0.x,c0.y,c0.R,true,0.55+0.2*Math.sin(ts*3)+0.25*near,false,c0.R*0.01*near);
  }else if(ms==='kineto'||ms==='tension')eqLine(c0.x,c0.y,c0.R,true,1,true,0);
  else if(ms==='ana1')eqLine(c0.x,c0.y,c0.R,true,Math.max(0,1-(now-MZ.anaT)/1500),true,0);
  else if(ms==='meta2'||ms==='ana2'){
    const fade=MZ.sepT?Math.max(0,1-(now-MZ.sepT)/1400):1;
    MZ.cells.forEach(c=>{
      const mine=MZ.chs.filter(ch=>ch.cell===c),ok=mine.length>0&&mine.every(ch=>ch.slot>=0);
      const la=Math.min(1,(now-MZ.tp2)/900),near=MZ.drag&&MZ.drag.ch&&MZ.drag.ch.cell===c?Math.max(0,1-Math.abs(MZ.drag.ch.y)/0.3):0;
      eqLine(c.x,c.y,c.R,false,ok?fade:la*(0.55+0.2*Math.sin(ts*3)+0.25*near),ok,c.R*0.01*near);
    });
  }
  // cromosomas
  if(MZ.tets.length&&(ms==='cross'||ms==='prometa'||ms==='meta1'||ms==='kineto')){
    MZ.tets.forEach(t=>{
      const c=t.a.cell,x=c.x+t.cx*c.R,y=c.y+t.cy*c.R,L=Lc(t.a);
      ctx.strokeStyle='rgba(255,255,255,0.22)';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.ellipse(x,y,t.sp*c.R*0.5+L*1.1,L*1.45,0,0,7);ctx.stroke();ctx.setLineDash([]);
    });
  }
  MZ.chs.forEach(ch=>drawCh(ch,ts));
  // pistas
  if(ms==='syn'&&MZ.drag&&MZ.drag.ch){
    const g=MZ.drag.ch;
    MZ.chs.forEach(o=>{if(o!==g&&o.pair===g.pair&&!o.tet){const c=o.cell;ring(c.x+o.x*c.R,c.y+o.y*c.R,Lc(o)*1.7,'rgba(255,255,255,'+(0.4+0.4*Math.sin(ts*6))+')',3);}});
  }
  if(ms==='cross')MZ.tets.forEach(t=>{
    if(t.crossed)return;const c=t.a.cell,x=c.x+t.cx*c.R,y=c.y+t.cy*c.R;
    ring(x,y,Math.max(20,t.sp*c.R*0.55)*(1+0.12*Math.sin(ts*5)),'rgba(255,255,255,'+(0.5+0.4*Math.sin(ts*5))+')',3);
    ctx.fillStyle='rgba(255,255,255,'+(0.5+0.4*Math.sin(ts*5))+')';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();
  });
  if(ms==='kineto')MZ.chs.forEach(ch=>{if(!ch.fib){const c=ch.cell;ring(c.x+ch.x*c.R,c.y+ch.y*c.R,Lc(ch)*1.3,'rgba(255,255,255,'+(0.35+0.3*Math.sin(ts*4))+')',2);}});
  // centrosomas y huso
  if(['prometa','meta1','kineto','tension','ana1','cyto1'].includes(ms)){
    if(MZ.fib.length&&MZ.fibA>0.02)drawFib1(c0,now,ts);
    [-1,1].forEach(sg=>{const i=sg<0?0:1;drawCent(c0.x+poleX(sg)*c0.R,c0.y,c0.R*0.07*(1+0.35*MZ.pl[i]),ms==='tension'?MZ.pl[i]:undefined);});
  }
  if(ms==='meta2'||ms==='ana2'||ms==='cyto2'){
    drawFib2(now,ts);
    const mg=sm((now-MZ.tp2)/1800);
    MZ.cells.forEach(c=>{if(c.ax===0&&ms==='cyto2')return;[-1,1].forEach(sg=>drawCent(c.x,c.y+sg*0.78*mg*c.R,c.R*0.075));});
    if(ms==='ana2'&&!MZ.sepT)MZ.cells.forEach(c=>{
      ctx.strokeStyle='rgba(255,240,120,'+(0.5+0.3*Math.sin(ts*5))+')';ctx.lineWidth=4;
      ctx.beginPath();ctx.arc(c.x,c.y,c.R*1.07,-Math.PI/2,-Math.PI/2+6.2832*Math.max(0.02,MZ.p2[c.pi]));ctx.stroke();
    });
  }
  if(MZ.nuc>0.02){
    MZ.cells.forEach(c=>drawNucEnv(c,MZ.nuc));
    ctx.font='700 '+Math.max(13,W*0.04)+'px "Comic Sans MS","Comic Neue",cursive';ctx.textAlign='center';ctx.textBaseline='middle';
    MZ.cells.forEach(c=>{ctx.fillStyle='rgba(255,255,255,'+MZ.nuc+')';ctx.fillText('n',c.x,c.y+c.R*0.82);});
  }
  // destellos y estela
  MZ.fl=MZ.fl.filter(f=>now-f.t<650);
  MZ.fl.forEach(f=>{
    const p=(now-f.t)/650,x=f.c.x+f.x*f.c.R,y=f.c.y+f.y*f.c.R;
    ctx.strokeStyle='rgba('+f.col+','+(1-p)+')';ctx.lineWidth=f.big?4:3;
    ctx.beginPath();ctx.arc(x,y,f.c.R*(0.05+0.25*p*(f.big?1.4:1)),0,7);ctx.stroke();
    if(f.big){ctx.fillStyle='rgba(255,255,255,'+(0.8*(1-p))+')';ctx.beginPath();ctx.arc(x,y,f.c.R*0.05*(1-p)+1,0,7);ctx.fill();}
  });
  trail=trail.filter(p=>now-p.t<260);
  ctx.lineCap='round';
  for(let i=1;i<trail.length;i++){
    const al=1-(now-trail[i].t)/260;
    ctx.strokeStyle='rgba(230,255,250,'+al+')';ctx.lineWidth=1+5*al;
    ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();
  }
}

/* --- final de la meiosis: testículo y ovario --- */
function rrect(x,y,w,h,rd){ctx.beginPath();ctx.moveTo(x+rd,y);ctx.arcTo(x+w,y,x+w,y+h,rd);ctx.arcTo(x+w,y+h,x,y+h,rd);ctx.arcTo(x,y+h,x,y,rd);ctx.arcTo(x,y,x+w,y,rd);ctx.closePath();}
function endLayout(){
  const top=Math.max(116,H*0.15),bot=H-Math.max(150,Math.min(190,H*0.22)),gap=8,ph=(bot-top-gap)/2,pw=Math.min(W-44,430);
  return{x:(W-pw)/2,w:pw,y1:top,y2:top+ph+gap,h:ph};
}
function panel(L,y,tag,fn){
  ctx.save();rrect(L.x,y,L.w,L.h,14);ctx.clip();
  const g=ctx.createRadialGradient(L.x+L.w/2,y+L.h/2,0,L.x+L.w/2,y+L.h/2,L.w*0.7);
  g.addColorStop(0,'#1b2a33');g.addColorStop(1,'#071015');ctx.fillStyle=g;ctx.fillRect(L.x,y,L.w,L.h);
  fn(L.x+L.w/2,y+L.h/2);ctx.restore();
  rrect(L.x,y,L.w,L.h,14);ctx.lineWidth=2;ctx.strokeStyle='#aeb6bf';ctx.stroke();
  ctx.font='600 11px "Share Tech Mono","Courier New",monospace';ctx.fillStyle='#7dffb0';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(tag,L.x+10,y+8);
}
const win=(t,a,b)=>cl((t-a)/0.5)*cl((b-t)/0.5);
function slot(L,y0,n){
  const lx=L.x+12,rx=L.x+L.w-12,ty=y0+L.h*0.2,by=y0+L.h*0.86;
  return n==='TL'?[lx,ty,'L']:n==='TR'?[rx,ty,'R']:n==='BL'?[lx,by,'L']:[rx,by,'R'];
}
function lab(tx,ty,sl,txt,al){
  if(al<=0.01)return;
  ctx.save();ctx.globalAlpha=al;
  const fs=Math.max(11,Math.min(13,W*0.032)),ls=txt.split('\n');
  ctx.font='700 '+fs+'px system-ui,sans-serif';
  let w=0;ls.forEach(s=>{w=Math.max(w,ctx.measureText(s).width);});
  const lx=sl[0],ly=sl[1],left=sl[2]==='L',sx=left?lx+w+5:lx-w-5;
  ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(sx,ly);ctx.lineTo(tx,ty);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(tx,ty,3,0,7);ctx.fill();
  ctx.textAlign=left?'left':'right';ctx.textBaseline='middle';ctx.shadowColor='#000';ctx.shadowBlur=4;
  ls.forEach((s,i)=>ctx.fillText(s,lx,ly+(i-(ls.length-1)/2)*fs*1.2));
  ctx.restore();
}
const mc=(x,y,R0,p,ax)=>({x,y,R:R0,p:p||0,ax:ax||0,rr:ONES});
function miniChr(x,y,s,col,single){
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.4,s*0.38);ctx.lineCap='round';ctx.beginPath();
  if(single){ctx.moveTo(x-s*0.5,y+s);ctx.lineTo(x+s*0.5,y-s);}
  else{ctx.moveTo(x-s,y-s);ctx.lineTo(x+s,y+s);ctx.moveTo(x+s,y-s);ctx.lineTo(x-s,y+s);}
  ctx.stroke();
}
function minis(x,y,R0,cols,single){
  const n=cols.length,s=R0*(n>2?0.17:0.2);
  cols.forEach((c2,i)=>{
    const ox=n>2?(i%2?0.36:-0.36):(i?0.3:-0.3),oy=n>2?(i<2?-0.3:0.3):0;
    miniChr(x+ox*R0,y+oy*R0,s,c2,single);
  });
}
/* célula "micro": con división en curso y cromosomas dentro */
function microCell(it,ox,oy,S,alpha){
  const c=mc(ox+it.x*S,oy+it.y*S,it.R*S,it.p,it.ax);
  ctx.save();ctx.globalAlpha=alpha===undefined?1:alpha;drawCell(c);
  const side=it.side||0,all=CCOL;
  const set=side<0?[all[0],all[2]]:[all[1],all[3]];
  if(it.p>0.05){
    const rho=1-0.4*it.p,d=0.6*it.p*c.R,ca=Math.cos(it.ax),sa=Math.sin(it.ax);
    [-1,1].forEach(s=>{
      const lx=c.x+ca*s*d,ly=c.y+sa*s*d,lr=rho*c.R;
      if(it.n===4)minis(lx,ly,lr,s<0?[all[0],all[2]]:[all[1],all[3]],false);
      else minis(lx,ly,lr,set,true);
    });
  }else{
    if(it.n===4)minis(c.x,c.y,c.R,all,false);

function maleLin(t){

  const sp2=0.02*sm((t-35.5)/2);

const FO=[-0.3,0.28],FA1=-2.3,FA2=-0.7;

  const S=Rf,ox=mx+FO[0]*S,oy=my+FO[1]*S,ts=mTS();
  const u1=sm((t-21)/4.5),u2=sm((t-33)/4.5),u3=sm((t-34)/4),um=sm((t-44)/6);

  const t=(performance.now()-OUT.t0)/1000,fl=OUT.flags;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  [[0.4,'out_tissue'],[9.3,'out_person'],[19.3,'out_earth'],[29.8,'out_galaxy'],[39,'out_universe'],[47.5,'out_end']].forEach(f=>{
    if(t>=f[0]&&!fl[f[1]]){fl[f[1]]=1;go(f[1]);if(f[0]>1)sfxSweep();}
  });
  const fadeIn=cl(t/1.0);
  const aA=cl((10.5-t)/1.5)*fadeIn,aB=cl((t-9)/1.5)*cl((21.5-t)/1.5),aC=cl((t-19)/2)*cl((31-t)/1.5),aD=cl((t-29)/2);
  // estrellas
  let sa=0;
  if(t>=19&&t<31){const Re=t<27?Math.exp(lerpF(Math.log(4*W),Math.log(0.28*W),sm3(cl((t-19)/8)))):0.28*W*Math.exp(-(t-27)*0.9);sa=cl(1.5-Re/W)*aC;}
  if(t>=29)sa=Math.max(sa,aD);
  drawStars(sa,t);
  if(aA>0)sceneA(t,aA);
  if(aB>0)sceneB(t,aB);
  if(aC>0){
    const Re=t<27?Math.exp(lerpF(Math.log(4*W),Math.log(0.28*W),sm3(cl((t-19)/8)))):0.28*W*Math.exp(-(t-27)*0.9);
    drawEarth(t,Re,aC);
  }
  if(t>=29){
    const u=cl((t-29)/18),c=Math.exp(lerpF(Math.log(5*W),Math.log(0.012*W),sm3(u)));
    drawUniverse(t,c,cl((0.3*W-c)/(0.2*W))*aD);
    drawGalaxy(t,c,aD);
    if(c>0.1*W&&c<0.45*W){
      const la=cl((0.45*W-c)/(0.1*W))*cl((c-0.1*W)/(0.05*W));
      const a=0.8,x0=W/2,y0=H/2,ca=Math.cos(-0.4),sa2=Math.sin(-0.4),a2=a+t*0.03,x1=Math.cos(a2)*0.6*c,y1=Math.sin(a2)*0.6*c*0.5,x=x0+x1*ca-y1*sa2,y=y0+x1*sa2+y1*ca;
      ctx.save();ctx.globalAlpha=la;ctx.strokeStyle='#ffe66d';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,5+3*Math.sin(t*4),0,7);ctx.stroke();
      ctx.fillStyle='#ffe66d';ctx.font='12px "Share Tech Mono",monospace';ctx.textAlign='left';ctx.fillText('Aquí estamos',x+12,y-8);ctx.restore();
    }
  }
  if(t>47){
    ctx.save();ctx.globalAlpha=cl((t-47)/2);ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.font='700 '+Math.min(34,W*0.085)+'px "Comic Sans MS","Comic Neue",cursive';ctx.shadowColor='#6dff95';ctx.shadowBlur=16;
    ctx.fillText('Todo comienza con una célula',W/2,H*0.5);ctx.restore();
  }
  if(t>=53&&!OUT.fin){OUT.fin=1;showFin('mitosis');}
}
/* ===== FIN FINAL ===== */

/* ===== PANTALLA FINAL: constancia ===== */
const FD={mitosis:false,meiosis:false,name:'',group:''};
try{const q=JSON.parse(sessionStorage.getItem('fasesDone')||'{}');Object.assign(FD,q);}catch(e){}
function saveFD(){try{sessionStorage.setItem('fasesDone',JSON.stringify(FD));}catch(e){}}
function showFin(mode){
  FD[mode]=true;saveFD();
  const fin=document.getElementById('fin'),card=document.getElementById('fcard'),both=FD.mitosis&&FD.meiosis;
  const nm=mode==='meiosis'?'Meiosis':'Mitosis',other=mode==='meiosis'?'mitosis':'meiosis';
  const bd='<div class="bd"><span class="'+(FD.mitosis?'ok':'')+'">'+(FD.mitosis?'✔ ':'')+'Mitosis</span><span class="'+(FD.meiosis?'ok':'')+'">'+(FD.meiosis?'✔ ':'')+'Meiosis</span></div>';
  if(both){
    card.innerHTML='<h2>¡Completaste los dos modos!</h2><div class="sub">Mitosis y meiosis</div>'+bd+
      '<label for="fn">NOMBRE</label><input id="fn" type="text" maxlength="40" autocomplete="off" enterkeyhint="done" placeholder="Tu nombre y apellido">'+
      '<label for="fg">GRUPO</label><input id="fg" type="text" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="Ej: 1.º 3">'+
      '<div class="dt">'+new Date().toLocaleDateString('es-UY',{day:'numeric',month:'long',year:'numeric'})+'</div>'+
      '<div class="note">📸 Escribí tu nombre y grupo y sacá una captura de pantalla de esta pantalla para enviarla como tarea.</div>'+
      '<button id="fhome">⌂ Ir al inicio</button>';
    const fn=document.getElementById('fn'),fg=document.getElementById('fg');
    fn.value=FD.name||'';fg.value=FD.group||'';
    [fn,fg].forEach(i=>{i.addEventListener('input',()=>{FD.name=fn.value;FD.group=fg.value;saveFD();});i.addEventListener('keydown',e=>{if(e.key==='Enter')i.blur();});});
    speak('Completaste los dos modos. Escribe tu nombre y tu grupo, y saca una captura de pantalla para enviarla como tarea.');
  }else{
    card.innerHTML='<h2>¡'+nm+' completada!</h2><div class="sub">Bien hecho</div>'+bd+
      '<p>Te falta completar la <b>'+other+'</b>. Cuando termines los dos modos aparecerá la pantalla para poner tu nombre y grupo.</p>'+
      '<button id="fhome">⌂ Ir al inicio</button>';
    speak(nm+' completada. Vuelve al inicio para jugar la '+other+'.');
  }
  document.getElementById('fhome').addEventListener('click',()=>{saveFD();location.reload();});
  fin.style.display='flex';void fin.offsetWidth;fin.classList.add('show');
}
(function(){
  const introEl=document.getElementById('intro'),ibg=document.getElementById('ibg'),ttl=document.getElementById('ttl'),isub=document.getElementById('isub');
  const PAL=['#ff5a5f','#ffd23f','#3fa7ff','#b86bff','#6dff95','#ff9f43'],L=[];
  let k=0;
  ['Fases de la','mitosis'].forEach(line=>{
    const d=document.createElement('div');d.className='ln';
    [...line].forEach(c=>{
      const sp=document.createElement('span');sp.className='ch';sp.textContent=c===' '?'\u00A0':c;sp.style.color=PAL[k%PAL.length];
      d.appendChild(sp);L.push({el:sp,x:0,y:0,vx:0,vy:0,r:0,vr:0,s:0,vs:0,ph:Math.random()*6.28,born:1700+k*70});k++;
    });
    ttl.appendChild(d);
  });
  const imode=document.getElementById('imode'),L2=L.slice(11);
  imode.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();const m=b.dataset.m;setMode(m);
    imode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
    L2.forEach((l,i)=>{l.el.textContent=m[i];});sfxPop(m==='meiosis'?760:560);
  }));
  let t0=0,started=false,shake=0,scatter=false,last=null,done=false;
  const gate=document.getElementById('igate');
  const startIntro=()=>{
    if(started)return;started=true;t0=performance.now();gate.style.opacity=0;
    initAudio();speak('Bienvenido.',true);document.getElementById('mute').style.display='flex';
    sfxBeep();
    setTimeout(()=>{ibg.classList.add('on');sfxPing();setMusic('intro');},900);
    setTimeout(()=>{isub.style.opacity=1;document.getElementById('iauth').style.opacity=1;imode.classList.add('on');speak('Elige mitosis o meiosis. Agita las letras para comenzar.');},3400);
  };
  ['pointerup','touchend','click'].forEach(ev=>introEl.addEventListener(ev,startIntro));
  introEl.addEventListener('pointermove',e=>{
    if(done||!started)return;
    const now=performance.now()-t0;
    if(last&&now>2400&&!scatter){
      const dx=e.clientX-last[0],dy=e.clientY-last[1],sp=Math.hypot(dx,dy);
      L.forEach(l=>{
        const b=l.el.getBoundingClientRect(),d=Math.hypot(e.clientX-(b.left+b.width/2),e.clientY-(b.top+b.height/2));
        if(d<140){const q=1-d/140;l.vx+=dx*0.22*q+(Math.random()-0.5)*sp*0.12;l.vy+=dy*0.22*q+(Math.random()-0.5)*sp*0.12;l.vr+=(Math.random()-0.5)*sp*0.35*q;}
      });
      shake+=sp;if(sp>5)sfxRattle();
      if(shake>2300){
        scatter=true;imode.classList.remove('on');isub.style.opacity=0;document.getElementById('iauth').style.opacity=0;sfxScatter();
        L.forEach(l=>{l.vx=(Math.random()-0.5)*50;l.vy=-8-Math.random()*22;l.vr=(Math.random()-0.5)*40;l.el.style.transition='opacity .7s';l.el.style.opacity=0;});
        setTimeout(finish,750);
      }
    }
    last=[e.clientX,e.clientY];
  });
  function finish(){
    done=true;introEl.style.opacity=0;introEl.style.pointerEvents='none';
    setTimeout(()=>{introEl.style.display='none';},1100);
    setMode(MODE);setMusic('game');introOn=false;enter=true;cx=-R*1.7;cy=H*0.3;cvx=20;cvy=6;
    go('g0');
  }
  (function anim(){
    if(done)return;
    if(!started){requestAnimationFrame(anim);return;}
    const t=performance.now()-t0,p=Math.min(1,shake/2300),amp=2+9*p;
    L.forEach(l=>{
      if(!scatter){
        if(t>=l.born){l.vs+=(1-l.s)*0.22;l.vs*=0.78;l.s+=l.vs;}
        l.vx+=-l.x*0.09;l.vy+=-l.y*0.09;l.vr+=-l.r*0.09;
        l.vx*=0.88;l.vy*=0.88;l.vr*=0.88;
      }else{l.vy+=1.3;}
      l.x+=l.vx;l.y+=l.vy;l.r+=l.vr;
      const xi=scatter?0:Math.sin(t*0.012+l.ph)*amp*0.5,yi=scatter?0:Math.cos(t*0.015+l.ph*1.3)*amp*0.5,ri=scatter?0:Math.sin(t*0.01+l.ph)*(3+10*p);
      l.el.style.transform='translate('+(l.x+xi)+'px,'+(l.y+yi)+'px) rotate('+(l.r+ri)+'deg) scale('+Math.max(0,l.s)+')';
      if(!scatter)l.el.style.opacity=Math.min(1,l.s*2);
    });
    requestAnimationFrame(anim);
  })();
})();
(function loop(){step();draw();requestAnimationFrame(loop);})();
</script>
