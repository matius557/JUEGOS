<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mortal Célula</title>
<meta name="description" content="Juego de pelea de la célula: Mitocondria Man, Núcleo Juan, Macroso y Virat. Contra la CPU o PvP online con llave de sala.">
<meta property="og:title" content="Mortal Célula · Prof. Lic. Marcelino Games">
<meta property="og:image" content="https://matius557.github.io/JUEGOS/marcelino-games/portadas/mortal-celula.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* Arena celular a pantalla completa: canvas 16:9 centrado, pantallas de título y selección encima, controles táctiles fijos en las esquinas */
:root{
  --bg:#07040f;
  --ink:#f3ecff;
  --bolt:#7fe6ff;
  --atp:#ffd23f;
  --arn:#ff4fa3;
  --blood:#d7263d;
  --muted:#a99ccb;
  --panel:rgba(12,6,28,.78);
  --display:"Metal Mania","Impact",fantasy;
  --ui:"Russo One","Arial Black",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app.ctlL{left:var(--gut,0px);right:var(--gut,0px)}
#wrap{position:relative;container-type:inline-size;flex:none}
#cv{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;text-align:center;padding-inline:3cqw}
button{font-family:var(--ui);cursor:pointer}
button:focus-visible{outline:.3cqw solid var(--bolt);outline-offset:.3cqw}

/* Título */
#title h1{font-family:var(--display);font-weight:400;font-size:14cqw;line-height:.88;margin:0;letter-spacing:.02em}
.word{display:block;white-space:nowrap}
.word span{display:inline-block;animation:drop .5s cubic-bezier(.3,1.5,.5,1) both}
.w1 span{background:linear-gradient(180deg,#fff 0%,#d6ecff 38%,#3b7bd8 52%,#a8e6ff 76%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .45cqw 0 #071328) drop-shadow(0 0 1.4cqw rgba(127,230,255,.55))}
.w2 span{background:linear-gradient(180deg,#fff6c2 0%,#ffb03b 36%,#d7263d 56%,#6b0012 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .45cqw 0 #2a0008) drop-shadow(0 0 1.4cqw rgba(215,38,61,.6))}
@keyframes drop{0%{transform:translateY(-70cqw) rotate(-25deg);opacity:0}55%{opacity:1}100%{transform:none;opacity:1}}
#title.slam{animation:slam .45s}
@keyframes slam{0%,100%{transform:none}20%{transform:translate(-1.2cqw,.9cqw)}40%{transform:translate(1cqw,-.7cqw)}60%{transform:translate(-.6cqw,.5cqw)}80%{transform:translate(.4cqw,-.3cqw)}}
.tag{font-size:1.7cqw;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;opacity:0;animation:fade .4s 2.4s forwards}
#startBtn{font-size:2.5cqw;padding:1.1cqw 3.2cqw;border:.25cqw solid var(--bolt);color:#fff;background:rgba(8,20,45,.8);border-radius:.5cqw;text-transform:uppercase;letter-spacing:.08em;opacity:0;animation:fade .3s 2.6s forwards,pulse 1s 2.9s infinite}
#gateBtn{font-family:var(--display);font-size:5cqw;padding:1cqw 4cqw;border:.3cqw solid var(--blood);background:rgba(30,0,8,.85);color:#ffb03b;border-radius:.6cqw;animation:pulseR 1.2s infinite}
@keyframes pulseR{50%{box-shadow:0 0 3cqw rgba(215,38,61,.75)}}
.hint{font-size:1.4cqw;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
@keyframes fade{to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(127,230,255,.6)}50%{box-shadow:0 0 2.4cqw .4cqw rgba(127,230,255,.45)}}

/* Selección */
#select h2{font-family:var(--display);font-weight:400;font-size:5.4cqw;margin:0;color:#fff;text-shadow:0 0 1.6cqw rgba(215,38,61,.8),0 .3cqw 0 #2a0008}
.cards{display:flex;gap:2cqw;justify-content:center}
.rival{display:flex;gap:.8cqw;align-items:center;flex-wrap:wrap;justify-content:center;font-size:1.3cqw;color:var(--muted)}
.rival button{font-size:1.2cqw;padding:.45cqw 1.1cqw;border-radius:2cqw;border:.15cqw solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff}
.rival button.on{border-color:var(--atp);background:rgba(255,210,63,.25)}
.rival button:disabled{opacity:.3}
.card{width:22cqw;background:var(--panel);border:.2cqw solid rgba(255,255,255,.12);border-radius:.8cqw;padding:1.2cqw;display:flex;flex-direction:column;gap:.6cqw;align-items:stretch;color:var(--ink);text-align:left;animation:rise .45s both}
.card:nth-child(2){animation-delay:.12s}
@keyframes rise{from{transform:translateY(8cqw) scale(.9);opacity:0}to{transform:none;opacity:1}}
.card.on{border-color:var(--atp);box-shadow:0 0 2.6cqw rgba(255,210,63,.45)}
.card canvas{width:100%;height:10cqw;display:block}
.card .nm{font-size:2.3cqw;letter-spacing:.04em}
.card .org{font-size:1.1cqw;color:var(--muted);line-height:1.35;min-height:3.4cqw}
.stat{display:grid;grid-template-columns:9cqw 1fr;align-items:center;gap:.8cqw;font-size:1.1cqw;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.bar{height:.7cqw;background:rgba(255,255,255,.1);border-radius:.4cqw;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bolt),var(--atp))}
.go{font-size:2.4cqw;padding:1cqw 3.4cqw;border:0;border-radius:.5cqw;background:linear-gradient(180deg,#ff5468,#a3001b);color:#fff;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 .35cqw 0 #4a000b}
.go:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.keys{font-size:1.15cqw;color:var(--muted)}

/* Fin */
#net h2{font-family:var(--display);font-weight:400;font-size:5cqw;margin:0;color:#fff;text-shadow:0 0 1.6cqw rgba(127,208,255,.8),0 .3cqw 0 #08182e}
.netmsg{font-size:1.6cqw;color:var(--ink);max-width:70cqw;line-height:1.4;min-height:2cqw}
.keyslots{display:flex;gap:1.4cqw}
.slot{width:10cqw;height:10cqw;border-radius:1.2cqw;background:rgba(255,255,255,.08);border:.3cqw solid var(--atp);display:grid;place-items:center}
.slot img{width:86%;height:86%}
.keypad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:.8cqw;width:min(92cqw,100%)}
.keypad button{background:rgba(20,10,40,.85);border:.2cqw solid rgba(255,255,255,.3);border-radius:1cqw;padding:.5cqw .2cqw;color:#fff;display:flex;flex-direction:column;align-items:center;gap:.2cqw}
.keypad button:active{border-color:var(--atp);background:rgba(255,210,63,.25)}
.keypad img{width:6.5cqw;height:6.5cqw}
.keypad span{font-size:.95cqw;letter-spacing:.02em}
#over h2{font-family:var(--display);font-weight:400;font-size:6.5cqw;margin:0;line-height:1;color:#fff;text-shadow:0 0 2cqw rgba(255,210,63,.8),0 .3cqw 0 #3a2400}
#over .fact{max-width:58cqw;font-size:1.6cqw;line-height:1.45;background:var(--panel);padding:1.2cqw 1.8cqw;border-radius:.6cqw;border-left:.4cqw solid var(--atp);text-align:left}
.row{display:flex;gap:1.6cqw;flex-wrap:wrap;justify-content:center}
.ghost{font-size:2.1cqw;padding:1cqw 2.6cqw;border:.25cqw solid #7fd0ff;border-radius:.5cqw;background:#14325a;color:#fff;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 .35cqw 0 #08182e}

#toast{position:absolute;left:50%;top:15%;transform:translateX(-50%);max-width:70cqw;font-size:1.45cqw;line-height:1.4;background:var(--panel);padding:.9cqw 1.6cqw;border-radius:.6cqw;border-left:.35cqw solid var(--atp);text-align:left;transition:opacity .3s;pointer-events:none}
#toast b{color:var(--atp);font-weight:400}

/* Controles táctiles */
.ctl{position:fixed;z-index:5}
#pad{left:calc(42px + env(safe-area-inset-left,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.2);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(127,230,255,.35);border:2px solid rgba(127,230,255,.8)}
#btns{right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:6px;align-items:center;justify-items:center}
#btns button{width:46px;height:46px;font-size:8px!important;border-radius:50%;color:#fff;letter-spacing:.02em;touch-action:none;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.08);padding:0}
#bSpec{grid-column:2;grid-row:2;background:rgba(255,210,63,.22)!important;border-color:var(--atp)!important}
#bSpec svg{width:24px;height:24px;display:block;margin:0 auto}
#bSpec .lb{display:block;font-size:7px;line-height:1.1}
#bSpec2{grid-column:2;grid-row:1;border-color:#ff8a4c!important;background:conic-gradient(rgba(0,0,0,.6) calc(var(--cd,0) * 1turn),rgba(255,120,60,.32) 0)!important;font-size:10px!important}
#bHyper{grid-column:1;grid-row:1;border-color:#ffd23f!important;background:rgba(255,210,63,.3)!important;font-size:10px!important}
#bHyper.off{opacity:.3;filter:grayscale(1);background:rgba(255,255,255,.06)!important;border-color:rgba(255,255,255,.4)!important;animation:none}
#bHyper:not(.off){animation:pulseH .6s infinite}
@keyframes pulseH{50%{box-shadow:0 0 18px 4px rgba(255,210,63,.85)}}
#bGrab{grid-column:3;grid-row:1;border-color:#7fd0ff!important;background:rgba(127,208,255,.22)!important}
#bHeavy{grid-column:3;grid-row:2;background:rgba(255,120,60,.32)!important;border-color:#ff9a5c!important}
#bHit{grid-column:3;grid-row:3;background:rgba(215,38,61,.3)!important;border-color:#ff6b7d!important}
#bJump{grid-column:1;grid-row:2}
#btns button.down{transform:scale(.92);filter:brightness(1.5)}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.4);color:#fff}
#rot{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:12px;color:var(--muted);display:none}
@media (orientation:portrait){#rot{display:block}}
@media (prefers-reduced-motion:reduce){.word span,.card,#startBtn,.tag{animation-duration:.01s!important}}
</style>

</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="cv" aria-label="Mortal Célula, juego de pelea"></canvas>

    <div id="gate" class="ov">
      <button id="gateBtn" type="button">Tocá para encender</button>
      <div class="hint">Subí el volumen</div>
    </div>

    <div id="title" class="ov" hidden>
      <h1><span class="word w1" data-t="MORTAL"></span><span class="word w2" data-t="CÉLULA"></span></h1>
      <div class="tag">La pelea dentro de la célula eucariota</div>
      <button id="startBtn" type="button">Presiona aquí para empezar</button>
    </div>

    <div id="select" class="ov" hidden>
      <h2>Elige tu luchador</h2>
      <div class="cards">
        <button class="card" type="button" id="cMito" data-k="mito">
          <canvas id="pMito" width="320" height="200"></canvas>
          <span class="nm">MITOCONDRIA MAN</span>
          <span class="org">La mitocondria produce el ATP, la energía de la célula. Carga bolas de ATP haciendo círculos.</span>
          <span class="stat">Velocidad<span class="bar"><i style="width:90%"></i></span></span>
          <span class="stat">Fuerza<span class="bar"><i style="width:45%"></i></span></span>
          <span class="stat">Tamaño<span class="bar"><i style="width:30%"></i></span></span>
        </button>
        <button class="card" type="button" id="cNuc" data-k="nucleo">
          <canvas id="pNuc" width="320" height="200"></canvas>
          <span class="nm">NÚCLEO JUAN</span>
          <span class="org">El núcleo guarda el ADN y da las órdenes. Dispara ARN mensajero y explota para sacarse a todos de encima.</span>
          <span class="stat">Velocidad<span class="bar"><i style="width:30%"></i></span></span>
          <span class="stat">Fuerza<span class="bar"><i style="width:92%"></i></span></span>
          <span class="stat">Tamaño<span class="bar"><i style="width:95%"></i></span></span>
        </button>
        <button class="card" type="button" id="cMac" data-k="macro">
          <canvas id="pMac" width="320" height="200"></canvas>
          <span class="nm">MACROSO</span>
          <span class="org">Un macrófago: glóbulo blanco que se come a los microbios. Muerde con la panza y llama refuerzos con citoquinas.</span>
          <span class="stat">Velocidad<span class="bar"><i style="width:55%"></i></span></span>
          <span class="stat">Fuerza<span class="bar"><i style="width:70%"></i></span></span>
          <span class="stat">Tamaño<span class="bar"><i style="width:75%"></i></span></span>
        </button>
        <button class="card" type="button" id="cVir" data-k="virat">
          <canvas id="pVir" width="320" height="200"></canvas>
          <span class="nm">VIRAT</span>
          <span class="org">Un bacteriófago: virus que infecta inyectando su ADN. Patea como una mantis y dispara su aguijón taladro.</span>
          <span class="stat">Velocidad<span class="bar"><i style="width:75%"></i></span></span>
          <span class="stat">Fuerza<span class="bar"><i style="width:60%"></i></span></span>
          <span class="stat">Tamaño<span class="bar"><i style="width:50%"></i></span></span>
        </button>
      </div>
      <div class="rival" id="rivalRow">Rival:
        <button type="button" data-r="rand" class="on">Al azar</button>
        <button type="button" data-r="mito">Mitocondria Man</button>
        <button type="button" data-r="nucleo">Núcleo Juan</button>
        <button type="button" data-r="macro">Macroso</button>
        <button type="button" data-r="virat">Virat</button>
      </div>
      <div class="row">
        <button class="go" id="goBtn" type="button" disabled>¡A pelear! (vs CPU)</button>
        <button class="ghost" id="hostBtn" type="button" disabled>Crear sala online</button>
        <button class="ghost" id="joinBtn" type="button" disabled>Unirse con llave</button>
      </div>
      <div class="keys">Teclado: I J K L moverse (atrás = cubrirse) · Q débil · W fuerte · E agarre · R habilidad · T especial · Y hiper</div>
    </div>

    <div id="net" class="ov" hidden>
      <h2 id="netTitle">Sala online</h2>
      <div class="netmsg" id="netMsg"></div>
      <div class="keyslots" id="keySlots"></div>
      <div class="keypad" id="keyPad" hidden></div>
      <div class="row">
        <button class="go" id="netGo" type="button" hidden>Conectar</button>
        <button class="ghost" id="netDel" type="button" hidden>Borrar</button>
        <button class="ghost" id="netCancel" type="button">Cancelar</button>
      </div>
    </div>

    <div id="over" class="ov" hidden>
      <h2 id="winTxt">¡GANA!</h2>
      <div class="fact" id="overFact"></div>
      <div class="row">
        <button class="go" id="againBtn" type="button">Revancha</button>
        <button class="ghost" id="pickBtn" type="button">Cambiar personaje</button>
      </div>
    </div>

    <div id="toast" style="opacity:0"></div>
  </div>
</div>

<div id="pad" class="ctl" hidden><div id="knob"></div></div>
<div id="btns" class="ctl" hidden>
  <button id="bJump" type="button">SALTO</button>
  <button id="bHit" type="button">DÉBIL</button>
  <button id="bHeavy" type="button">FUERTE</button>
  <button id="bGrab" type="button">AGARRE</button>
  <button id="bSpec" type="button">HABILIDAD</button>
  <button id="bSpec2" type="button" hidden>EXPLOSIÓN</button>
  <button id="bHyper" type="button" class="off" hidden>HIPER</button>
</div>
<button id="mute" type="button">Música: sí</button>
<div id="rot">Girá el celular para jugar en grande</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
const W=960,H=540;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const $=id=>document.getElementById(id);
let scale=1,ctlOn=false;
const TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const GUT=175;
function resize(){
  const app=$('app');
  const reserve=ctlOn&&TOUCH&&innerWidth>=innerHeight;
  app.classList.toggle('ctlL',reserve);
  app.style.setProperty('--gut',GUT+'px');
  const vw=innerWidth-(reserve?GUT*2:0),vh=innerHeight;
  let cw=vw,ch=vw*9/16;
  if(ch>vh){ch=vh;cw=vh*16/9;}
  const dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  wrap.style.width=cw+'px';wrap.style.height=ch+'px';
  scale=cv.width/W;
}
addEventListener('resize',resize);

/* ---------- AUDIO ---------- */
let AC=null,master,musicGain,sfxGain,noiseBuf,musicOn=true,step=0,nextT=0,musicTimer=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC) return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=musicOn?.32:0;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=.6;sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function startMusic(at){
  if(!AC||musicTimer)return;
  nextT=Math.max(at||0,AC.currentTime+.05);step=0;
  musicTimer=setInterval(schedule,30);
}
/* órgano dramático para la intro (melodía original) */
function organ(m,t,dur,vol){
  const f=mtof(m),lp=AC.createBiquadFilter(),g=AC.createGain();
  lp.type='lowpass';lp.frequency.value=2600;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.03);
  g.gain.setValueAtTime(vol,t+Math.max(.04,dur-.08));g.gain.linearRampToValueAtTime(0,t+dur);
  lp.connect(g);g.connect(musicGain);
  [[1,'sawtooth',.5],[1.006,'sawtooth',.3],[2,'square',.22],[.5,'sawtooth',.38]].forEach(([k,ty,v])=>{
    const o=AC.createOscillator(),og=AC.createGain();o.type=ty;o.frequency.value=f*k;og.gain.value=v;
    o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.05);
  });
}
function playIntro(){
  const t0=AC.currentTime+.15,B=.2;let t=t0;
  const phrases=[[62,62,69],[60,60,67],[58,58,65],[57,61,64,69]];
  const pedal=[38,36,34,33];
  phrases.forEach((p,i)=>{
    const start=t,last=i===phrases.length-1;
    p.forEach((n,k)=>{
      const long=k===p.length-1,d=long?(last?1.8:.8):B;
      organ(n,t,d+.02,.1);if(long)organ(n-12,t,d,.07);
      t+=d;
    });
    organ(pedal[i],start,t-start,.07);
  });
  noise(t-1.8,1.8,.12,musicGain,150);
  return t;
}
function fireHit(t){
  if(!AC||t<AC.currentTime)return;
  noise(Math.max(AC.currentTime,t-.12),.16,.18,sfxGain,1800);
  tone(120,t,.32,'sine',.8,sfxGain,38);
  noise(t,.4,.55,sfxGain,250);
  for(let i=0;i<6;i++)noise(t+.03+Math.random()*.4,.025,.35,sfxGain,2500);
}
function tone(f,t,dur,type,vol,dest,slide){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02);
}
function noise(t,dur,vol,dest,hp){
  const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);

const STEP=60/152/4;
const roots=[45,45,41,43];

const bassPat=[0,0,12,0,0,12,0,0,0,0,12,0,0,12,0,12];
function playStep(s,t){
  const bar=Math.floor(s/16)%4,i=s%16;
  if(i%4===0||i===14) tone(150,t,.22,'sine',.9,musicGain,42);
  if(i===4||i===12){noise(t,.16,.5,musicGain,1400);tone(210,t,.08,'triangle',.25,musicGain,120);}
  if(i%2===1) noise(t,.035,.18,musicGain,7000);
  tone(mtof(roots[bar]+bassPat[i]),t,.1,'sawtooth',.22,musicGain);
  if([0,3,6,8,11,14].includes(i)){
    const c=chords[bar];const n=c[[0,1,2,1,2,0][[0,3,6,8,11,14].indexOf(i)]]+12;
    tone(mtof(n),t,.09,'square',.06,musicGain);
  }
  if(s%64===60) noise(t,.4,.25,musicGain,3000);
}
function schedule(){
  if(!AC) return;
  while(nextT<AC.currentTime+.15){playStep(step,nextT);nextT+=STEP;step=(step+1)%64;}
}
function sfx(kind,v=1){

  if(kind==='boom'){noise(t,.9,1,sfxGain,80);tone(90,t,.9,'sine',.9,sfxGain,28);}
  if(kind==='thunder'){noise(t,.6,.35,sfxGain,200);}

function humSet(f,on){

function cpuInput(c,foe){

  /* se cubre a veces cuando el rival ataca cerca, y agarra al que se cubre */

  if((foe.atk||foe.sting)&&adx<c.hw+foe.hw+110&&c.onGround&&!c.atk&&Math.random()<.08){ai.block=22;inp[dx>0?'left':'right']=true;return inp;}
  if(foe.blocking&&adx<c.hw+foe.hw+20&&Math.random()<.06){inp.grab=true;return inp;}
  if(c.atk&&c.landed&&Math.random()<.5){inp[Math.random()<.65?'light':'heavy']=true;}
  if(hyperReady(c)&&c.type==='macro'&&adx<380&&Math.abs(foe.y-c.y)<60){c.facing=dx>=0?1:-1;inp.hyper=true;return inp;}
  if(hyperReady(c)&&c.type==='virat'&&adx<170&&adx>40&&Math.abs(foe.y-c.y)<40){c.facing=dx>=0?1:-1;inp.hyper=true;return inp;}
  if(hyperReady(c)&&c.type!=='macro'&&c.type!=='virat'&&adx<120&&Math.abs(fc.y-cc.y)<90){c.facing=dx>=0?1:-1;inp.hyper=true;return inp;}
  if(c.type==='nucleo'&&!c.blastCd&&!c.blast){
    const close=adx<NR+60&&Math.abs(fc.y-cc.y)<NR+80;
    if(close&&(foe.y<c.y-c.hh*.5||c.hitstun>0)&&Math.random()<.15){inp.spec2=true;return inp;}

    inp.aim={x:fc.x-cc.x,y:fc.y-cc.y};return inp;
  }

  if(c.type==='macro'&&hyperReady(c)===false&&false){}

  if(c.type==='virat'&&!c.spinCd&&adx<90&&Math.random()<.03){inp.spec2=true;return inp;}
  const reach=c.type==='mito'?52:c.type==='macro'?100:c.type==='virat'?78:NR+70;
  if(adx<reach&&Math.abs(fc.y-cc.y)<90){

  }else{
    if(ai.cool===0&&adx>210&&c.type!=='virat'&&Math.random()<.03){ai.mode='charge';ai.hold=40+Math.random()*55;inp.spec=true;c.facing=dx>=0?1:-1;return inp;}
    if(dx>0)inp.right=true;else inp.left=true;
  }

/* Energía 100. Mitocondria Man: golpe 7 (15 matan), ATP 13 (8 matan).
   Núcleo Juan: golpe 17 (6 matan), ARN 25 (4 matan), explosión 34 (3 matan). */
/* Macroso: mordida 10, puñetazo 12, nube de citoquinas 5, cada globulito 6 */

/* la barra de hiper se carga al pegar (y un cuarto de eso al recibir); con 25% de vida o menos, el doble */
function guardBreak(t,by){
  t.guard=0;t.gbreak=150;t.hitstun=60;t.bstun=0;t.blocking=false;t.vx=(by?by.facing:1)*5;
  const c=chest(t);burst(c.x,c.y,26,['#7fd0ff','#ffffff','#1f6fb5'],8,4);

}
function gainMeter(f,x){if(!f||f.dead)return;f.meter=Math.min(100,f.meter+x*(f.hp<=25?2:1));}

function hit(t,dmg,dir,base,ang=.7,kbMul=1,o={}){

        const r=f.fin?hit(foe,D.F.dmg,f.facing,D.F.base,D.F.ang,1,{by:f}):hit(foe,A.dmg,f.facing,0,0,1,{ground:true,push:A.push,stun:A.stun,by:f});
        if(r===true)f.landed=true;
        if(f.fin&&r===true){shake=14;burst(chest(foe).x,chest(foe).y,30,['#ffd23f','#fff','#ff4fa3'],9,4);}
      }
    }
    /* encadenar: si el golpe conectó, el siguiente sale enseguida */
    if(f.buf&&f.landed&&f.atkT>A.a[1]-(f.type==='virat'?0:0)&&f.atkT>A.a[0]+3){
      if(!f.fin){f.seq=(f.seq+f.atkKind).slice(-2);f.seqT=40;}else f.seq='';
      const k=f.buf;startAttack(f,k);
    }else if(f.atkT>=f.atkDur){
      if(f.landed&&!f.fin){f.seq=(f.seq+f.atkKind).slice(-2);f.seqT=40;}else f.seq='';
      f.atk=0;f.cd=A.cd;
      if(f.buf&&f.landed){f.cd=0;const k=f.buf;startAttack(f,k);}
    }
  }
  // física
  f.vy=Math.min(f.vy+f.grav,15);
  const prevY=f.y;f.x+=f.vx;f.y+=f.vy;
  f.run+=Math.abs(f.vx)*.13;
  f.onGround=false;f.plat=null;
  if(f.vy>=0){for(const p of plats){if(!p.solid&&f.dropT>0)continue;if(prevY<=p.y+1&&f.y>=p.y&&f.x>p.x-6&&f.x<p.x+p.w+6){f.y=p.y;f.vy=0;f.onGround=true;f.jumps=2;f.plat=p;break;}}}
  if(f.onGround)f.vx*=f.hitstun>0||f.bstun>0?.8:.9;
  if(f.x<WALL_L+f.hw){f.x=WALL_L+f.hw;if(f.vx<0)f.vx=0;}
  if(f.x>WALL_R-f.hw){f.x=WALL_R-f.hw;if(f.vx>0)f.vx=0;}
  // KO
  if(f.stocks>0&&(f.x<-170||f.x>W+170||f.y>H+140||f.y<-320))ko(f);

function ko(f){
  const bx=Math.max(20,Math.min(W-20,f.x)),by=Math.max(20,Math.min(H-20,f.y-40));

  shake=20;flash=.5;sfx('boom');
  humSet(f,false);
  if(f.dead){f.stocks=0;f.x=-9999;return;}
  f.hp=Math.max(0,f.hp-20);
  if(f.hp<=0){f.dead=true;f.stocks=0;f.x=-9999;endTimer=100;koBanner=100;return;}
  const [t,d]=nextFact();toast(`<b>Te caíste: −20 de energía.</b> ${t}: ${d}`,260);
  Object.assign(f,{x:W/2+(f===P?-50:50),y:40,vx:0,vy:0,inv:150,hitstun:0,charge:0,charging:false,gestureCharging:false,atk:0,jumps:2});
}
function updateProjs(){
  for(const p of projs){
    if(p.delay>0){p.delay--;continue;}
    p.x+=p.vx;p.y+=p.vy;p.life--;if(p.kind==='arn')p.spin+=.25;if(p.kind==='wbc'||p.kind==='cito')p.spin=(p.spin||0)+(p.kind==='wbc'?.35:.05);
    const foe=p.owner===P?C:P;
    let boxes;
    if(p.kind==='atp'||p.kind==='cito'||p.kind==='wbc')boxes=[{x1:p.x-p.r,x2:p.x+p.r,y1:p.y-p.r,y2:p.y+p.r}];
    else{const ca=Math.cos(p.ang),sa=Math.sin(p.ang),hh=p.th*.6+10;boxes=[];for(let s=-p.len/2;s<=p.len/2;s+=18){const x=p.x+ca*s,y=p.y+sa*s;boxes.push({x1:x-hh,x2:x+hh,y1:y-hh,y2:y+hh});}}
    p.box={x1:Math.min(...boxes.map(b=>b.x1)),x2:Math.max(...boxes.map(b=>b.x2)),y1:Math.min(...boxes.map(b=>b.y1)),y2:Math.max(...boxes.map(b=>b.y2))};
    if(foe&&foe.stocks>0&&boxes.some(b=>overlap(b,hurt(foe)))){
      const dir=Math.abs(p.vx)>.5?Math.sign(p.vx):(foe.x>=p.x?1:-1);
      const ang=p.vy<-1?Math.max(.7,Math.atan2(-p.vy,Math.abs(p.vx))):.7;
      if(p.kind==='wbc'){if(!p.hitDone&&hit(foe,p.dmg,dir,3,.8)){p.hitDone=true;burst(p.x,p.y,14,['#fff','#e9e4f5','#ff9f6b'],6,3);}}
      else if(p.kind==='cito'){if(hit(foe,p.dmg,dir,2,.5)){p.life=0;callWBC(p.owner,p.x,p.y);burst(p.x,p.y,24,['#fff','#ffc8e6','#bfe8ff'],6,4);}}
      else if(hit(foe,p.dmg,dir,p.kind==='atp'?4:5,ang)){p.life=0;burst(p.x,p.y,20,p.kind==='atp'?['#ffd23f','#fff']:['#ff4fa3','#fff'],7,3);}}
    if(p.x<-300||p.x>W+300||p.y<-300||p.y>H+200)p.life=0;
  }
  for(let i=0;i<projs.length;i++)for(let j=i+1;j<projs.length;j++){const a=projs[i],b=projs[j];if(a.kind!=='wbc'&&b.kind!=='wbc'&&!a.delay&&!b.delay&&a.owner!==b.owner&&a.life>0&&b.life>0&&a.box&&b.box&&overlap(a.box,b.box)){a.life=b.life=0;burst((a.x+b.x)/2,(a.y+b.y)/2,30,['#fff','#ffd23f','#ff4fa3'],9,3);sfx('boom');shake=8;}}
  projs=projs.filter(p=>p.life>0);
}

/* ---------- MACROSO (macrófago) ---------- */

  roll(14+sw*5,-9,14,9);roll(14+sw*3,-21,15,10);
  roll(0,-37,37,14);roll(0,-57+breath*.3,42,16);roll(0,-77,38,15);

  if(!hit){
    g.save();g.beginPath();g.ellipse(0,-37,34,12,0,0,7);g.ellipse(0,-57,39,14,0,0,7);g.ellipse(0,-77,35,13,0,0,7);g.clip();

    g.fillStyle='rgba(110,80,170,.5)';g.beginPath();g.arc(-17,-64,3,0,7);g.fill();

    [[18,-80,7],[-26,-76,6]].forEach(([x,y,r])=>{g.strokeStyle='rgba(140,170,120,.65)';g.lineWidth=1.2;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.fillStyle='rgba(120,140,100,.5)';g.beginPath();g.arc(x+1,y+1,2,0,7);g.fill();});
    if(f.glowG){const gg=g.createRadialGradient(0,-70,4,0,-70,50);gg.addColorStop(0,`rgba(140,255,90,${.75*f.glowG})`);gg.addColorStop(1,'rgba(140,255,90,0)');g.fillStyle=gg;g.fillRect(-50,-110,100,90);}

  if(vom){g.fillStyle='#8be05a';g.beginPath();g.arc(x1-2,my+gap/2+3,3.4,0,7);g.fill();}
  g.restore();

  if(f.citoT>0){const k=Math.min(1,f.citoT/60),cx=fh[0]+Math.cos(arm)*24,cy=fh[1]+Math.sin(arm)*24;

function drawCito(g,p){

function fireCito(f,aim){

/* las citoquinas llaman refuerzos: 4 glóbulos blancos cruzan la pantalla por el punto del impacto */

/* ---------- VIRAT (bacteriófago) ---------- */
function dnaLine(g,x0,y0,x1,y1,amp,ph,lw){
  const L=Math.hypot(x1-x0,y1-y0)||1,nx=-(y1-y0)/L,ny=(x1-x0)/L,n=Math.max(4,Math.round(L/2));

let cine=null,turb=null;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp01=v=>Math.max(0,Math.min(1,v));
function along(pts,u){const n=pts.length-1,s=Math.min(n-1e-6,Math.max(0,u)*n),i=Math.floor(s),f=s-i;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f];}
function startTurb(){if(!AC||turb)return;const o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=60;lp.type='lowpass';lp.frequency.value=900;g.gain.value=.06;o.connect(lp);lp.connect(g);g.connect(sfxGain);o.start();turb={o,g};}
function setTurb(e){if(turb)turb.o.frequency.setTargetAtTime(60+320*e,AC.currentTime,.1);}
function stopTurb(){if(!turb)return;turb.g.gain.setTargetAtTime(0,AC.currentTime,.05);turb.o.stop(AC.currentTime+.3);turb=null;}
function scream(dur,base=170,vol=.55){
  if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sawtooth';
  o.frequency.setValueAtTime(base,t);o.frequency.linearRampToValueAtTime(base*1.53,t+.35);o.frequency.linearRampToValueAtTime(base*1.38,t+dur);
  const vib=AC.createOscillator(),vg=AC.createGain();vib.frequency.value=6.5;vg.gain.value=9;vib.connect(vg);vg.connect(o.frequency);
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.12);g.gain.setValueAtTime(vol,t+dur-.25);g.gain.linearRampToValueAtTime(0,t+dur);
  [[750,5],[1150,7],[2600,9]].forEach(([fq,q])=>{const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=fq;b.Q.value=q;o.connect(b);b.connect(g);});
  g.connect(sfxGain);o.start(t);vib.start(t);o.stop(t+dur+.05);vib.stop(t+dur+.05);
  noise(t,dur,.12,sfxGain,1800);
}
function beamSfx(){if(!AC)return;const t=AC.currentTime;noise(t,2,.5,sfxGain,120);tone(70,t,2,'sawtooth',.35,sfxGain,45);tone(1400,t,1.6,'square',.08,sfxGain,300);}
function sweepSfx(){if(!AC)return;const t=AC.currentTime;tone(160,t,1.4,'sawtooth',.1,sfxGain,1800);noise(t,1.2,.15,sfxGain,1500);}

function startCine(A,V,kind){
  kind=kind||A.type;
  state='cine';
  cine={t:0,A,V,kind,ps:[],res:[],bub:[],rot:0,energy:0,synN:0};
  if(kind==='nucleo')initCine2(cine);
  if(kind==='macro')initCineM(cine);
  if(kind==='acid')initCineAcid(cine);
  if(kind==='virat')initCineV(cine);
  A.hyper=0;A.hyperDone=kind!=='macro';A.vx=0;A.charge=0;humSet(A,false);humSet(V,false);
  projs=[];gest=null;
  $('btns').style.visibility='hidden';$('pad').style.visibility='hidden';
  $('toast').style.opacity=0;toastT=0;
  flash=1;shake=10;sfx('boom');
}
function endCine(){
  if(NET.role==='guest'){stopTurb();stopClassical();cine=null;state='fight';$('btns').style.visibility='';$('pad').style.visibility='';return;}
  const {A,V,kind}=cine;stopTurb();stopClassical();cine=null;state='fight';
  $('btns').style.visibility='';$('pad').style.visibility='';
  if(kind==='macro'){A.cineSeen=true;A.facing=V.x>=A.x?1:-1;startVomit(A);return;}
  V.inv=0;V.blast=0;V.hyper=0;
  V.held=null;A.grabbing=0;
  hit(V,DMG.hyper,A.facing,9,.6,1,{unblock:true,noMeter:true});
  flash=.8;shake=20;
  toast(kind==='virat'?'<b>Ciclo lítico:</b> el virus inyecta su ADN, la célula fabrica copias del virus y al final revienta (lisis) liberando virus nuevos.':kind==='acid'?'<b>Estallido respiratorio:</b> el macrófago fabrica radicales de oxígeno, agua oxigenada (H₂O₂) y óxido nítrico (NO) para destruir a los microbios que se comió.':kind==='nucleo'?'<b>Mitosis:</b> el ADN se duplica, se condensa en cromosomas y en la anafase las cromátidas hermanas se separan hacia los polos.':'<b>Respiración celular:</b> glucosa + oxígeno → dióxido de carbono (CO₂) + agua (H₂O) + mucha energía (ATP).',320);
}
function cineTick(){
  if(cine.kind==='nucleo'){cineTick2();return;}
  if(cine.kind==='macro'){cineTickM();return;}
  if(cine.kind==='acid'){cineTickAcid();return;}
  if(cine.kind==='virat'){cineTickV();return;}
  const c=cine;c.t++;const t=c.t;
  if(t===2)sweepSfx();
  if(t<A_END&&t>45&&t%22===0&&AC)tone(rnd(900,1500),AC.currentTime,.12,'sawtooth',.06,sfxGain,200);
  if(t===A_END)startTurb();
  if(t>=A_END&&t<B_END){
    const b=t-A_END,add=[];
    if(t<B_END-20){
      if(b%14===0)c.ps.push({k:'e',pts:EPATH,t0:t,dur:110});
      CX.forEach((x,i)=>{if((b+i*7)%22===0)c.ps.push({k:'h',pts:[[x+rnd(-20,20),470],[x,226],[x+rnd(-70,70),50+rnd(0,110)]],t0:t,dur:70,res:true});});
      if(b%8===0&&c.res.length>6){
        const r=c.res.shift();
        c.ps.push({k:'h',pts:[[r.x,r.y],[800,140],[800,226],[800,330],[790+rnd(-30,30),470]],t0:t,dur:55});
        if(++c.synN%3===0)c.ps.push({k:'a',pts:[[800,372],[880,320],[770,32]],t0:t+28,dur:70});
      }
    }
    c.energy=clamp01(b/(B_END-A_END-40));
    c.rot+=.04+.3*c.energy;setTurb(c.energy);
    c.ps=c.ps.filter(p=>{
      if(t-p.t0<p.dur)return true;
      if(p.k==='e')add.push({k:'w',pts:[[600,400],[630+rnd(0,60),462]],t0:t,dur:60});
      if(p.res&&c.res.length<70){const e=p.pts[p.pts.length-1];c.res.push({x:e[0],y:e[1],ph:Math.random()*7});}
      return false;
    });
    c.ps.push(...add);
  }
  if(t===B_END)stopTurb();
  const ct=t-B_END;
  const S=1.7;
  if([25,45,65].includes(ct)){sfx('hit',1.3);shake=8;burst(467,331,16,['#fff','#ffd23f','#7fe6ff'],7,3);}
  if(ct===100){sfx('hit',1.4);shake=10;burst(440,300,18,['#fff','#ffd23f'],7,3);}
  if(ct===158){sfx('hit',1.6);sfx('boom');shake=18;burst(527,232,30,['#fff','#ffd23f','#ff6b7d'],9,4);}
  if(ct===172){sfx('hit',1.4);shake=12;burst(467,331,20,['#fff','#7fe6ff'],8,3);}
  if(ct===205)sfx('rumble');
  if(ct===230)scream(1.6);
  if(ct>=205&&ct<285)shake=Math.max(shake,(ct-205)/80*6);
  if(ct===285){beamSfx();flash=.6;}
  if(ct>=285&&ct<400){
    shake=Math.max(shake,7);
    if(ct%4===0)c.bub.push({x:190+rnd(-22,8),y:275-rnd(28,72),vx:-rnd(.5,1.6),vy:-rnd(.7,1.6),k:Math.random()<.5?'CO₂':'H₂O',life:100});
  }
  c.bub.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;});c.bub=c.bub.filter(b=>b.life>0);
  if(ct===405)flash=1;
  if(t>=C_END)endCine();
}

function subtitle(g,txt,y=498){
  const lines=txt.split('\n');g.font='15px "Russo One", "Arial Black", sans-serif';
  const w=Math.max(...lines.map(l=>g.measureText(l).width))+40,h=lines.length*21+14;
  g.fillStyle='rgba(8,3,18,.85)';g.fillRect(480-w/2,y-h/2,w,h);
  g.fillStyle='#ffd23f';g.fillRect(480-w/2,y-h/2,4,h);
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  lines.forEach((l,i)=>g.fillText(l,480,y-h/2+17+i*21));
}
function bigText(g,txt,x,y,size,jit=0){

  g.font=`${size}px "Metal Mania", Impact, fantasy`;g.textAlign='center';g.textBaseline='middle';
  g.lineWidth=size/8;g.strokeStyle='#2a0008';g.strokeText(txt,0,0);
  const tg=g.createLinearGradient(0,-size/2,0,size/2);tg.addColorStop(0,'#fff6c2');tg.addColorStop(.5,'#ffd23f');tg.addColorStop(1,'#ff7a1f');
  g.fillStyle=tg;g.fillText(txt,0,0);g.restore();
}
function poseM(o){return Object.assign({},cine.A,{facing:1,vx:0,run:0,flash:0,inv:0,hyper:0,atk:0,atkT:0,atkDur:15,atkType:0,charging:false,gestureCharging:false,charge:0,onGround:true},o);}
function innerPath(RX,RY){const p=[];for(let a=0;a<=Math.PI*2+.001;a+=.015){const f=Math.pow(Math.max(0,Math.cos(8*a)),10),r=.86-.5*f;p.push([RX*r*Math.cos(a),RY*r*Math.sin(a)]);}return p;}

  if(t<70){
    const z=4+10*Math.pow(t/70,2),a=t<45?1:1-(t-45)/25;

    g.strokeStyle='rgba(255,240,140,.95)';g.lineWidth=.7;g.shadowColor='#ffe066';g.shadowBlur=4;
    for(let i=0;i<7;i++){g.beginPath();for(let x=-18;x<=18;x++){const y=-66+Math.sin(x*.5+i*1.3+t*.25)*(2+i%3)+(i-3)*2.4;x===-18?g.moveTo(x+2,y):g.lineTo(x+2,y);}g.stroke();}

    g.setLineDash([6,10]);g.lineDashOffset=-t*3;g.strokeStyle='rgba(255,240,140,.95)';g.lineWidth=2.2;g.shadowColor='#ffe066';g.shadowBlur=10;strokePts(g,path);
    g.setLineDash([]);g.shadowBlur=0;

  NET.role=role;NET.myType=picked;NET.code=[];
  show('net');$('netGo').hidden=role!=='guest';$('netDel').hidden=role!=='guest';$('keyPad').hidden=role!=='guest';

const PEER_PREFIX='mortalcelula-v1-';
function tryHost(){
  const code=[0,1,2,3].map(()=>(Math.random()*9)|0);NET.code=code;
  let peer;try{peer=new Peer(PEER_PREFIX+code.join(''),{debug:0});}catch(e){netUnavailable();return;}
  NET.peer=peer;
  peer.on('open',()=>{showSlots(code);netMsg('Pasale esta llave a tu rival (sacale una foto o decísela). Esperando que se una...');});
  peer.on('error',err=>{if(NET.peer!==peer)return;if(err.type==='unavailable-id'){peer.destroy();tryHost();}else netMsg('Error de conexión ('+err.type+'). Probá de nuevo.');});
  peer.on('connection',c=>{
    if(NET.conn){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),300);});return;}
    NET.conn=c;setupConn(c);
  });
}
function tryJoin(){
  if(NET.code.length<4)return;
  netMsg('Conectando...');
  let peer;try{peer=new Peer({debug:0});}catch(e){netUnavailable();return;}
  NET.peer=peer;
  peer.on('open',()=>{
    const c=peer.connect(PEER_PREFIX+NET.code.join(''),{reliable:true});
    NET.conn=c;setupConn(c);
    c.on('open',()=>{netMsg('¡Conectado! Esperando que arranque la pelea...');c.send({t:'hello',type:NET.myType});});
  });
  peer.on('error',err=>{if(NET.peer!==peer)return;netMsg(err.type==='peer-unavailable'?'No hay ninguna sala con esa llave. Revisá los símbolos.':'Error de conexión ('+err.type+'). Probá de nuevo.');NET.conn=null;});
  clearTimeout(NET.timer);NET.timer=setTimeout(()=>{if(NET.role==='guest'&&!(NET.conn&&NET.conn.open))netMsg('No se pudo conectar. Puede que la red no lo permita; probá con otra conexión (por ejemplo, datos del celular).');},15000);
}
function setupConn(c){
  c.on('data',onNetData);
  c.on('close',()=>{if(NET.conn!==c)return;const was=NET.role;netClose();if(was){if(state!=='select'){setControls(false);cine=null;stopTurb();stopClassical();state='select';show('select');}toast('Se cortó la conexión con tu rival.',260,true);}});
  c.on('error',()=>{});
}
function onNetData(d){
  if(!d||!d.t)return;
  if(NET.role==='host'){
    if(d.t==='hello'){NET.guestType=d.type;netMsg('¡Rival conectado!');setTimeout(startOnline,700);}
    else if(d.t==='i'){Object.assign(NET.rh,d.h);const e=d.e||{};for(const k in e){if(k==='gadd')NET.re.gadd=(NET.re.gadd||0)+e[k];else if(e[k])NET.re[k]=e[k];}}
    else if(d.t==='again'){if(state==='over')startOnline();}
    else if(d.t==='bye'){NET.conn&&NET.conn.close();}
  }else if(NET.role==='guest'){
    if(d.t==='start'){clearTimeout(NET.timer);startFight(d.p,d.c);}
    else if(d.t==='s'&&P)applySnap(d);
    else if(d.t==='full')netMsg('Esa sala ya tiene dos jugadores.');
    else if(d.t==='bye'){NET.conn&&NET.conn.close();}
  }
}
function startOnline(){
  if(!NET.conn||!NET.conn.open)return;
  netSend({t:'start',p:NET.myType,c:NET.guestType});
  startFight(NET.myType,NET.guestType);
}

function ser(f){const o={};for(const k in f){const v=f[k];if(typeof v==='number')o[k]=Number.isInteger(v)?v:Math.round(v*100)/100;else if(typeof v==='string'||typeof v==='boolean')o[k]=v;}
  o.aimNow=f.aimNow;o.slS=f.slS;o.heldI=f.held?(f.held===P?0:1):-1;return o;}
function sendSnap(){
  const pr=projs.map(q=>{const o={};for(const k in q){const v=q[k];if(typeof v==='number')o[k]=Math.round(v*100)/100;else if(typeof v==='string'||typeof v==='boolean')o[k]=v;}o.ow=q.owner===P?0:1;return o;});
  netSend({t:'s',st:state,b:banner,kb:koBanner,sh:Math.round(shake),fl:Math.round(flash*100)/100,f:[ser(P),ser(C)],pr,po:pops,ev:NET.ev.splice(0),ck:cine?cine.kind:null,ca:cine?(cine.A===P?0:1):0,ct:cine?cine.t:0});
}
function applySnap(d){
  [P,C].forEach((f,i)=>{const o=d.f[i];const hp=f.hpShow;Object.assign(f,o);f.hpShow=hp;f.held=o.heldI>=0?[P,C][o.heldI]:null;f.atkD=f.atkKind&&ATK[f.type]?ATK[f.type][f.atkKind]:null;});
  projs=d.pr.map(o=>Object.assign(o,{owner:[P,C][o.ow]}));
  pops=d.po||[];banner=d.b;koBanner=d.kb;shake=Math.max(shake,d.sh);flash=Math.max(flash,d.fl);
  (d.ev||[]).forEach(e=>{if(e[0]==='s')sfx(e[1],e[2]);else if(e[0]==='b')burst(e[1],e[2],e[3],e[4],e[5],e[6]);else if(e[0]==='t')toast(e[1],e[2],true);});
  if(d.ck&&state!=='cine'&&state!=='over'){const A=[P,C][d.ca],V=A===P?C:P;startCine(A,V,d.ck);cine.t=d.ct;}
  if(!d.ck&&state==='cine')endCine();
  if(d.st==='over'&&state!=='over'){endGame();return;}
  if((d.st==='countdown'||d.st==='fight')&&state!==d.st&&state!=='cine'){if(d.st==='fight'&&state==='countdown')sfx('fight');state=d.st;}
}

/* ---------- LOOP ---------- */
function tick(){
  T++;
  if(shake>0)shake*=.88;if(shake<.3)shake=0;
  if(flash>0)flash=Math.max(0,flash-.04);
  if(toastT>0&&--toastT===0)$('toast').style.opacity=0;
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy=p.vy*.95+.08;p.life--;}
  parts=parts.filter(p=>p.life>0);
  if(state==='title'&&Math.random()<.04){
    const x=Math.random()*W;titleBolts.push({p:boltPts(x,-10,x+(Math.random()-.5)*300,120+Math.random()*380,12,40),life:12});
    if(AC&&Math.random()<.3)sfx('thunder');
  }
  titleBolts.forEach(b=>b.life--);titleBolts=titleBolts.filter(b=>b.life>0);
  if(state==='cine'){cineTick();return;}
  if(state==='countdown'){
    const prev=banner;banner--;
    if([200,140,80].includes(prev))sfx('beep');
    if(banner<=40){state='fight';sfx('fight');}
    if(NET.role==='guest'){sendInput(playerInput());return;}
    if(NET.role==='host')takeRemote();
    updateFighter(P,{},C);updateFighter(C,{},P);
    return;
  }
  if(NET.role==='guest'&&state==='fight'){
    sendInput(playerInput());
    [P,C].forEach(f=>{f.hpShow+=(f.hp-f.hpShow)*.06;});
    syncButtons();
    return;
  }
  if(state==='fight'){
    if(banner>0)banner--;
    if(koBanner>0)koBanner--;
    [P,C].forEach(f=>{f.hpShow+=(f.hp-f.hpShow)*.06;});
    syncButtons();
    if(freeze>0){freeze--;return;}
    const frz=f=>f.type==='macro'&&(f.hyper>0||(f.vomit>0&&f.vomit<28));
    const pin=playerInput();
    if(!frz(C))updateFighter(P,pin,C);
    if(!frz(P))updateFighter(C,NET.role==='host'?takeRemote():cpuInput(C,P),P);
    /* no se pueden meter uno dentro del otro */
    if(!P.held&&!C.held&&!P.dead&&!C.dead&&Math.abs(P.y-C.y)<60){
      const dx=C.x-P.x,min=(P.hw+C.hw)*.8,ov=min-Math.abs(dx);
      if(ov>0){const sgn=dx>=0?1:-1;P.x-=sgn*ov/2;C.x+=sgn*ov/2;
        [P,C].forEach(f=>{f.x=Math.max(WALL_L+f.hw,Math.min(WALL_R-f.hw,f.x));});
        const ov2=min-Math.abs(C.x-P.x);if(ov2>0){if(P.x<=WALL_L+P.hw+1||P.x>=WALL_R-P.hw-1)C.x+=sgn*ov2;else P.x-=sgn*ov2;}}
    }
    pops.forEach(q=>{q.life--;q.y-=.6;});pops=pops.filter(q=>q.life>0);
    updateProjs();
    if(endTimer>0&&--endTimer===0)endGame();
  }
}

  g.font='22px "Metal Mania", Impact, fantasy';g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle='#0b0418';g.strokeText('VS',W/2,Y+BH/2);g.fillStyle='#ffd23f';
  g.fillText('VS',W/2,Y+BH/2);
  pops.forEach(q=>{g.globalAlpha=Math.min(1,q.life/12);g.font='24px "Metal Mania", Impact, fantasy';g.textAlign='center';g.textBaseline='middle';g.lineWidth=5;g.strokeStyle='#0b0418';g.strokeText(q.txt,q.x,q.y);g.fillStyle=q.col||'#ffd23f';g.fillText(q.txt,q.x,q.y);g.globalAlpha=1;});
}
function keycap(g,x,y,k,hot){
  g.fillStyle=hot?'#ffd23f':'#f3ecff';g.beginPath();g.roundRect(x-15,y-15,30,30,6);g.fill();
  g.fillStyle='rgba(0,0,0,.25)';g.fillRect(x-15,y+11,30,4);
  g.fillStyle='#14072b';g.font='15px "Russo One", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(k,x,y);
}
function drawKeys(g){
  const N=ME.type==='nucleo',M=ME.type==='macro',V=ME.type==='virat',x0=130,y0=268,w=700,h=226;
  g.fillStyle='rgba(10,4,24,.86)';g.beginPath();g.roundRect(x0,y0,w,h,12);g.fill();
  g.strokeStyle='#ffd23f';g.lineWidth=2;g.stroke();
  label(g,'MOVERSE',x0+120,y0+22,'center',13);label(g,'HABILIDADES',x0+430,y0+22,'center',13);
  const cx=x0+120,cy=y0+80;
  keycap(g,cx,cy-20,'I');keycap(g,cx-36,cy+16,'J');keycap(g,cx,cy+16,'K');keycap(g,cx+36,cy+16,'L');
  g.fillStyle='#c9bde6';g.font='11px "Russo One", sans-serif';g.textAlign='center';g.textBaseline='middle';
  g.fillText('I saltar',cx,cy+52);g.fillText('J / L moverse',cx,cy+68);g.fillStyle='#7fd0ff';g.fillText('Atrás = cubrirse',cx,cy+88);
  g.fillStyle='#ffd23f';g.fillText('Combo: Q, Q, W',cx,cy+112);
  const hab=N?'ARN mensajero (mantener, apuntar con IJKL, soltar)':M?'Citoquinas (mantener, apuntar con IJKL, soltar)':V?'Aguijón taladro (hacia adelante)':'Bola de ATP (mantener, apuntar, soltar)';
  const esp=N?'Explosión del núcleo':V?'Patada circular (salta atrás y gira)':'(sin uso con este personaje)';
  const hip=N?'SÚPER: Combo Mitosis':M?'HIPER: Chorro oxidante':V?'HIPER: Infección viral':'HIPER: Rayo de respiración celular';
  const rows=[['Q','Golpe débil'],['W',V?'Golpe fuerte (tres patadas)':'Golpe fuerte'],['E','Agarre (rompe la guardia)'],['R',hab],['T',esp],['Y',hip+' (con la barra llena)']];
  rows.forEach(([k,t],i)=>{const y=y0+50+i*31;keycap(g,x0+262,y,k,k==='Y');g.fillStyle=(!N&&!V&&k==='T')?'#7d6f9a':'#fff';g.font='12px "Russo One", sans-serif';g.textAlign='left';g.textBaseline='middle';g.fillText(t,x0+288,y);});
}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;
  ctx.save();ctx.translate(sx,sy);
  if(state==='cine')drawCine(ctx);else if(state==='countdown'||state==='fight'||state==='over')drawArena(ctx);else drawWorld(ctx);
  if(state==='gate'){ctx.fillStyle='rgba(6,2,16,.7)';ctx.fillRect(-20,-20,W+40,H+40);}
  if(state==='title'){
    ctx.fillStyle='rgba(6,2,16,.55)';ctx.fillRect(-20,-20,W+40,H+40);
    titleBolts.forEach(b=>{ctx.strokeStyle=`rgba(190,245,255,${b.life/12})`;ctx.lineWidth=3;ctx.shadowColor='#7fe6ff';ctx.shadowBlur=18;strokePts(ctx,b.p);ctx.shadowBlur=0;});
  }
  if(state==='select'){ctx.fillStyle='rgba(6,2,16,.62)';ctx.fillRect(-20,-20,W+40,H+40);}
  const overDim=state==='over';
  if((state==='countdown'||state==='fight'||state==='over')&&P){
    projs.forEach(p=>{if(p.delay>0)return;p.kind==='atp'?drawATP(ctx,p,T):p.kind==='cito'?drawCito(ctx,p):p.kind==='wbc'?drawWBC(ctx,p):drawARN(ctx,p);});
    [C,P].forEach(f=>{if(f.stocks>0)drawFighter(ctx,f,T);});
    [P,C].forEach(f=>{if((f.charging||f.gestureCharging)&&f.stocks>0){const c=chest(f);ctx.strokeStyle=f.type==='mito'?'rgba(190,245,255,.95)':'rgba(255,140,200,.9)';ctx.lineWidth=2;for(let i=0;i<2+Math.round(f.charge*4);i++){const a=Math.random()*7,r1=f.type==='mito'?24:NR+4,r2=r1+18+f.charge*26;strokePts(ctx,boltPts(c.x+Math.cos(a)*r1,c.y+Math.sin(a)*r1,c.x+Math.cos(a+.4)*r2,c.y+Math.sin(a+.4)*r2,5,10));}}});
    [P,C].forEach(f=>{if(!f.aimNow||f!==ME||f.stocks<=0)return;const c=chest(f);let ax=f.aimNow.x,ay=f.aimNow.y;const m=Math.hypot(ax,ay)||1;ax/=m;ay/=m;
      const s=f.type==='mito'?30:f.hw+12,e=s+90;ctx.strokeStyle=f.type==='mito'?'rgba(255,210,63,.9)':f.type==='macro'?'rgba(190,232,255,.95)':'rgba(255,79,163,.9)';ctx.lineWidth=4;ctx.setLineDash([10,7]);
      ctx.beginPath();ctx.moveTo(c.x+ax*s,c.y+ay*s);ctx.lineTo(c.x+ax*e,c.y+ay*e);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=ctx.strokeStyle;ctx.beginPath();ctx.moveTo(c.x+ax*(e+14),c.y+ay*(e+14));ctx.lineTo(c.x+ax*e-ay*9,c.y+ay*e+ax*9);ctx.lineTo(c.x+ax*e+ay*9,c.y+ay*e-ax*9);ctx.closePath();ctx.fill();});
    if(gest&&gest.pts.length>1){ctx.strokeStyle=gest.circ?'rgba(127,230,255,.7)':'rgba(255,255,255,.4)';ctx.lineWidth=3;strokePts(ctx,gest.pts.slice(-30).map(p=>[p.x,p.y]));}
    drawHUD(ctx);
    if(overDim){ctx.fillStyle='rgba(6,2,16,.62)';ctx.fillRect(-20,-20,W+40,H+40);}
  }
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);if(p.circ){const k=1-p.life/p.max;ctx.strokeStyle=p.c;ctx.lineWidth=10*(1-k)+1;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.25+.9*k),0,7);ctx.stroke();}else if(p.ring){ctx.strokeStyle=p.c;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s*(1.8-p.life/p.max),4,0,0,7);ctx.stroke();}else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}});
  ctx.globalAlpha=1;
  if(P&&(state==='countdown'||(state==='fight'&&banner>0))&&(!TOUCH||kbSeen))drawKeys(ctx);
  if((banner>0||koBanner>0)&&(state==='countdown'||state==='fight')){
    const txt=koBanner>0?'¡K.O.!':banner>140?'3':banner>80?'2':banner>40?'1':'¡PELEA!';
    const k=txt.length>1?1:1+((banner%60)/60)*.4;
    ctx.save();ctx.translate(W/2,H/2-20);ctx.scale(k,k);
    ctx.font='96px "Metal Mania", Impact, fantasy';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=10;ctx.strokeStyle='#2a0008';ctx.strokeText(txt,0,0);
    const tg=ctx.createLinearGradient(0,-50,0,50);tg.addColorStop(0,'#fff6c2');tg.addColorStop(.5,'#ffb03b');tg.addColorStop(1,'#d7263d');
    ctx.fillStyle=tg;ctx.fillText(txt,0,0);ctx.restore();
  }
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash})`;ctx.fillRect(0,0,W,H);}
}

/* retratos de selección */
const portraits=[[$('pMito'),'mito'],[$('pNuc'),'nucleo'],[$('pMac'),'macro'],[$('pVir'),'virat']].map(([c,t])=>({c,g:c.getContext('2d'),f:Object.assign(makeFighter(t,0,1,false),{y:0})}));
function drawPortraits(){
  portraits.forEach(({c,g,f})=>{
    g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,c.width,c.height);
    const sel=picked===f.type;
    f.charging=sel;f.charge=sel?.5+.4*Math.sin(T*.05):0;
    const s=f.type==='mito'?1.85:f.type==='macro'?1.3:f.type==='virat'?1.12:1.12;
    if(f.type==='virat'){f.charging=false;f.charge=0;}
    if(f.type==='macro'){f.charging=false;f.charge=0;f.citoT=sel?20+(T%40):0;}
    g.setTransform(s,0,0,s,c.width/2-(f.type==='nucleo'?15:0),c.height-12);
    drawFighter(g,f,T);
    if(sel&&f.type!=='macro'&&f.type!=='virat'){const ch=chest(f);g.strokeStyle=f.type==='mito'?'rgba(190,245,255,.9)':'rgba(255,140,200,.9)';g.lineWidth=1.5;for(let i=0;i<3;i++){const a=Math.random()*7;strokePts(g,boltPts(ch.x+Math.cos(a)*30,ch.y+Math.sin(a)*30,ch.x+Math.cos(a+.4)*58,ch.y+Math.sin(a+.4)*58,4,8));}}
    if(f.type==='mito'&&!sel)f.charge=0;
  });
}

let last=performance.now(),acc=0;
function loop(ts){
  requestAnimationFrame(loop);
  acc+=Math.min(80,ts-last);last=ts;
  let n=0;while(acc>=1000/60&&n<4){tick();acc-=1000/60;n++;}
  if(NET.role==='host'&&NET.conn&&NET.conn.open&&P&&['countdown','fight','cine','over'].includes(state)&&(++NET.sendT%2===0))sendSnap();
  render();
  if(state==='select')drawPortraits();
}
resize();
buildBg();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>buildBg());
requestAnimationFrame(loop);
})();
</script>
