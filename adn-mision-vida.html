R(`<div class="card"><div class="scene">${bio(h,0,S.eq)}</div><h2>¡Misión ${S.m+1} completada!</h2><div class="lg">${leo}<div class="bub"><b>Leo:</b> ${m.out}</div></div><p class="pc">ADN de Bio recuperado: <b>${Math.round(h*100)}%</b></p>${cbox()}<button class="btn go" onclick="shop('mid')">🛍️ Ir a la tienda de Leo</button><button class="btn alt" onclick="S.m++;brief()">Siguiente misión sin comprar</button></div>`)}
function finale(){up();
R(`<div class="card"><div class="scene">${bio(1,1,S.eq)}</div><h2>¡ADN de Bio recuperado al 100%!</h2><div class="lg">${leo}<div class="bub"><b>Leo:</b> ¡Lo lograste! Bio está completamente recuperado. Para celebrarlo, gasta tus monedas en la gran tienda final y deja a Bio como tú quieras.</div></div>${cbox()}<p class="pc">Monedas ganadas en toda la aventura: <b>${S.earn}</b> 🪙</p><button class="btn go" onclick="shop('end')">🛍️ Abrir la gran tienda final</button><button class="btn alt" onclick="final()">Saltar la tienda</button></div>`)}

/* ---------- TIENDA ---------- */
const SL=[['hab','⚡','Habilidades'],['cabeza','🎩','Cabeza'],['cara','🕶️','Cara'],['cuello','🎀','Cuello'],['espalda','🦸','Espalda'],['pies','👟','Pies'],['antena','📡','Antena'],['color','🎨','Color']];
const CROP={cabeza:'20 -26 160 120',cara:'20 40 160 110',cuello:'20 80 160 120',espalda:'0 -26 200 240',pies:'10 120 180 94',antena:'40 -26 120 100',color:'0 -26 200 240'};
function shop(md){const ov=md=='ov';if(!ov)$('#hud').hidden=true;
const card=`<div class="card"><div class="spanel"><div class="sbio" id="sbio"></div><div><p class="tag">${md=='end'?'Gran tienda final':'Tienda de Leo'}</p><p class="wallet">🪙 <span id="wl"></span></p><p class="hint" id="smsg" aria-live="polite">Compra habilidades y accesorios para mejorar a Bio.</p></div></div><div class="tabs" id="tabs"></div><div id="sl"></div><button class="btn go" onclick="${ov?'closeShop()':md=='end'?'final()':'S.m++;brief()'}">${ov?'Volver al juego':md=='end'?'Terminar y ver mi resultado':'Continuar a la misión '+(S.m+2)}</button></div>`;
if(ov){const o=$('#ov');o.innerHTML=card;o.hidden=false;document.body.style.overflow='hidden';o.scrollTop=0;o.focus()}else R(card);shopUp()}
function openShop(){shop('ov')}
function closeShop(){const o=$('#ov');o.hidden=true;o.innerHTML='';document.body.style.overflow='';up();abRefresh();const b=$('#shb');if(b)b.focus({preventScroll:true})}
addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#ov').hidden)closeShop()});
function shopUp(m,id){$('#sbio').innerHTML=bio(S.done/TOT,S.done>=TOT,S.eq);$('#wl').textContent=S.coins;
$('#tabs').innerHTML=SL.map(([k,e,n])=>`<button class="tab ${S.tab==k?'on':''}" onclick="tb('${k}')">${e} ${n}</button>`).join('');
$('#sl').innerHTML=S.tab=='hab'?ABIL.map(a=>{const lv=S.ab[a.k],mx=lv>=2,p=mx?0:a.p[lv],can=S.coins>=p;
const bt=mx?`<button class="btn sm" disabled>Nivel máximo</button>`:can?`<button class="btn sm go" id="b-${a.k}" onclick="upg('${a.k}')">${lv?'Mejorar':'Comprar'}</button>`:`<button class="btn sm" disabled>Faltan ${p-S.coins} 🪙</button>`;
return `<div class="it ${lv?'eq':''}"><div class="th" aria-hidden="true">${a.ic}</div><div class="ii"><b>${a.n}</b><span class="pr">Nivel ${lv} de 2${mx?'':' · 🪙 '+p}</span><small>${mx?'Nivel 2: '+a.d[1]:'Siguiente (nivel '+(lv+1)+'): '+a.d[lv]}</small></div>${bt}</div>`}).join('')
:ITEMS[S.tab].map(o=>{const own=S.own[o.id],eqd=S.eq[S.tab]===o.id,can=S.coins>=o.p;let bt;
if(eqd)bt=S.tab=='color'?`<button class="btn sm" disabled>Puesto</button>`:`<button class="btn sm" id="b-${o.id}" onclick="act('${o.id}')">Quitar</button>`;
else if(own)bt=`<button class="btn sm" id="b-${o.id}" onclick="act('${o.id}')">Poner</button>`;
else if(can)bt=`<button class="btn sm go" id="b-${o.id}" onclick="act('${o.id}')">Comprar</button>`;
else bt=`<button class="btn sm" disabled>Faltan ${o.p-S.coins} 🪙</button>`;
const th=o.col?bio(1,0,{color:o.id},CROP.color):bio(1,0,{[S.tab]:o.id},CROP[S.tab]);
return `<div class="it ${eqd?'eq':''}"><div class="th" aria-hidden="true">${th}</div><div class="ii"><b>${o.n}</b><span class="pr">${own?'Tuyo ✓':'🪙 '+o.p}</span>${o.hint?`<small>${o.hint}</small>`:''}</div>${bt}</div>`}).join('');
if(m)$('#smsg').textContent=m;
if(id){const b=document.getElementById('b-'+id);if(b)b.focus({preventScroll:true})}}
function tb(k){S.tab=k;shopUp()}
function act(id){const o=ALL.find(x=>x.id==id),s=o.s;let m;
if(S.eq[s]==id){delete S.eq[s];m='Te quitaste: '+o.n+'.'}
else{if(!S.own[id]){if(S.coins<o.p)return;S.coins-=o.p;S.own[id]=1;m='¡Compraste '+o.n+'! 🎉'}else m='Bio ahora lleva: '+o.n+'.';S.eq[s]=id;if(o.hint)m+=' '+o.hint}
shopUp(m,id)}
function upg(k){const a=ABIL.find(x=>x.k==k),lv=S.ab[k];if(lv>=2||S.coins<a.p[lv])return;S.coins-=a.p[lv];S.ab[k]=lv+1;if(k=='pista')S.hu++;if(k=='escudo')S.sh++;
shopUp(`¡${a.n} subió al nivel ${lv+1}! ${a.ic} ${a.d[lv]}`,k)}

function final(){$('#hud').hidden=true;const p=S.sc/(TOT*10),r=p>=.9?'Genio del ADN':p>=.7?'Explorador genético':'Aprendiz de laboratorio',na=Object.keys(S.own).length-1,hs=ABIL.filter(a=>S.ab[a.k]).map(a=>a.ic+' '+a.n+' nv. '+S.ab[a.k]).join(' · ');
R(`<div class="card"><h1>¡Bio está a salvo!</h1><div class="scene"><span aria-hidden="true">✨</span>${bio(1,true,S.eq)}<span aria-hidden="true">✨</span></div><div class="lamps" aria-hidden="true">${[0,1,2,3,4].map(i=>`<i style="animation-delay:${i*.35}s"></i>`).join('')}</div><div class="lg">${leo}<div class="bub"><b>Leo:</b> ¡Lo lograste! El ADN de Bio está reconstruido, ya se mueve feliz y todas las máquinas del laboratorio volvieron a funcionar. Gracias a ti, la vida continúa.</div></div><p class="pc">Tu puntaje total</p><div class="score">${S.sc} <small>de ${TOT*10} puntos</small></div><p class="rank">Rango: ${r}</p><div class="cbox"><span>🪙 Monedas ganadas: <b>${S.earn}</b> · Te quedan: <b>${S.coins}</b></span><small>Accesorios comprados: ${na}</small><small>Habilidades: ${hs||'ninguna'}</small></div><p class="pc">¡Felicitaciones, científico del futuro!</p><button class="btn go" onclick="shop('end')">🎨 Cambiar el look de Bio</button><button class="btn alt" onclick="intro()">Jugar de nuevo</button></div>`)}
intro();
</script>
</body>
</html>
