<script>
let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),hud=document.getElementById('hud'),ov=document.getElementById('ov');
let W,H,sc=null,lh='';

let DIF=S.dif==null?1:S.dif;const DN=['Fácil','Normal','Difícil','Experto'],DC=['#4ade80','#38bdf8','#fb923c','#f43f5e'],sk=n=>'l'+n+'d'+DIF;

let AC=null,master=null,muted=!!S.mute,mode='map',step=0,nextT=0,paused=false;
const ROOT=[131,98,110,87],ARP=[[262,330,392],[392,494,587],[440,523,659],[349,440,523]],PENT=[523,587,659,784,880,1046];
function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function sched(){
 if(!AC)return;
 if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
 while(nextT<AC.currentTime+.3){
  const g=mode=='game',sd=60/(g?128:100)/2,bar=Math.floor(step/8)%4,k=step%8;
  if(k%2==0)tone(ROOT[bar]*(k==4?1.5:1),nextT,sd*1.8,'triangle',.5);
  tone(ARP[bar][[0,1,2,1,0,1,2,1][k]],nextT,sd*.9,'square',.1);
  if(g&&k%2==0)tone(60,nextT,.12,'sine',.7);
  if(Math.random()<(g?.5:.35))tone(PENT[Math.floor(Math.random()*PENT.length)],nextT,sd*1.5,g?'square':'sine',g?.07:.12);
  step++;nextT+=sd;
 }
}
function audioStart(){
 try{
  if(!AC){
   AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.18;master.connect(AC.destination);
   const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0);
   nextT=AC.currentTime+.1;setInterval(sched,80);
  }
  if(AC.state!=='running')AC.resume();
 }catch(e){}
}

document.getElementById('bm').textContent=muted?'🔇':'🔊';
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,audioStart,true));

const ABOUT=[
 'Los glóbulos rojos reparten oxígeno por todo el cuerpo gracias a una proteína llamada hemoglobina, y las venas llevan la sangre de vuelta al corazón. Aquí eres un glóbulo rojo: esquiva los virus, recoge escudos (tus defensas) y no toques las paredes.',
 'Las arterias llevan la sangre desde el corazón. Con el tiempo, la grasa y el colesterol pueden formar placas y coágulos que las tapan y suben la presión. Rompe los coágulos a tiempo, pero no toques los glóbulos sanos.',
 'Todo está hecho de átomos. En el centro está el núcleo, con protones y neutrones, y alrededor giran los electrones. Aquí desarmas un átomo de carbono, base de los seres vivos: 6 protones, 6 neutrones y 6 electrones.',
 'Tu sistema inmune detecta y destruye virus antes de que se multipliquen. Aquí defiendes una célula: toca los virus que caen antes de que la alcancen. En el cuerpo, los glóbulos blancos y los anticuerpos hacen este trabajo.',
 'El corazón es un músculo que bombea sangre a todo el cuerpo; en reposo, un adulto tiene entre 60 y 100 latidos por minuto. Aquí sigue su ritmo: toca justo cuando el anillo llegue al corazón.',
 'El ADN guarda las instrucciones de tu cuerpo con cuatro bases: A, T, C y G. Se emparejan siempre igual: A con T, y C con G. Completa la cadena tocando la base que corresponde.'];
function back(){paused=document.getElementById('sign').style.display=='block';if(sc)ov.style.display='none';else inicio()}
function learn(){
 if(sc)paused=true;ov.style.display='flex';
 ov.innerHTML='<h1>Aprende</h1><div class="info"><div>🩸 <b>Glóbulos rojos:</b> llevan oxígeno por la sangre gracias a la hemoglobina.</div><div>🦴 <b>Hematopoyesis:</b> proceso por el que la médula ósea roja forma las células de la sangre.</div><div>🫁 <b>Pulmones:</b> ahí la sangre recibe oxígeno y suelta dióxido de carbono (CO₂).</div><div>🫀 <b>Corazón:</b> bombea la sangre a todo el cuerpo con cada latido.</div><div>🔴 <b>Arterias:</b> llevan sangre con oxígeno desde el corazón.</div><div>🧫 <b>Capilares:</b> vasos finitos donde el oxígeno pasa a las células.</div><div>🔵 <b>Venas:</b> traen la sangre de vuelta al corazón.</div><div>🦠 <b>Virus:</b> son diminutos y necesitan entrar en nuestras células para multiplicarse.</div><div>🛡️ <b>Escudo:</b> representa las defensas del cuerpo, como los anticuerpos.</div><div>🚀 <b>Propulsores:</b> tu glóbulo los tiene. Con un cohete sales disparado y atraviesas virus y células.</div><div>📈 <b>Niveles:</b> son 3 (Fácil, Normal y Difícil) y cada uno es más difícil que el anterior.</div><div>🔀 <b>Bifurcaciones y corrientes:</b> elige un camino y cuidado con las corrientes que te empujan.</div><div>🫀 <b>Válvulas:</b> se abren y se cierran para que la sangre vaya en un solo sentido.</div><div>🩹 <b>Grietas:</b> si una pared de un vaso se daña, el cuerpo la repara.</div><div>🎮 <b>Controles:</b> arrastra el dedo o usa flechas/WASD. Toca las células con cara de pedir aire para darles oxígeno.</div></div><button class="btn main" onclick="back()">Volver</button>';
}

}

 ['Carrera del glóbulo rojo','Eres un glóbulo rojo. Arrastra el dedo, esquiva virus, recoge escudos y no toques las paredes.','Dato: un glóbulo rojo da la vuelta a todo tu cuerpo en menos de un minuto.'],

function mug(x,y,r,t,k){

/* ===== DIVERSIÓN: puntos, combos, frases y sonidos ===== */
let SCORE=0,COMBO=0,CT=0;const POPS=[];
function addScore(n,x,y,txt,col){COMBO=CT>0?Math.min(5,COMBO+1):1;CT=2.2;const p=n*COMBO;SCORE+=p;POPS.push({x,y,t:(txt||'+'+p)+(COMBO>1?' x'+COMBO:''),c:col||'#ffee58',l:1});sfx2('coin',COMBO)}
function say(x,y,txt,col){POPS.push({x,y,t:txt,c:col||'#fff',l:1.6,big:1})}
function lose_combo(){COMBO=0;CT=0}
function sfx2(k,c){if(!AC||muted)return;const t0=AC.currentTime,m=Math.pow(1.122,Math.min(c||1,5)*2);
 if(k=='coin'){tone(660*m,t0,.1,'square',.2);tone(990*m,t0+.07,.12,'square',.18)}
 else if(k=='hit'){tone(150,t0,.25,'sawtooth',.35);tone(90,t0+.05,.3,'sawtooth',.3)}
 else if(k=='boost'){for(let i=0;i<6;i++)tone(300+i*120,t0+i*.05,.12,'sawtooth',.18)}
 else if(k=='win'){[523,659,784,1046].forEach((f,i)=>tone(f,t0+i*.12,.25,'square',.22))}
 else if(k=='ok'){tone(523,t0,.1,'triangle',.3);tone(784,t0+.1,.2,'triangle',.3)}}
function drawPops(dt){
 CT-=dt;if(CT<=0)COMBO=0;
 ctx.textAlign='center';ctx.lineJoin='round';
 for(let i=POPS.length-1;i>=0;i--){const p=POPS[i];p.l-=dt;p.y-=40*dt;if(p.l<=0){POPS.splice(i,1);continue}
  ctx.globalAlpha=Math.min(1,p.l*2);ctx.font='700 '+(p.big?21:18)+'px '+FFc;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText(p.t,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.t,p.x,p.y)}
 ctx.globalAlpha=1;
 if(SCORE>0&&sc&&sc.k!==0){ctx.textAlign='right';ctx.font='700 22px '+FFc;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.65)';ctx.strokeText('⭐ '+SCORE,W-12,70);ctx.fillStyle='#ffee58';ctx.fillText('⭐ '+SCORE,W-12,70);
  if(COMBO>1){const z=1+.12*Math.sin(performance.now()/90);ctx.save();ctx.translate(W-12,98);ctx.scale(z,z);ctx.font='700 19px '+FFc;ctx.strokeText('COMBO x'+COMBO,0,0);ctx.fillStyle=['#fff','#fff','#69f0ae','#40c4ff','#ff9100','#ff4081'][COMBO];ctx.fillText('COMBO x'+COMBO,0,0);ctx.restore()}
  ctx.textAlign='center'}
}
/* NIVEL 2: arteria tapada (difícil) */
function G2(){
 const GOAL=[25,40,55,70][DIF],SPM=[1.5,1,.8,.65][DIF],RT=[.6,1,1.3,1.6][DIF],LM=[1.5,1,.85,.7][DIF],PEN=[6,10,14,18][DIF];let clots=[],p=0,maxp=0,cleared=0,sp=0,fx=[],msg=0;
 const flow=Array.from({length:40},()=>({x:R(0,W),y:R(.25,.75),s:R(.7,1.3)}));
 const hc=Array.from({length:4},()=>({x:R(-W,0),y:R(.2,.8),s:R(.8,1.3)}));
 const top=()=>H*.22,bot=()=>H*.78,hy=c=>top()+(bot()-top())*c.y,hr=()=>H*.035;
 return{
  hud:()=>'Despejado '+cleared+'/'+GOAL+'   Presión '+Math.round(p)+'%',
  move(){},
  tap(x,y){
   let b=null,bd=1e9;
   for(const c of clots){const dd=Math.hypot(c.x-x,c.y-y);if(dd<=c.r+16&&dd<bd){b=c;bd=dd}}
   if(!b){
    for(const c of hc)if(Math.hypot(c.x-x,hy(c)-y)<hr()+10){p=Math.min(100,p+PEN);msg=1.2;burst(fx,c.x,hy(c),'#ff5a4d',10);c.x=-30;c.y=R(.2,.8);return}
    return;
   }
   b.hp--;b.r*=.82;burst(fx,b.x,b.y,'#f0b64a',6);
   if(b.hp<=0){clots.splice(clots.indexOf(b),1);cleared++;burst(fx,b.x,b.y,'#ffe08a',14)}
  },
  update(dt){
   sp-=dt;msg-=dt;
   if(sp<=0){
    sp=Math.max(.3,1-cleared*.018)*SPM;
    if(clots.length<12){
     const r=H*.04+Math.random()*H*.04,L=Math.max(3.2,5.5-cleared*.05)*LM;
     clots.push({x:R(W*.1,W*.9),y:R(top()+r,bot()-r),r,hp:r>H*.07?4:r>H*.058?3:r>H*.047?2:1,vx:R(-40,40),vy:R(-30,30),life:L,l0:L});
    }
   }
   for(let i=clots.length-1;i>=0;i--){const c=clots[i];
    c.x+=c.vx*dt;c.y+=c.vy*dt;c.life-=dt;
    if(c.x<c.r||c.x>W-c.r)c.vx*=-1;if(c.y<top()+c.r||c.y>bot()-c.r)c.vy*=-1;
    if(c.life<=0){p=Math.min(100,p+12);burst(fx,c.x,c.y,'#ff5a4d',10);clots.splice(i,1)}}
   const n=clots.length;p=Math.max(0,Math.min(100,p+(n*2.2*RT-(n<=1?2.5:0))*dt));maxp=Math.max(maxp,p);
   for(const f of flow){f.x+=120*(1-p/130)*f.s*dt;if(f.x>W+10)f.x=-10}
   for(const c of hc){c.x+=100*(1-p/150)*c.s*dt;if(c.x>W+30){c.x=-30;c.y=R(.2,.8)}}
   fxu(fx,dt);
   if(p>=100)return mend(false,2,0,'La arteria se tapó por completo. Despeja los coágulos más rápido.');
   if(cleared>=GOAL){const s=maxp<55?3:maxp<80?2:1;mend(true,2,s,'Arteria despejada. Presión máxima: '+Math.round(maxp)+'%.')}
  },
  draw(){
   {const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a0a5e');g.addColorStop(1,'#8e24aa');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
   const t=top(),b=bot(),pl=p/100*H*.08;
   {const g=ctx.createLinearGradient(0,t,0,b);g.addColorStop(0,'#ff5252');g.addColorStop(.5,'#ff1744');g.addColorStop(1,'#d50000');ctx.fillStyle=g;ctx.fillRect(0,t,W,b-t)}
   ctx.fillStyle='#ff9e80';ctx.fillRect(0,t-14,W,14);ctx.fillRect(0,b,W,14);
   ctx.fillStyle='#ffd740';ctx.fillRect(0,t,W,pl);ctx.fillRect(0,b-pl,W,pl);
   for(const f of flow)disc(f.x,t+(b-t)*f.y,H*.014,.5);
   for(const c of hc)cute(c.x,hy(c),hr(),performance.now()/1000+c.y,0);
   for(const c of clots){
    ctx.fillStyle='#ffd600';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);ctx.fill();
    ctx.fillStyle='#ff9100';ctx.beginPath();ctx.arc(c.x+c.r*.2,c.y+c.r*.15,c.r*.55,0,7);ctx.fill();
    ctx.fillStyle='#fff3c9';for(let i=0;i<c.hp;i++){ctx.beginPath();ctx.arc(c.x-(c.hp-1)*5+i*10,c.y-c.r*.72,3,0,7);ctx.fill()}
    mug(c.x,c.y,c.r*.9,performance.now()/1000+c.x,2);
    ctx.strokeStyle=c.life<1.5?'#ff5a4d':'rgba(255,255,255,.5)';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(c.x,c.y,c.r+5,-1.5708,-1.5708+6.283*c.life/c.l0);ctx.stroke();
   }
   fxd(fx);
   ctx.textAlign='center';ctx.font='700 15px "Fredoka","Trebuchet MS",system-ui,sans-serif';
   ctx.fillStyle=msg>0?'#f2b54a':'#a9c3c8';
   ctx.fillText(msg>0?'¡Ese era un glóbulo sano! Sube la presión':'Rompe los coágulos antes de que se acaben su tiempo. No toques los glóbulos rojos.',W/2,H*.16);
   ctx.fillStyle='#2d1520';ctx.fillRect(W*.1,H*.9,W*.8,10);
   ctx.fillStyle=p>70?'#ff5a4d':'#5fd1b0';ctx.fillRect(W*.1,H*.9,W*.8*p/100,10);
  }
 };
}

  up(){if(hold&&hold.on){const dist=hold.x+hold.len-x0();hold.on=false;hold.done=true;hold=null;if(dist<tol()*1.5)good(x0(),Math.abs(dist)<tol()*.5);else lose('Soltaste muy pronto la nota larga.')}},
  update(dt){
   t+=dt;pulse-=dt;msg-=dt;fever-=dt;sp-=dt;
   if(sp<=0&&hits+notes.filter(n=>!n.done&&n.k!='x').length<GOAL+2){sp=GAP*R(.85,1.2);spawn()}
   for(const n of notes)n.x-=vv()*dt;
   for(let i=notes.length-1;i>=0;i--){const n=notes[i];
    if(n.k=='h'){
     if(n.on){n.tk=(n.tk||0)+dt;if(n.tk>.25){n.tk=0;addScore(5,x0(),sy()-50,'+5')}if(n.x+n.len<x0()-tol()*.5){n.on=false;n.done=true;hold=null;good(x0(),true)}}
     else if(!n.done&&n.x<x0()-tol()){n.done=true;if(lose('Se te escapó una nota larga.'))return}
     if(n.done&&n.x+n.len<-20)notes.splice(i,1)}
    else if(n.x<x0()-tol()-12){if(n.k=='x')addScore(5,x0(),sy()-50,'¡Esquivado!','#b2ff59');else if(lose('Se te escapó un latido.'))return;notes.splice(i,1)}}
   fxu(fx,dt);
   if(hits>=GOAL)mend(true,5,lives>=ML?3:lives*2>=ML?2:1,'Seguiste el ritmo de Tuki y te quedaron '+lives+' corazones.');
  },
  draw(){
   const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,fever>0?'#ff4081':'#b71c1c');g.addColorStop(1,fever>0?'#7c4dff':'#4a148c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
   if(pulse>0){ctx.fillStyle='rgba(255,255,255,'+pulse*.4+')';ctx.fillRect(0,0,W,H)}
   ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=3;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(x0(),sy(),(t*80+k*90)%360,0,7);ctx.stroke()}
   ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,sy());for(const n of notes){if(n.k=='h')continue;ctx.lineTo(n.x-14,sy());ctx.lineTo(n.x-6,sy()-18);ctx.lineTo(n.x,sy()+22);ctx.lineTo(n.x+8,sy()-8);ctx.lineTo(n.x+14,sy())}ctx.lineTo(W,sy());ctx.stroke();
   ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(x0(),sy(),r0()*(1.05+Math.max(0,pulse)*.5),0,7);ctx.stroke();ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x0(),sy(),r0()*1.5,0,7);ctx.stroke();ctx.setLineDash([]);
   for(const n of notes){
    if(n.k=='b'){heartPath(n.x,sy(),r0()*.6);ctx.fillStyle='#ff80ab';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}
    else if(n.k=='h'){rr(ctx,n.x,sy()-r0()*.45,n.len,r0()*.9,r0()*.45,n.on?'#ffee58':'#ff80ab','#fff',3);heartPath(n.x,sy(),r0()*.6);ctx.fillStyle='#ff4081';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}
    else if(n.k=='x')vdraw(n.x,sy(),r0()*.55,t);
    else ctx.drawImage(iconCanvas('⭐'),n.x-r0()*.8,sy()-r0()*.8+Math.sin(t*6)*4,r0()*1.6,r0()*1.6)}
   host(5,W*.1,sy()+Math.sin(t*5)*4,Math.min(W*.085,H*.07)*(1+Math.min(streak,10)*.03+Math.max(0,pulse)*.8),t,pulse>0);
   fxd(fx);
   ctx.textAlign='center';ctx.font='700 20px '+FFc;ctx.fillStyle='#fff';ctx.fillText('Pulso: '+Math.min(180,60+streak*4)+' ppm',W/2,H*.16);
   if(msg>0){ctx.fillStyle='#ffee58';ctx.fillText(mt,W/2,H*.26)}
   if(t<9){ctx.font='700 17px '+FFc;ctx.fillStyle='#fff';ctx.fillText('Toca cuando la nota llegue al anillo',W/2,H*.7);ctx.fillText('Mantén apretadas las barras largas',W/2,H*.7+26);ctx.fillText('No toques los virus verdes',W/2,H*.7+52)}
  }};
}
/* entrada y bucle */
function xy(e){const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}
cv.addEventListener('pointerdown',e=>{if(sc){const[x,y]=xy(e);sc.tap(x,y)}});
cv.addEventListener('pointermove',e=>{if(sc){const[x,y]=xy(e);sc.move(x,y)}});
addEventListener('pointerup',()=>{if(sc&&sc.up)sc.up()});
addEventListener('pointercancel',()=>{if(sc&&sc.up)sc.up()});
const kn=e=>e.key.length==1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{K[kn(e)]=1});addEventListener('keyup',e=>{delete K[kn(e)]});
const skipEl=document.getElementById('skip');let lsk='';
let last=performance.now();
function loop(n){
 const dt=Math.min(.05,(n-last)/1000);last=n;
 {const q=(sc&&sc.k<3)?'block':'none';if(q!==lsk){lsk=q;skipEl.style.display=q}}
 if(sc&&!paused){sc.update(dt);if(sc){ctx.save();if(SHK>0){ctx.translate(R(-SHK,SHK),R(-SHK,SHK));SHK=Math.max(0,SHK-dt*40)}sc.draw();ctx.restore();drawPops(dt);drawBadges();const h=sc.hud();if(h!==lh){hud.textContent=h;lh=h}}}
 requestAnimationFrame(loop);
}
inicio();requestAnimationFrame(loop);
</script>
