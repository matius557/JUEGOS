<canvas id="c" tabindex="0" aria-label="La Gran Carrera: juego educativo sobre la fecundación"></canvas>
<script>
(function(){
// ===== 00_core.js =====
'use strict';
/* =====================================================================
   FOSFORITO y la Función de Medianoche
   Juego original de jefes con estética de dibujo animado de los años 30.
   Personajes, escenarios, música y sonido se generan por código.
   ===================================================================== */

// ---------- Constantes ----------
const W = 1280, H = 720, DT = 1 / 60, TAU = Math.PI * 2;
const GROUND = 620;
// Vista de las peleas: la cámara se aleja un poco (más espacio para moverse).
// El mundo visible va de VX0 a W en x y de VY0 a H en y (se agranda hacia la izquierda y hacia arriba).
const VZ_FIGHT = 0.8;
// Tiempo de los enemigos: en modo difícil todo lo de los jefes (ataques, balas, esbirros) corre más rápido
let EDT = DT;
const HARD_SPEED = 1.2;
const isHard = () => !!(G.save && G.save.diff === 'dificil');
let VZ = 1, VX0 = 0, VY0 = 0;
function setView(z) { VZ = z; VX0 = Math.round(W - W / z); VY0 = Math.round(H - H / z); }
const INK = '#1d140e';
const FONT = '"Cooper Black","Bookman Old Style","Georgia","DejaVu Serif",serif';
const FONT2 = '"Georgia","Palatino Linotype","Book Antiqua","DejaVu Serif",serif';
const METER_DMG = 150;

// ---------- Utilidades ----------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const choice = a => a[Math.floor(Math.random() * a.length)];
const sgn = v => (v < 0 ? -1 : 1);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const E = {
  inQ: t => t * t,
  outQ: t => 1 - (1 - t) * (1 - t),
  io: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outEl: t => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
  outBounce: t => { const n = 7.5625, d = 2.75; if (t < 1 / d) return n * t * t; if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75; if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375; return n * (t -= 2.625 / d) * t + 0.984375; }
};
function mixCol(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(lerp(pa >> 16, pb >> 16, t)), g = Math.round(lerp((pa >> 8) & 255, (pb >> 8) & 255, t)), bl = Math.round(lerp(pa & 255, pb & 255, t));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}

// ---------- Formas y colisiones ----------
const R = (x, y, w, h) => ({ t: 'r', x, y, w, h });
const C = (x, y, r) => ({ t: 'c', x, y, r });
const S = (x1, y1, x2, y2, r) => ({ t: 's', x1, y1, x2, y2, r });
function circRect(c, r) {
  const nx = clamp(c.x, r.x, r.x + r.w), ny = clamp(c.y, r.y, r.y + r.h);
  const dx = c.x - nx, dy = c.y - ny;
  return dx * dx + dy * dy < c.r * c.r;
}
function segD2(s, px, py) {
  const vx = s.x2 - s.x1, vy = s.y2 - s.y1;
  const l2 = vx * vx + vy * vy || 1;
  const t = clamp(((px - s.x1) * vx + (py - s.y1) * vy) / l2, 0, 1);
  const dx = s.x1 + vx * t - px, dy = s.y1 + vy * t - py;
  return dx * dx + dy * dy;
}
function segHit(s, o) {
  if (o.t === 'c') { const rr = s.r + o.r; return segD2(s, o.x, o.y) < rr * rr; }
  if (o.t === 'r') {
    const x0 = o.x - s.r, y0 = o.y - s.r, x1 = o.x + o.w + s.r, y1 = o.y + o.h + s.r;
    let t0 = 0, t1 = 1;
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const p = [-dx, dx, -dy, dy], q = [s.x1 - x0, x1 - s.x1, s.y1 - y0, y1 - s.y1];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; }
      else {
        const t = q[i] / p[i];
        if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
        else { if (t < t0) return false; if (t < t1) t1 = t; }
      }
    }
    return true;
  }
  return false;
}
function overlap(a, b) {
  if (!a || !b) return false;
  if (a.t === 'r' && b.t === 'r') return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  if (a.t === 'c' && b.t === 'c') { const dx = a.x - b.x, dy = a.y - b.y, rr = a.r + b.r; return dx * dx + dy * dy < rr * rr; }
  if (a.t === 'c' && b.t === 'r') return circRect(a, b);
  if (a.t === 'r' && b.t === 'c') return circRect(b, a);
  if (a.t === 's') return segHit(a, b);
  if (b.t === 's') return segHit(b, a);
  return false;
}
function center(s) {
  if (s.t === 'c') return { x: s.x, y: s.y };
  if (s.t === 'r') return { x: s.x + s.w / 2, y: s.y + s.h / 2 };
  return { x: (s.x1 + s.x2) / 2, y: (s.y1 + s.y2) / 2 };
}

// ---------- Corutinas (guiones de los jefes) ----------
function* wait(t) { while (t > 0) { t -= EDT; yield; } }
function* until(fn, max = 30) { let t = 0; while (!fn() && t < max) { t += EDT; yield; } }
function* tween(dur, fn) { let t = 0; fn(0); while (t < dur) { yield; t += EDT; fn(Math.min(1, t / dur)); } }
// all(): corre varias corutinas a la vez. Si se corta (cambio de fase), cierra las que quedaron (corren sus "finally")
function* all(...gs) {
  try { while (gs.length) { for (let i = gs.length - 1; i >= 0; i--) if (gs[i].next().done) gs.splice(i, 1); if (gs.length) yield; } }
  finally { for (const g of gs) { try { g.return(); } catch (e) { /* nada */ } } }
}
function* during(dur, fn) { let t = 0; while (t < dur) { fn(t); t += EDT; yield; } }

// ---------- Estado global ----------
const G = {
  t: 0, scene: null, hitstop: 0, slow: 1, slowAcc: 0, shakeA: 0, shakeT: 0, camX: 0, camY: 0,
  flash: 0, flashCol: '#fff', player: null, boss: null, arena: null,
  pb: [], eb: [], minions: [], parts: [], trans: null, banner: null,
  canShoot: false, god: false, bot: false, dark: 0, wind: { x: 0, y: 0 }, superFx: null, toast: null,
  // lowFx: gráficos rápidos (menos brillos, sombreado simple, menos partículas) para que no se trabe
  lowFx: false, autoLow: false,
  settings: { music: true, film: true, voice: true, rumble: true, pad: null, quality: 'auto' },
  save: null, run: { hp: 3, next: 0, free: false }, bossIdx: 0,
  doShake(a, t) {
    this.shakeA = Math.max(this.shakeA, a); this.shakeT = Math.max(this.shakeT, t);
    if (a >= 8 && typeof rumble === 'function') rumble(Math.min(1, a / 18), 0.35, Math.min(600, t * 700));
  },
  doFlash(a = 0.6, col = '#fff') { this.flash = Math.max(this.flash, a); this.flashCol = col; }
};
// Distribución del mando (índices del "mapeo estándar": 0 A, 1 B, 2 X, 3 Y, 4 LB, 5 RB, 6 LT, 7 RT, 8 Vista, 9 Menú)
const PAD_PRESETS = {
  clasica: { jump: 0, shoot: 2, special: 1, dash: 3, lock: 5, swap: 4, parry: 7 },
  gatillos: { jump: 0, shoot: 2, special: 6, dash: 7, lock: 5, swap: 4, parry: 1 }
};
G.settings.pad = Object.assign({}, PAD_PRESETS.clasica);
const Settings = {
  KEY: 'gran_carrera_ajustes_v1',
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(this.KEY));
      if (s && typeof s === 'object') {
        for (const k of ['music', 'film', 'voice', 'rumble']) if (typeof s[k] === 'boolean') G.settings[k] = s[k];
        if (s.pad && typeof s.pad === 'object') {
          G.settings.pad = Object.assign({}, PAD_PRESETS.clasica, s.pad);
          // ajustes viejos sin botón de parry: se le da uno libre
          const M = G.settings.pad;
          if (s.pad.parry == null || Object.keys(M).some(k => k !== 'parry' && M[k] === M.parry)) M.parry = [7, 6, 1, 3, 10, 11].find(b => !Object.keys(M).some(k => k !== 'parry' && M[k] === b));
        }
        if (['auto', 'alta', 'rapida'].includes(s.quality)) G.settings.quality = s.quality;
      }
    } catch (e) { /* sin almacenamiento */ }
    updLowFx();
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(G.settings)); } catch (e) { /* sin almacenamiento */ } }
};
// Pantalla completa (si la vista del navegador lo permite)
function toggleFullscreen() {
  const fail = () => toast('Esta vista no deja pantalla completa: abrí el juego en una pestaña propia y apretá F11', 4);
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || (document.fullscreenEnabled === false)) { fail(); return; }
    const pr = req.call(el); if (pr && pr.catch) pr.catch(fail);
  } catch (e) { fail(); }
}
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function updLowFx() { const q = G.settings.quality; G.lowFx = q === 'rapida' || (q === 'auto' && G.autoLow); }
const QUALITY_NAMES = { auto: 'Automáticos', alta: 'Lindos', rapida: 'Rápidos' };
const DIFF_NAMES = { relajado: 'Relajada', normal: 'Normal', dificil: 'Difícil' };
// Modo de viaje por zona: 'pie' (correr y saltar) o 'avion' (volar libre por toda la pantalla)
const MODE_DEFAULT = ['pie', 'pie', 'pie', 'avion', 'pie'];
function zoneMode(i) { const m = G.save && G.save.modes && G.save.modes[i]; return m === 'pie' || m === 'avion' ? m : MODE_DEFAULT[i]; }
function setZoneMode(i, m) { if (!G.save.modes) G.save.modes = MODE_DEFAULT.slice(); G.save.modes[i] = m; Save.store(); }

// ---------- Guardado ----------
const Save = {
  KEY: 'gran_carrera_zoide_v1',
  fresh() {
    return { beaten: [false, false, false, false, false], weapons: ['atp'], items: ['plasma', 'mito'],
      loadout: { w: ['atp', null], item: 'plasma' }, diff: 'normal', deaths: 0, time: 0, done: false,
      cards: ['zoide', 'carrera'], seenLesson: [false, false, false, false, false], intro: false, modes: MODE_DEFAULT.slice(),
      aid: [0, 1, 2, 3, 4].map(() => ({ hp: 0, parry: 0 })) };
  },
  load() {
    try { const s = JSON.parse(localStorage.getItem(this.KEY)); if (s && Array.isArray(s.beaten)) return Object.assign(this.fresh(), s); } catch (e) { /* sin almacenamiento */ }
    return null;
  },
  store() { try { localStorage.setItem(this.KEY, JSON.stringify(G.save)); } catch (e) { /* sin almacenamiento */ } },
  clear() { try { localStorage.removeItem(this.KEY); } catch (e) { /* sin almacenamiento */ } }
};
// Vidas: relajada 5 · normal 4 · difícil 3 (+1 con Mitocondrias extra)
function calcMaxHp() { return ({ relajado: 5, normal: 4, dificil: 3 }[G.save.diff] || 4) + (G.save.loadout.item === 'mito' ? 1 : 0); }

// ---------- Ayudas (solo dificultad Relajada y Normal) ----------
// Cada vez que el jefe de una zona te elimina:
//   · el jefe empieza con 5 % menos de vida (hasta 5 veces = -25 %)
//   · arrancás con 1 punto de PARRY lleno más (hasta 3 veces)
// Se mantienen hasta superar la zona; al superarla se reinician.
const AID = { HP_STEP: 0.05, HP_MAX: 5, PARRY_MAX: 3 };
const aidOn = () => !!(G.save && (G.save.diff === 'relajado' || G.save.diff === 'normal'));
function aidSlot(i) {
  if (!Array.isArray(G.save.aid)) G.save.aid = [];
  const a = G.save.aid[i];
  if (!a || typeof a !== 'object') G.save.aid[i] = { hp: 0, parry: 0 };
  return G.save.aid[i];
}
function aidLevel(i) {
  if (i == null) i = G.bossIdx;
  if (!aidOn()) return { hp: 0, parry: 0 };
  const a = aidSlot(i);
  return { hp: clamp(a.hp | 0, 0, AID.HP_MAX), parry: clamp(a.parry | 0, 0, AID.PARRY_MAX) };
}
function aidAddDeath(i) {
  if (!aidOn()) return;
  const a = aidSlot(i);
  a.hp = Math.min(AID.HP_MAX, (a.hp | 0) + 1);
  a.parry = Math.min(AID.PARRY_MAX, (a.parry | 0) + 1);
  Save.store();
}
function aidReset(i) {
  if (!G.save || !Array.isArray(G.save.aid)) return;
  G.save.aid[i] = { hp: 0, parry: 0 };
  Save.store();
}
function aidText(a) {
  const t = [];
  if (a.hp) t.push('jefe −' + (a.hp * 5) + ' % de vida');
  if (a.parry) t.push('+' + a.parry + (a.parry === 1 ? ' punto' : ' puntos') + ' de PARRY');
  return t.join(' · ');
}

// ---------- Entrada (teclado + mando) ----------
const Input = (() => {
  const MAP = {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
    jump: ['KeyZ', 'Space', 'KeyJ'], shoot: ['KeyX', 'KeyK'], dash: ['KeyC', 'ShiftLeft', 'ShiftRight', 'KeyL'], parry: ['KeyR', 'KeyH'],
    special: ['KeyV', 'KeyI'], super: ['KeyB', 'KeyO'], lock: ['ControlLeft', 'ControlRight', 'KeyF', 'KeyU'],
    swap: ['KeyQ', 'Tab'], pause: ['Escape', 'KeyP'], confirm: ['Enter', 'KeyZ', 'Space', 'KeyJ'],
    back: ['Escape', 'Backspace', 'KeyX', 'KeyK'], interact: ['ArrowUp', 'KeyW', 'KeyE', 'KeyX'], mute: ['KeyM']
  };
  const DIRS = ['left', 'right', 'up', 'down'];
  const PREVENT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Backspace']);
  const down = new Set();
  let pending = new Set(), pressed = new Set(), anyPending = false, any = false;
  let padNow = {}, padPrev = {}, rawNow = [], rawPrev = [];
  let sec = null, stickOn = false;
  const holdT = { left: 0, right: 0, up: 0, down: 0 }, rep = {};
  const st = { lastDevice: 'key', padName: '', padCount: 0, blocked: false, nintendo: false, joycon: false };
  // Mandos de Nintendo (Pro Controller, Joy-Con, Switch Online): vendor 057e
  const NIN_RE = /057e|nintendo|joy-?con|pro controller|switch/i;
  addEventListener('keydown', e => {
    if (PREVENT.has(e.code) || e.code === 'ControlLeft') e.preventDefault();
    if (!e.repeat) { pending.add(e.code); anyPending = true; }
    down.add(e.code);
    st.lastDevice = 'key';
    Audio.unlock();
  }, { passive: false });
  addEventListener('keyup', e => down.delete(e.code));
  addEventListener('blur', () => down.clear());
  // ¿El navegador deja usar el mando en esta página? (algunas vistas incrustadas lo bloquean)
  try { const fp = document.permissionsPolicy || document.featurePolicy; if (fp && fp.allowsFeature && !fp.allowsFeature('gamepad')) st.blocked = true; } catch (e) { /* sin política */ }
  // Lleva cualquier mando al "mapeo estándar" (incluye Xbox en Firefox/Linux, que llega sin mapear)
  function normalize(gp) {
    const B = new Array(17).fill(false);

let RS = 1;

// ---------- Locutor (voz del sistema, si hay una en español) ----------
let VOZ = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    VOZ = vs.find(v => /^es[-_](AR|UY|419|MX|US)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
  } catch (e) { VOZ = null; }
}
try { if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } } catch (e) { /* sin voz */ }
function say(text) {
  if (!G.settings.voice || !VOZ) return;
  // la voz se pide fuera del cuadro del juego: en algunas compus hablar frena un instante y eso se notaba como un tirón
  setTimeout(() => {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.voice = VOZ; u.lang = VOZ.lang; u.rate = 1.1; u.pitch = 0.8; u.volume = 1;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) { /* sin voz */ }
  }, 0);
}

// ---------- Efecto de película antigua ----------
const Film = (() => {
  // Todo se pre-dibuja a la resolución real de la pantalla: así cada cuadro solo copia imágenes sin escalar (mucho más rápido)
  const grains = [];
  let tint = null, scratches = [], dust = [], weave = 0;
  function init() {
    for (let k = 0; k < 2; k++) {
      const c = document.createElement('canvas'); c.width = 256; c.height = 144;
      const g = c.getContext('2d');
      const id = g.createImageData(256, 144);
      for (let i = 0; i < id.data.length; i += 4) {
        const v = Math.random() < 0.5 ? 20 : 255;
        id.data[i] = id.data[i + 1] = id.data[i + 2] = v;
        id.data[i + 3] = Math.random() < 0.55 ? Math.random() * 34 : 0;
      }
      g.putImageData(id, 0, 0);
      grains.push(makeLayer(W + 40, H + 40, gg => gg.drawImage(c, 0, 0, W + 40, H + 40)));
    }
    // tono sepia + viñeta en una sola imagen que se "multiplica" sobre la escena
    const v = document.createElement('canvas'); v.width = 640; v.height = 360;
    const g = v.getContext('2d');
    g.fillStyle = 'rgb(255,245,231)'; g.fillRect(0, 0, 640, 360);
    const gr = g.createRadialGradient(320, 180, 110, 320, 180, 390);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.7, 'rgba(0,0,0,0.18)'); gr.addColorStop(1, 'rgba(0,0,0,0.6)');
    g.fillStyle = gr; g.fillRect(0, 0, 640, 360);
    tint = makeLayer(W, H, gg => gg.drawImage(v, 0, 0, W, H));
  }
  function update() {
    if (Math.random() < 0.035) scratches.push({ x: rand(0, W), life: randi(3, 14), w: rand(0.8, 2.4), light: Math.random() < 0.6, wob: rand(-4, 4) });
    scratches = scratches.filter(s => --s.life > 0);
    if (Math.random() < 0.14) dust.push({ x: rand(0, W), y: rand(0, H), life: randi(1, 3), r: rand(1, 3.5), hair: Math.random() < 0.3 });
    dust = dust.filter(d => --d.life > 0);
    weave = Math.random() < 0.06 ? rand(-1.2, 1.2) : weave * 0.8;
  }
  function draw(ctx) {
    if (!G.settings.film) return;
    update();
    ctx.save();
    if (!G.lowFx) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'multiply';
      ctx.drawImage(tint.c, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.6;
      const gl = grains[(Math.random() * grains.length) | 0];
      ctx.drawImage(gl.c, -Math.floor(Math.random() * 30 * RS), -Math.floor(Math.random() * 30 * RS));
      ctx.globalAlpha = 1;
      ctx.setTransform(RS, 0, 0, RS, 0, 0);
    }
    for (const s of scratches) {
      ctx.strokeStyle = s.light ? 'rgba(255,250,235,0.32)' : 'rgba(30,20,10,0.32)';
      ctx.lineWidth = s.w;
      ctx.beginPath(); ctx.moveTo(s.x, 0);
      ctx.bezierCurveTo(s.x + s.wob, H * 0.33, s.x - s.wob, H * 0.66, s.x + s.wob * 0.5, H); ctx.stroke();
    }
    ctx.fillStyle = ctx.strokeStyle = 'rgba(20,12,6,0.55)';
    for (const d of dust) {
      if (d.hair) { ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.bezierCurveTo(d.x + 12, d.y - 8, d.x + 4, d.y + 14, d.x + 18, d.y + 10); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill(); }
    }
    const fl = Math.random() * 0.045;
    if (fl > 0.012 && !G.lowFx) { ctx.fillStyle = `rgba(0,0,0,${fl.toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
    ctx.restore();
  }
  return { init, draw, get weave() { return G.settings.film ? weave : 0; } };
})();

// ---------- Transición de iris (clásica de los dibujos de época) ----------
function iris(cb, dur = 0.5, cx, cy) {
  if (G.trans) return;
  G.trans = { t: 0, dur, phase: 'out', cb, cx: cx != null ? cx : W / 2, cy: cy != null ? cy : H / 2 };
}
function updTrans() {
  const T = G.trans; if (!T) return;
  T.t += DT;
  if (T.phase === 'out' && T.t >= T.dur) { T.phase = 'hold'; T.t = 0; const cb = T.cb; T.cb = null; if (cb) cb(); }
  else if (T.phase === 'hold' && T.t >= 0.15) { T.phase = 'in'; T.t = 0; T.cx = W / 2; T.cy = H / 2; }
  else if (T.phase === 'in' && T.t >= T.dur) G.trans = null;
}
function drawTrans(ctx) {
  const T = G.trans; if (!T) return;
  let k;
  if (T.phase === 'out') k = 1 - E.inQ(Math.min(1, T.t / T.dur));
  else if (T.phase === 'hold') k = 0;
  else k = E.outQ(Math.min(1, T.t / T.dur));
  const Rr = k * 900;
  ctx.save();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.rect(-10, -10, W + 20, H + 20);
  if (Rr > 0.5) ctx.arc(T.cx, T.cy, Rr, 0, TAU, true);
  ctx.fill('evenodd');
  if (Rr > 0.5) { ctx.lineWidth = 6; ctx.strokeStyle = '#1a0f08'; ctx.beginPath(); ctx.arc(T.cx, T.cy, Rr, 0, TAU); ctx.stroke(); }
  ctx.restore();
}

// ---------- Carteles grandes (largada, zona superada, eliminado, fecundación) ----------
function banner(kind, opts = {}) { G.banner = Object.assign({ kind, t: 0 }, opts); }
const BANNER_DUR = { largada: 2.1, superada: 3.2, fecundacion: 3.6, eliminado: 2.0, text: 2 };
function updBanner() {
  const B = G.banner; if (!B) return;
  B.t += DT;
  const dur = B.kind === 'text' ? (B.dur || 2) : (BANNER_DUR[B.kind] || 2);
  if (B.t > dur) G.banner = null;
}
function raceFlag(ctx, x, y, s, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  D.line(ctx, -60, -70, -60, 90, 9, INK); D.line(ctx, -60, -70, -60, 90, 4, '#c9a24a');
  D.circ(ctx, -60, -74, 7, '#ffd23f', 3);
  const cols = 6, rows = 4, cw = 22, rh = 20;
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const wv = (k) => Math.sin(t * 9 - k * 0.55) * 7 * (k / cols);
    const x0 = -60 + i * cw, x1 = x0 + cw;
    const y0 = -66 + j * rh;
    ctx.beginPath();
    ctx.moveTo(x0, y0 + wv(i)); ctx.lineTo(x1, y0 + wv(i + 1)); ctx.lineTo(x1, y0 + rh + wv(i + 1)); ctx.lineTo(x0, y0 + rh + wv(i)); ctx.closePath();
    ctx.fillStyle = (i + j) % 2 ? INK : '#f7f0de'; ctx.fill();
  }
  ctx.lineWidth = 4; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.moveTo(-60, -66);
  for (let i = 0; i <= cols; i++) ctx.lineTo(-60 + i * cw, -66 + Math.sin(t * 9 - i * 0.55) * 7 * (i / cols));
  for (let i = cols; i >= 0; i--) ctx.lineTo(-60 + i * cw, -66 + rows * rh + Math.sin(t * 9 - i * 0.55) * 7 * (i / cols));
  ctx.closePath(); ctx.stroke();
  ctx.restore();
}
function drawBanner(ctx) {
  const B = G.banner; if (!B) return;
  const t = B.t;
  ctx.save();
  if (B.kind === 'largada') {
    const words = ['¡EN SUS MARCAS!', '¡LISTOS!', '¡FUERA!'];
    const idx = t < 0.6 ? 0 : t < 1.2 ? 1 : 2;
    const lt = idx === 0 ? t : idx === 1 ? t - 0.6 : t - 1.2;
    const sc = E.outBack(Math.min(1, lt / 0.28));
    ctx.globalAlpha = idx === 2 ? clamp(1 - (t - 1.75) / 0.35, 0, 1) : 1;
    raceFlag(ctx, W / 2 - 10, 190, 1, idx === 2 ? t * 2.5 : t);
    ctx.translate(W / 2, 370); ctx.scale(sc, sc);

  } else if (B.kind === 'superada' || B.kind === 'fecundacion') {
    const fec = B.kind === 'fecundacion';
    const sc = E.outBack(Math.min(1, t / 0.4));
    const end = fec ? 3.1 : 2.7;
    ctx.globalAlpha = clamp(1 - (t - end) / 0.5, 0, 1);
    ctx.translate(W / 2, H / 2 - 20); ctx.scale(sc, sc); ctx.rotate(Math.sin(t * 2) * 0.03);
    ctx.fillStyle = 'rgba(20,10,4,0.55)'; ctx.beginPath(); ctx.arc(0, 0, 230, 0, TAU); ctx.fill();
    ctx.lineWidth = 10; ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 220, 0, TAU); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 200, 0, TAU); ctx.stroke();
    for (let i = 0; i < 28; i++) { const a = i / 28 * TAU + t * 0.4; D.line(ctx, Math.cos(a) * 226, Math.sin(a) * 226, Math.cos(a) * 254, Math.sin(a) * 254, 4, '#ffd23f'); }
    if (fec) {
      txt(ctx, '¡FECUNDACIÓN!', 0, 8, { size: 76, fill: '#fff3d6', lw: 12, shadow: 6 });
    } else {
      txt(ctx, 'ZONA', 0, -62, { size: 52, fill: '#ffd23f', lw: 9, shadow: 5 });
      txt(ctx, '¡SUPERADA!', 0, 22, { size: 90, fill: '#fff3d6', lw: 13, shadow: 7 });
    }
  } else if (B.kind === 'eliminado') {
    const sc = E.outBack(Math.min(1, t / 0.3));
    ctx.translate(W / 2, 200); ctx.scale(sc, sc); ctx.rotate(-0.05);
    txt(ctx, '¡ELIMINADO!', 0, 0, { size: 104, fill: '#ff6a3d', lw: 14, shadow: 8 });
  } else if (B.kind === 'text') {

    txt(ctx, B.text, W / 2, B.y || 300, { size: B.size || 64, fill: B.fill || '#fff3d6', lw: 10, shadow: 6 });
  }
  ctx.restore();
}

// ---------- Ayudantes de dibujo (contorno grueso, estilo de los años 30) ----------
const D = {
  P(ctx, fill, lw = 4, st = INK) {

    if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = st; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
  },

  circ(ctx, x, y, r, fill, lw = 4) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, Math.abs(r)), 0, TAU); D.P(ctx, fill, lw); },

// Cola (flagelo) como trazo con grosor decreciente

  for (let pass = 0; pass < 2; pass++) {

function drawZoide(ctx, p, o = {}) {
  const t = G.t;

  ctx.translate(p.x, p.y);

// ---------- Partículas ----------
class Part {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, life: 0.5, size: 10, color: '#fff', kind: 'puff', g: 0, drag: 0, rot: 0, vr: 0, dead: false, lw: 2.5 }, o);
    this.ml = this.life;
  }
  update() {
    if (this.drag) { const k = Math.max(0, 1 - this.drag * DT); this.vx *= k; this.vy *= k; }
    this.vy += this.g * DT; this.x += this.vx * DT; this.y += this.vy * DT; this.rot += this.vr * DT;
    this.life -= DT; if (this.life <= 0) this.dead = true;
  }
  draw(ctx) {
    const k = clamp(this.life / this.ml, 0, 1);
    switch (this.kind) {
      case 'puff': {
        const r = this.size * (0.6 + 0.4 * (1 - k)) * Math.min(1, k * 3); D.circ(ctx, this.x, this.y, r, this.color, this.lw);
        if (r > 8 && !G.lowFx) { ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(this.x - r * 0.32, this.y - r * 0.32, r * 0.36, 0, TAU); ctx.fill(); }
        break;
      }
      case 'flash': { ctx.save(); ctx.globalAlpha = k; D.star(ctx, this.x, this.y, this.size * (1.3 - k * 0.5), this.size * 0.45, 8, this.rot, '#fffbe8', 0); ctx.restore(); break; }
      case 'smoke': { ctx.save(); ctx.globalAlpha = k * 0.6; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (1.6 - k), 0, TAU); ctx.fill(); ctx.restore(); break; }
      case 'spark': { const l = Math.hypot(this.vx, this.vy) * 0.03 + 3; const a = Math.atan2(this.vy, this.vx); D.line(ctx, this.x, this.y, this.x - Math.cos(a) * l, this.y - Math.sin(a) * l, 3 * k + 1, this.color); break; }
      case 'star': D.star(ctx, this.x, this.y, this.size * k, this.size * 0.4 * k, 4, this.rot, this.color, 2); break;
      case 'ring': { ctx.save(); ctx.globalAlpha = k; ctx.lineWidth = 5 * k + 1; ctx.strokeStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * (1.6 - k), 0, TAU); ctx.stroke(); ctx.restore(); break; }
      case 'drop': D.ell(ctx, this.x, this.y, this.size * 0.6, this.size, Math.atan2(this.vy, this.vx) - Math.PI / 2, this.color, 2); break;
      case 'debris': { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot); D.rr(ctx, -this.size / 2, -this.size / 3, this.size, this.size * 0.66, 2, this.color, 2); ctx.restore(); break; }
      case 'streak': { ctx.save(); ctx.globalAlpha = Math.min(1, k * 2) * 0.55; D.line(ctx, this.x, this.y, this.x - this.vx * 0.05, this.y - this.vy * 0.05, 3, this.color); ctx.restore(); break; }
      case 'bubble': { ctx.save(); ctx.globalAlpha = Math.min(1, k * 2); D.circ(ctx, this.x, this.y, this.size, 'rgba(255,255,255,0.2)', 2); ctx.restore(); break; }
      case 'text': { ctx.save(); ctx.globalAlpha = Math.min(1, k * 2.5); txt(ctx, this.text, this.x, this.y, { size: this.size, fill: this.color, lw: 6 }); ctx.restore(); break; }
    }
  }
}
// Con gráficos rápidos se crean la mitad de partículas

const FX = {

  },

class PB {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, r: 10, dmg: 4, life: 1, kind: 'atp', pierce: false, hitSet: null, t: 0, dead: false, homing: 0 }, o);
    this.ml = this.life;
    if (this.pierce) this.hitSet = new Set();

  update() {
    this.t += DT;

        const da = wrapA(a - cur), na = cur + clamp(da, -this.homing * DT, this.homing * DT);
        const sp = Math.hypot(this.vx, this.vy);
        this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
      }
    }
    if (this.upd) this.upd(this);
    this.x += this.vx * DT; this.y += this.vy * DT;
    if (this.ex) { this.trT = (this.trT || 0) - DT; if (this.trT <= 0) { this.trT = G.lowFx ? 0.1 : 0.055; exTrail(this); } }
    this.life -= DT; if (this.impT > 0) this.impT -= DT;
    if (this.life <= 0 || this.x < VX0 - 150 || this.x > W + 150 || this.y < VY0 - 200 || this.y > H + 150) this.dead = true;
  }
  shape() { return C(this.x, this.y, this.r); }
  draw(ctx) { (this.drw || PBD[this.kind] || PBD.atp)(ctx, this); }
}
function nearestTarget(x, y) {
  let best = null, bd = 1e9;
  for (const m of G.minions) {
    if (m.dead || m.hittable === false) continue;
    const d = Math.hypot(m.x - x, m.y - y); if (d < bd) { bd = d; best = { x: m.x, y: m.y }; }
  }
  const b = G.boss;
  if (b && b.state === 'fight') {
    for (const h of b.hurtboxes()) { const c = center(h); const d = Math.hypot(c.x - x, c.y - y) * 0.9; if (d < bd) { bd = d; best = c; } }
  }
  return best;
}

const FOOT_PINK = 0.22;
function footPinkRoll(e) {
  if (e.pink || e.harmless || e.persist || e.cancelable === false || e.shootable || e.sticky || e.noPink) return false;
  if (!(e.small || (e.r <= 32 && (e.vx || e.vy)))) return false;      // solo proyectiles (no ondas, hilos ni paredes)
  const p = G.player;
  return !!p && p.mode === 'ground' && G.scene === Scenes.fight && Math.random() < FOOT_PINK;
}
class EB {
  constructor(o) {
    // r = tamaño dibujado · hr = radio de golpe (más chico que el dibujo, para que sea justo)
    Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, r: 12, hr: 0, life: 10, t: 0, pink: false, dead: false,
      harmless: false, persist: false, cancelable: true, shootable: false, fromAbove: false, rot: 0, vr: 0, tags: '' }, o);
    if (footPinkRoll(this)) this.pink = true;
  }
  update() {
    this.t += EDT;
    this.vx += this.ax * EDT; this.vy += this.ay * EDT;
    this.x += this.vx * EDT; this.y += this.vy * EDT; this.rot += this.vr * EDT;
    if (this.upd) this.upd(this);
    this.life -= EDT;
    if (this.life <= 0) this.dead = true;
    if (!this.persist && (this.x < VX0 - 260 || this.x > W + 260 || this.y > H + 260 || this.y < VY0 - 420)) this.dead = true;
  }

  has(tag) { return this.tags.indexOf(tag) >= 0; }
  draw(ctx) {
    if (this.pink) pinkGlow(ctx, this.x, this.y, this.r, this.t);
    else if (this.small) ebShadow(ctx, this.x, this.y, this.r);

  }
}

class Minion {
  constructor(o) {
    Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, hp: 10, r: 24, t: 0, dead: false, flash: 0, contact: true, hittable: true, face: -1 }, o);
    this.maxHp = this.hp;

    this.t += EDT; if (this.flash > 0) this.flash -= EDT;
    if (this.upd) this.upd(this); else { this.x += this.vx * EDT; this.y += this.vy * EDT; }
    if (this.x < VX0 - 220 || this.x > W + 320 || this.y > H + 220 || this.y < VY0 - 320) this.dead = true;
  }
  shape() { return this.shp ? this.shp(this) : C(this.x, this.y, this.r); }

    if (this.dead) return 0;

    if (this.flash > 0) { ctx.save(); ctx.globalAlpha = 0.5; ctx.fillStyle = '#fffbe8'; ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 0.9, 0, TAU); ctx.fill(); ctx.restore(); }
  }
}

}

    ctx.strokeStyle = 'rgba(110,180,215,0.8)'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = -2; i <= 2; i++) { ctx.moveTo(i * p.w / 6, 0); ctx.lineTo(i * p.w / 6 + 9, 22); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(-p.w / 2 + 18, 1, p.w - 36, 3);
    if (p.crack > 0) {
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath();
      const n = Math.ceil(p.crack * 4);
      for (let i = 0; i < n; i++) { const x0 = -p.w * 0.35 + i * p.w * 0.23; ctx.moveTo(x0, 0); ctx.lineTo(x0 + 8, 9); ctx.lineTo(x0 - 4, 15); ctx.lineTo(x0 + 6, 23); }

    }

  }
  if (g >= 1) { const gl = p.glint || 0; if (gl > 0) { ctx.save(); ctx.globalAlpha = 0.5 * gl; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, top - 70, 30 * gl, 0, TAU); ctx.fill(); ctx.restore(); } D.star(ctx, cx, top - 70, 11 + gl * 14, 4 + gl * 5, 4, G.t * 3, '#f2fdff', 2.5); }
  ctx.restore();
}

// Aviso de cristal que va a caer: destello arriba y una columna de luz hasta el piso
function drawSkyWarn(ctx, e) {
  const a = 0.5 + 0.5 * Math.sin(e.t * 20);

  const gr = ctx.createLinearGradient(0, 0, 0, GROUND); gr.addColorStop(0, 'rgba(230,250,255,0.7)'); gr.addColorStop(1, 'rgba(230,250,255,0)');

// ---------- 4.ª fase (difícil): la malla de progesterona ----------
// Hilo de la malla: primero un aviso punteado; después, un hilo grueso de moco que lastima y frena
const MESH_X1 = 880;
function drawMeshThread(ctx, e) {
  const v = e.vert;
  ctx.save();
  if (e.st === 0) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(e.t * 26); ctx.setLineDash([14, 10]);
    if (v) D.line(ctx, e.x, VY0, e.x, GROUND, 4, '#e8fff9'); else D.line(ctx, VX0, e.y, MESH_X1, e.y, 4, '#e8fff9');
    ctx.restore(); return;
  }
  const k = Math.min(1, e.t2 / 0.1) * Math.min(1, e.life / 0.2), w = 12 * k, t = e.t;
  ctx.beginPath();
  if (v) {
    ctx.moveTo(e.x - w, VY0 - 20);
    for (let y = VY0 - 20; y <= GROUND; y += 30) ctx.lineTo(e.x - w + Math.sin(y * 0.04 + t * 9) * 4, y);
    for (let y = GROUND; y >= VY0 - 20; y -= 30) ctx.lineTo(e.x + w + Math.sin(y * 0.04 + t * 9 + 1) * 4, y);
  } else {
    ctx.moveTo(VX0 - 20, e.y - w);
    for (let x = VX0 - 20; x <= MESH_X1; x += 30) ctx.lineTo(x, e.y - w + Math.sin(x * 0.04 + t * 9) * 4);
    for (let x = MESH_X1; x >= VX0 - 20; x -= 30) ctx.lineTo(x, e.y + w + Math.sin(x * 0.04 + t * 9 + 1) * 4);
  }
  ctx.closePath(); D.P(ctx, 'rgba(150,215,200,0.95)', 3.5);
  ctx.globalAlpha = 0.7; ctx.strokeStyle = '#f2fffb'; ctx.lineWidth = 2.5; ctx.beginPath();
  if (v) { ctx.moveTo(e.x - w * 0.3, VY0); ctx.lineTo(e.x - w * 0.3, GROUND); } else { ctx.moveTo(VX0, e.y - w * 0.3); ctx.lineTo(MESH_X1, e.y - w * 0.3); }
  ctx.stroke();
  ctx.restore();
}
function mkMeshThread(pos, vert, warn = 0.9) {
  return new EB({ x: vert ? pos : (VX0 + MESH_X1) / 2, y: vert ? GROUND / 2 : pos, vert, st: 0, t2: 0, harmless: true, cancelable: false, persist: true, life: warn + 0.7, tags: 'mucus', slowOnHit: 0.6, drw: drawMeshThread,
    shp: e => e.vert ? R(e.x - 11, VY0 - 30, 22, GROUND - VY0 + 30) : R(VX0 - 30, e.y - 11, MESH_X1 - VX0 + 30, 22),
    upd: e => { if (e.st === 0 && e.t > warn) { e.st = 1; e.harmless = false; Audio.S.whoosh(); } if (e.st === 1) e.t2 += EDT; } });
}
// Ovillo de moco: una bola enorme que rebota (a pie deja charcos pegajosos)
function drawOvillo(ctx, e) {
  ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
  D.circ(ctx, 0, 0, e.r, '#9fdccc', 4.5);
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, e.r - 3, 0, TAU); ctx.clip();
  ctx.strokeStyle = 'rgba(60,140,120,0.55)'; ctx.lineWidth = 4;
  for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.ellipse(0, 0, e.r * (0.35 + i * 0.12), e.r * 0.95, i * 0.55, 0, TAU); ctx.stroke(); }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(-e.r * 0.35, -e.r * 0.4, e.r * 0.25, e.r * 0.13, -0.6, 0, TAU); ctx.fill();
  ctx.restore();
}

class Mucosa extends Boss {

  *threads(n, noLow) {

  // ---------- Modo avión ----------

  *needleSpiral(dur) {

// ---------- Peristaltismo: anillos de músculo que se cierran y dejan un hueco ----------
function drawMuscleRing(ctx, e) {

      c.closePath();

    ctx.stroke();
    ctx.restore();
    vol(ctx, lobe, { x: x - w / 2, y: Math.min(y0, y1), w, h: Math.abs(y1 - y0) }, { hi: 0.25, rim: '#ffb0c0', lw: 5 });

// ---------- 4.ª fase (difícil): el tren de rivales ----------
// En algunos ratones los espermatozoides se enganchan entre sí y forman "trenes" que nadan más rápido
function drawRivalTrain(ctx, m) {
  const Ch = m.chain, segs = Ch.segs;
  ctx.save(); if (m.dive) ctx.globalAlpha = Math.max(0, 1 - m.dive);
  ctx.lineCap = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(m.x, m.y); for (const s of segs) ctx.lineTo(s.x, s.y); ctx.stroke();
  ctx.strokeStyle = '#c9b48a'; ctx.lineWidth = 2.5; ctx.stroke();
  for (let i = segs.length - 1; i >= 0; i--) { const s = segs[i]; if (Ch.onScreen(s)) drawSperm(ctx, s.x, s.y, 0.8, s.a, m.t + i * 0.2, { col: '#ede4cf', cap: '#c4b5e6' }); }
  drawSperm(ctx, m.x, m.y, 1.3, Ch.head.a, m.t, { col: '#f6cfc8', cap: '#e0574f', angry: true });
  const k = clamp(m.hp / m.maxHp, 0, 1);
  D.rr(ctx, m.x - 30, m.y - 46, 60, 9, 4, 'rgba(30,15,8,0.6)', 2); ctx.fillStyle = '#ff6a3d'; ctx.fillRect(m.x - 28, m.y - 44, 56 * k, 5);
  ctx.restore();
}
function mkRivalTrain(air) {
  const n = 8, gap = 50, x0 = VX0 - 140;
  // en avión, el camino recto del tren pasa por donde está Zoide (y ondula alrededor)
  const b0 = G.boss, c0 = pc();
  let y0 = GROUND - 150;
  if (air && b0) { const tx = b0.x - EGG.r * (b0.zs || 1) * 0.5, k = clamp((c0.x - x0) / (tx - x0), 0, 0.9); y0 = clamp((c0.y - b0.y * k) / (1 - k), G.arena.ftop, G.arena.fbot); }
  const m = new Minion({ x: x0, y: y0, y0, hp: isHard() ? 70 : 60, r: 30, kind: 'train', priority: true, contact: true, puffCol: '#ede4cf', drw: drawRivalTrain, air, dips: [], dive: 0,
    shp: q => C(q.x + 6, q.y, 27) });
  m.chain = new Chain(n, gap, x0, y0, 0);
  if (!air) {
    // dos bajadas al piso: una justo donde está Zoide (ahí se le puede disparar de frente)
    const c = pc(), d1 = clamp(c.x, VX0 + 160, 700);
    let d2 = d1 + (d1 < 260 ? 1 : -1) * rand(300, 380); d2 = clamp(d2, VX0 + 160, 700);
    m.dips = [d1, d2];
    for (const d of m.dips) G.eb.push(new EB({ x: d, y: GROUND, w: 90, harmless: true, cancelable: false, persist: true, life: 3.2, drw: drawFloorMark, col: '#ffc0b0' }));
  }
  m.upd = q => {
    const b = G.boss; if (!b) return;
    if (q.dive > 0) {
      q.contact = false; q.dive = Math.min(1, q.dive + EDT * 1.6); q.x = lerp(q.x, b.x, 0.08); q.y = lerp(q.y, b.y, 0.08); q.chain.update(q.x, q.y);
      if (q.dive >= 1) { q.dead = true; for (let i = 0; i < 4; i++) if (b.rivalHit) b.rivalHit(); FX.ring(b.x, b.y, 60, { color: '#c4b5e6', life: 0.4 }); }
      return;
    }
    if (q.air) {
      const tx = b.x - EGG.r * (b.zs || 1) * 0.5;
      q.x += 250 * EDT;
      q.y = lerp(q.y0, b.y, clamp((q.x - x0) / (tx - x0), 0, 1)) + Math.sin(q.t * 2.4) * 110;
    } else {
      q.x += 270 * EDT;
      let y = GROUND - 150; for (const d of q.dips) { const k = (q.x - (d - 160)) / 320; if (k > 0 && k < 1) y = Math.max(y, GROUND - 150 + Math.sin(k * Math.PI) * 118); }
      q.y = y;
    }
    q.chain.update(q.x, q.y);
    if (Math.hypot(q.x - b.x, q.y - b.y) < EGG.r * (b.zs || 1) * 0.92) { q.dive = 0.01; Audio.S.no(); }
  };
  m.onDie = q => {
    Audio.S.pop(); G.doShake(6, 0.2);
    FX.text(q.x, q.y - 50, '¡Tren descarrilado!', { color: '#fff3d6', size: 22, life: 1 });
    for (const s of q.chain.segs) { FX.puff(s.x, s.y, 2, { color: '#ede4cf' }); G.parts.push(new Part({ kind: 'debris', x: s.x, y: s.y, vx: rand(-160, 160), vy: -rand(200, 420), g: 1300, vr: rand(-10, 10), size: 16, color: '#ede4cf', life: 1 })); }
    FX.stars(q.x, q.y, 6);
  };
  // los vagones también lastiman al tocarlos
  const cars = new EB({ x: x0, y: y0, cancelable: false, persist: true, life: 40, drw: () => {}, shp: () => null, upd: q => { if (m.dead || m.dive > 0) q.dead = true; } });
  cars.shapes = () => m.chain.segs.filter(s => m.chain.onScreen(s, -10)).map(s => C(s.x, s.y, 17));
  G.eb.push(cars);
  return m;
}

// Partes fijas del óvulo pre-dibujadas una sola vez (halo, zona pelúcida y óvulo con su sombreado):

const EGG_S = (EGG.cr + 120) * 2;

function eggLayers() {

    const gl = g.createRadialGradient(c, c, EGG.r * 0.8, c, c, EGG.cr + 120);
    gl.addColorStop(0, 'rgba(255,245,210,0.35)'); gl.addColorStop(1, 'rgba(255,245,210,0)');

  const body = makeLayer(EGG_S, EGG_S, g => {

    g.fillStyle = 'rgba(205,225,255,0.5)'; g.fill('evenodd');
    g.lineWidth = 5; g.strokeStyle = INK; g.beginPath(); g.arc(c, c, EGG.zr, 0, TAU); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 4; g.beginPath(); g.arc(c, c, EGG.zr - 9, Math.PI * 1.1, Math.PI * 1.45); g.stroke();
    const gr = g.createRadialGradient(c - 70, c - 80, 30, c, c, EGG.r);

    g.beginPath(); g.arc(c, c, EGG.r, 0, TAU); g.fillStyle = gr; g.fill();

    glint(g, c - 118, c - 128, 34, 13, -0.75, 0.5);
    g.save(); g.setLineDash([8, 8]); g.lineWidth = 3; g.strokeStyle = 'rgba(190,120,80,0.6)'; g.beginPath(); g.arc(c + 70, c + 40, 56, 0, TAU); g.stroke(); g.restore();
    txt(g, '23', c + 70, c + 42, { size: 26, fill: 'rgba(170,100,60,0.75)', font: FONT });
  });
  EGG_L = { halo, body };
  return EGG_L;

class Ovocita extends Boss {

function drawPhMeter(ctx, x, y, ph) {
  ctx.save();

  const a = Math.PI + clamp(ph / 14, 0, 1) * Math.PI;

class PauseOverlay {
  constructor(scene) { this.sel = 0; this.scene = scene; this.t = 0; Audio.S.ui(); }
  items() {
    const s = G.settings, avion = zoneMode(G.bossIdx) === 'avion';
    return ['Continuar', 'Reintentar zona', avion ? 'Reintentar a pie' : 'Reintentar en modo avión', 'Volver al refugio', 'Libreta de biología', 'Controles',

  }
  update() {
    this.t += DT;
    const it = this.items(), n = it.length;
    this.sel = navMenu(this.sel, n);
    const label = it[this.sel];
    if (label.startsWith('Gráficos') && (Input.hit('left') || Input.hit('right'))) { cycleQuality(Input.hit('left') ? -1 : 1); return; }
    if (Input.hit('pause') || Input.hit('back')) { this.close(); return; }
    if (!Input.hit('confirm')) return;
    Audio.S.ok();
    const s = G.settings;
    if (label === 'Continuar') this.close();
    else if (label === 'Reintentar zona') { G.overlay = null; Input.consume(); G.run.hp = calcMaxHp(); go(Scenes.fight, G.bossIdx); }
    else if (label.startsWith('Reintentar ')) { setZoneMode(G.bossIdx, zoneMode(G.bossIdx) === 'avion' ? 'pie' : 'avion'); G.overlay = null; Input.consume(); G.run.hp = calcMaxHp(); go(Scenes.fight, G.bossIdx); }
    else if (label === 'Volver al refugio') { G.overlay = null; Input.consume(); G.run.hp = calcMaxHp(); go(Scenes.refugio, G.bossIdx); }
    else if (label === 'Libreta de biología') { const me = this; G.overlay = new LibretaOverlay(() => { G.overlay = me; }); }
    else if (label === 'Controles') { const me = this; G.overlay = new ControlsOverlay(() => { G.overlay = me; }); }
    else if (label.startsWith('Música')) { s.music = !s.music; Audio.setMusic(s.music); Settings.store(); }
    else if (label.startsWith('Efecto de película')) { s.film = !s.film; Settings.store(); }
    else if (label.startsWith('Gráficos')) cycleQuality(1);
    else if (label.startsWith('Pantalla completa')) toggleFullscreen();
    else if (label.startsWith('Locutor')) { s.voice = !s.voice; Settings.store(); }
    else if (label === 'Menú principal') { G.overlay = null; Input.consume(); go(Scenes.title); }
  }

function queueDuringStop() {

  if (G.save && !G.save.parryOK) { G.save.parryOK = true; Save.store(); }

// Busca algo rosado dentro de la zona del parry
function tryParry() {
  const p = G.player;
  if (!p || p.dead || p.parryT <= 0) return false;
  const box = p.parryBox();
  for (const e of G.eb) {
    if (e.dead || e.harmless) continue;
    if (e.pinkParts) {   // proyectiles con partes rosadas sueltas (p. ej. anillo del complemento)
      for (const [k, s] of e.pinkParts(e)) {
        if (overlap(s, box)) { e.gone.add(k); parryOK(s.x, s.y); FX.puff(s.x, s.y, 5, { color: PINK_L }); return true; }
      }
    }
    if (!e.pink || e.sticky) continue;
    if (ebHit(e, box)) { e.dead = true; parryOK(e.x, e.y); return true; }
  }
  for (const m of G.minions) {
    if (m.dead || !m.pink) continue;
    if (overlap(m.shape(), box)) { parryOK(m.x, m.y); if (m.onParry) m.onParry(m); else { m.dead = true; FX.puff(m.x, m.y, 4, { color: PINK_L }); } return true; }
  }
  const b = G.boss;
  if (b && b.pinkboxes && b.state === 'fight') for (const pb of b.pinkboxes()) {
    if (overlap(pb.s, box)) { const c = p.center(); parryOK(c.x, c.y - 20); if (b.onParry) b.onParry(pb); return true; }
  }
  return false;
}

  if (e.shapes) { for (const s of e.shapes(e)) if (overlap(s, sh)) return true; return false; }

    const rows = [['Zona', BOSSES[d.idx].zone], ['Guardián', BOSSES[d.idx].name], ['Tiempo', fmtTime(d.time)], ['Golpes recibidos', String(hits)], ['Parrys', String(d.parry || 0)], ['Especiales usados', String(d.ex)]];
    rows.forEach(([a, b], i) => { const y = 170 + i * 46, k = clamp((t - i * 0.12) / 0.3, 0, 1); ctx.save(); ctx.globalAlpha = k; txt(ctx, a, 180, y, { size: 22, fill: '#6a4a2a', align: 'left', font: FONT2 }); txt(ctx, b, 600, y, { size: 24, fill: INK, align: 'right', font: FONT }); ctx.restore(); });
    if (t > 0.9) { txt(ctx, 'Calificación', 390, 470, { size: 22, fill: '#6a4a2a', font: FONT2 }); stars(ctx, 390, 520, grade); }
    D.rr(ctx, 650, 150, 460, 420, 14, '#fffaf0', 3);
    txt(ctx, '¿Qué aprendiste?', 880, 186, { size: 26, fill: '#2e6f8e', font: FONT });
    let y = 230;
    for (const l of LEARNED[d.idx]) { D.circ(ctx, 676, y + 2, 6, '#2e6f8e', 2); y += para(ctx, l, 692, y, 400, { size: 19, fill: INK, align: 'left', lh: 24 }) + 14; }
    if (t > 0.8 && Math.sin(t * 5) > -0.3) hint(ctx, [{ g: 'confirm' }, ' continuar'], W / 2, 628, { size: 20, fill: '#6a4a2a' });
  }
};

// ---------- Recompensas ----------
Scenes.reward = {
  enter(i) { this.i = i; this.t = 0; Audio.S.reward(); },
  update() { this.t += DT; if (this.t > 0.8 && Input.hit('confirm')) { Audio.S.ok(); if (G.run.free) go(Scenes.select); else go(Scenes.map, this.i, this.i + 1); } },
  draw(ctx) {
    const t = this.t, r = BOSSES[this.i].reward, nb = BOSSES[this.i + 1];
    ctx.fillStyle = '#2a1a2a'; ctx.fillRect(0, 0, W, H);
    panel(ctx, 90, 50, 1100, 620);
    ribbon(ctx, W / 2, 64, 420, '¡Nuevo equipo!', '#b0392f', 32);
    const cards = [['NUEVA ARMA', r.w, WEAPONS[r.w]], ['NUEVO OBJETO', r.i, ITEMS[r.i]]];
    cards.forEach(([kind, id, d], k) => {
      const x = 130 + k * 530, sc = E.outBack(clamp((t - k * 0.25) / 0.4, 0, 1));
      ctx.save(); ctx.translate(x + 240, 360); ctx.scale(sc, sc); ctx.translate(-(x + 240), -360);
      D.rr(ctx, x, 120, 490, 480, 16, k ? '#eef7ff' : '#fff6e0', 4);
      txt(ctx, kind, x + 245, 150, { size: 18, fill: '#a0703a', font: FONT });
      ctx.save(); ctx.globalAlpha = 0.5; D.star(ctx, x + 245, 222, 62, 30, 12, t, '#ffe48a', 0); ctx.restore();
      drawIcon(ctx, id, x + 245, 222, 2);
      txt(ctx, d.name, x + 245, 296, { size: 30, fill: INK, font: FONT });
      let y = 330;
      y += para(ctx, d.desc, x + 245, y, 430, { size: 19, fill: INK, align: 'center', lh: 24 }) + 12;
      y += para(ctx, d.bio, x + 245, y, 430, { size: 17, fill: '#1f4f7a', align: 'center', lh: 22 }) + 8;
      if (nb) txt(ctx, '★ Ideal contra ' + nb.name, x + 245, 575, { size: 18, fill: '#c0392b', font: FONT });
      ctx.restore();
    });
    if (t > 0.8) hint(ctx, ['Equipalos en el Taller del próximo refugio (usarlos es opcional)      ', { g: 'confirm' }, ' continuar'], W / 2, 640, { size: 18, fill: '#6a4a2a' });
  }
};

// ---------- Final ----------
Scenes.ending = {
  enter() { this.t = 0; Music.play('end'); this.newCard = unlockCard('mitos'); G.save.done = true; Save.store(); G.player = null; },
  update() {
    this.t += DT;
    if (this.t > 1.5 && Input.hit('confirm')) {
      if (this.newCard) { this.newCard = false; G.overlay = new LessonOverlay(['mitos']); return; }
      go(Scenes.title);
    }
  },
  draw(ctx) {
    const t = this.t;
    intertitle(ctx, [], Math.min(1, t));
    ctx.save(); ctx.globalAlpha = Math.min(1, t);
    txt(ctx, 'FIN', W / 2, 220, { size: 150, fill: '#ffd23f', lw: 12, shadow: 8 });
    txt(ctx, '¡Zoide llegó primero y se formó un cigoto!', W / 2, 330, { size: 30, fill: '#f3e6c8', font: FONT2 });
    txt(ctx, 'Gracias por jugar LA GRAN CARRERA', W / 2, 390, { size: 26, fill: '#f3e6c8', font: FONT2, italic: true });
    txt(ctx, `Fichas de la libreta: ${G.save.cards.length} de ${CARD_ORDER.length}   ·   Eliminaciones: ${G.save.deaths}`, W / 2, 450, { size: 20, fill: '#d9b77a', font: FONT2 });
    for (let i = 0; i < 9; i++) drawSperm(ctx, ((t * 80 + i * 160) % (W + 200)) - 100, 520 + Math.sin(t * 2 + i) * 14, 0.5, 0, t + i);
    if (t > 1.5) hint(ctx, [{ g: 'confirm' }, this.newCard ? ' ver la ficha nueva "Mitos y realidades"' : ' volver al menú'], W / 2, 600, { size: 22, fill: '#ffd23f' });
    ctx.restore();
  }
};

// ---------- Elegir zona ----------
Scenes.select = {
  enter() { this.t = 0; this.sel = 0; Music.play('title'); G.player = null; this.list = BOSSES.map((b, i) => i).filter(i => G.save.beaten[i] || i === nextZone()); },
  update() {
    this.t += DT;
    this.sel = navMenu(this.sel, this.list.length + 1);
    if (Input.hit('back')) { go(Scenes.title); return; }
    if (!Input.hit('confirm')) return;
    Audio.S.ok();
    if (this.sel === this.list.length) { go(Scenes.title); return; }
    G.run = { hp: calcMaxHp(), free: true, side: G.run.side || 1 };
    go(Scenes.refugio, this.list[this.sel]);
  },
  draw(ctx) {
    ctx.fillStyle = '#efe2c4'; ctx.fillRect(0, 0, W, H);
    drawRouteMap(ctx, 300, 380, 0.5, G.t, { labels: false, side: G.run.side || 1 });
    panel(ctx, 600, 70, 620, 580);
    ribbon(ctx, 910, 84, 320, 'Elegir zona', '#2e6f8e', 30);
    const items = this.list.map(i => ({ label: `Zona ${i + 1} · ${BOSSES[i].zone}${G.save.beaten[i] ? '  ✓' : ''}` })).concat([{ label: 'Volver' }]);
    items.forEach((it, i) => {
      const on = i === this.sel, y = 170 + i * 72;
      txt(ctx, it.label, 910, y, { size: on ? 25 : 22, fill: on ? '#c0392b' : INK, font: FONT });
      if (i < this.list.length) txt(ctx, BOSSES[this.list[i]].name, 910, y + 26, { size: 16, fill: '#6a4a2a', font: FONT2 });
      if (on) cursorSperm(ctx, 660 + Math.sin(G.t * 8) * 5, y, G.t);
    });
    hint(ctx, [{ g: 'nav' }, ' elegir   ', { g: 'confirm' }, ' jugar   ', { g: 'back' }, ' volver'], 910, 628, { size: 17, fill: '#6a4a2a', s: 0.8 });
  }
};

// ===== 30_main.js =====
// =====================================================================
// BUCLE PRINCIPAL
// =====================================================================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
  const dpr = window.devicePixelRatio || 1;
  const nrs = clamp(s * dpr, 0.5, 1.5);
  if (Math.abs(nrs - RS) > 0.01 || canvas.width !== Math.round(W * nrs)) {
    RS = nrs; canvas.width = Math.round(W * RS); canvas.height = Math.round(H * RS);
    rerenderLayers();
  }
}
addEventListener('resize', resize);
canvas.addEventListener('pointerdown', () => { Audio.unlock(); Input.pointer(); canvas.focus(); });
function step() {
  Input.tick();
  G.t += DT;
  if (G.toast) { G.toast.t -= DT; if (G.toast.t <= 0) G.toast = null; }
  if (Input.hit('mute')) { G.settings.music = !G.settings.music; Audio.setMusic(G.settings.music); Settings.store(); toast(G.settings.music ? 'Música: sí' : 'Música: no', 1.4); }
  if (G.trans && G.trans.phase !== 'in') { updTrans(); return; }
  updTrans();
  if (G.overlay) { G.overlay.update(); return; }
  if (G.scene) G.scene.update();
}
function render() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (G.scene) G.scene.draw(ctx);
  if (G.overlay) G.overlay.draw(ctx);
  drawToast(ctx);
  Film.draw(ctx);
  if (G.profDraw) G.profDraw('pelicula');
  drawTrans(ctx);
  if (G.lastError) { ctx.save(); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, H - 24, W, 24); txt(ctx, 'Error: ' + G.lastError, 10, H - 12, { size: 13, fill: '#ff9a8a', align: 'left', font: 'monospace' }); ctx.restore(); }
}
let lastT = performance.now(), acc = 0, manual = false;
// Medidor de fluidez: si en una pelea los cuadros tardan demasiado, se pasan solos a "gráficos rápidos"
const PERF = { gap: 16.7, work: 8, n: 0 };
function perfWatch(gapMs, workMs) {
  if (G.settings.quality !== 'auto' || G.autoLow || G.overlay || G.trans) return;
  if (!(G.scene === Scenes.fight && G.scene.state === 'fight') || gapMs > 100) { PERF.n = 0; return; }
  PERF.n++;
  PERF.gap = lerp(PERF.gap, gapMs, 0.03); PERF.work = lerp(PERF.work, workMs, 0.03);
  if (PERF.n > 150 && (PERF.gap > 21.5 || PERF.work > 15)) {
    G.autoLow = true; updLowFx();
    toast('Gráficos rápidos activados para que el juego no se trabe (podés cambiarlo en Pausa)', 4.5);
  }
}
function frame(now) {
  const gap = now - lastT;
  let el = gap / 1000; lastT = now;
  if (el > 0.25) el = 0.25;
  // a 60 Hz el intervalo "tiembla" un poco: cada cuadro cuenta como un paso exacto (evita pasos dobles y tirones)
  if (Math.abs(el - DT) < 0.0025) el = DT;
  const w0 = performance.now();
  if (!manual) {
    acc += el;
    let n = 0;
    while (acc >= DT && n < 4) {
      try { step(); } catch (e) { G.lastError = String(e && e.message || e); console.error(e); }
      acc -= DT; n++;
    }
    if (n >= 4) acc = 0;
  }
  try { render(); } catch (e) { G.lastError = String(e && e.message || e); console.error(e); }
  if (!manual) perfWatch(gap, performance.now() - w0);
  requestAnimationFrame(frame);
}
// Ganchos para pruebas automáticas
window.__G = {
  G, Scenes, BOSSES, setScene, EB, mkCorticalRing, co: { all, wait },
  manual(v) { manual = v; },
  step(n = 1) { for (let i = 0; i < n; i++) step(); },
  render,
  fight(i, o = {}) {
    G.save = Save.fresh();
    if (o.w) G.save.loadout.w = o.w; if (o.item) G.save.loadout.item = o.item;
    if (o.mode) G.save.modes[i] = o.mode === 'swim' || o.mode === 'avion' ? 'avion' : 'pie';
    if (o.low != null) { G.settings.quality = o.low ? 'rapida' : 'alta'; updLowFx(); }
    if (o.diff) G.save.diff = o.diff;
    G.save.weapons = ['atp', 'quimio', 'coletazo', 'helice', 'hialu']; G.save.items = Object.keys(ITEMS);
    G.run = { hp: calcMaxHp(), free: false, side: 1 };
    setScene(Scenes.fight, i);
  }
};
Film.init();
resize();
Settings.load();
Audio.setMusic(G.settings.music);
G.save = Save.load() || Save.fresh();
setScene(Scenes.boot);
requestAnimationFrame(frame);
canvas.focus();

})();
</script>
