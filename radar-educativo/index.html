<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar Educativo · Uruguay frente a PISA y la OCDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plan: tablero educativo "pizarrón y tiza". Inicio con 4 tarjetas grandes; barra fija con Inicio y palanca Básico/Avanzado.
   Semáforo de 5 niveles (rojo→azul) siempre con palabra, para que el color no sea la única pista.
   Colores de países (violeta, magenta, cian, marrón, gris) separados de los del semáforo para no confundir. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14233a; --muted:#5a6a7e; --line:#d5dde6;
  --accent:#1f6f5c; --accent-soft:#dcefe9; --warn:#b07a12;
  --l0:#c62828; --l1:#e65100; --l2:#b8860b; --l3:#2e7d32; --l4:#1565c0;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1722; --surface:#172231; --ink:#e6edf5; --muted:#93a3b7; --line:#2a394c;
    --accent:#5cc2a6; --accent-soft:#1b3a35; --warn:#e0b14d;
    --l0:#ef5350; --l1:#ff8a3d; --l2:#e8c547; --l3:#5cc28a; --l4:#64a9f0;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.home{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600}
.home svg{width:18px;height:18px}
.ttl{flex:1;min-width:0;font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.mode button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.subtabs{display:flex;gap:4px;padding:0 10px;overflow-x:auto}
.subtabs:empty{display:none}
.st{border:0;background:none;padding:8px 10px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.st[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main>*{min-width:0}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:22px;margin-bottom:4px}
.card h3{font-size:18px;margin:10px 0 4px}
.lead{color:var(--muted);margin:0 0 10px;max-width:65ch}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow-x:auto;max-width:100%;flex-wrap:nowrap}
.seg button{white-space:nowrap}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.5}
.chip[aria-pressed="true"]{border-color:var(--ink)}
label.sel{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:15px;max-width:100%}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;font-family:var(--body)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
/* Inicio */
.hero{padding:18px 4px 4px}
.hero h1{font-size:32px}
.hero p{color:var(--muted);margin:6px 0 0}
.confrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.confbtn.alt{background:var(--accent);color:#fff}
.confbtn{justify-self:center;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;max-width:100%}
.confbtn b{font-family:var(--display);font-size:19px}.confbtn small{opacity:.8;font-size:12px}
.cgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.cbox{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.cbox .pc{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.cbox .gn{font-weight:600;font-size:14px}.cbox small{display:block;color:var(--muted);font-size:12px}
.pc.l0{color:var(--l0)}.pc.l1{color:var(--l1)}.pc.l2{color:var(--l2)}.pc.l3{color:var(--l3)}.pc.l4{color:var(--l4)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.three div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.three b{display:block;font-family:var(--display);font-size:28px}
.three span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;margin:14px auto;max-width:520px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.tile{min-width:0;overflow-wrap:break-word;hyphens:auto;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:10px;border-radius:16px;border:0;cursor:pointer;color:#fff;font-family:inherit}
.tile .ic{font-size:30px;line-height:1}.tile b{font-family:var(--display);font-size:17px;line-height:1.1}.tile small{font-size:11.5px;opacity:.9;line-height:1.25}
.tile.t1{background:#1f6f8b}.tile.t2{background:#7a4b9a}.tile.t3{background:#b5562f}.tile.t4{background:#2c7a4b}
.tile:active{transform:scale(.98)}
.morelinks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 14px}
.concl{border-left:5px solid var(--accent);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px}
.concl b.h{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.kpi .cc{font-size:13px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.homegrid{display:grid;gap:12px}
@media (min-width:700px){.homegrid{grid-template-columns:1fr 1fr}}
.big{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:16px;cursor:pointer}
.big:hover{border-color:var(--ink)}
.big .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--accent)}
.big b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;margin-bottom:4px}
.big span{color:var(--muted);font-size:14px}
.modeinfo{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.modeinfo div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;color:var(--muted)}
.modeinfo b{display:block;color:var(--ink);font-size:14px}
/* Semáforo */
.lv{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;color:#fff;white-space:nowrap}
.lv.l0{background:var(--l0)}.lv.l1{background:var(--l1)}.lv.l2{background:var(--l2)}.lv.l3{background:var(--l3)}.lv.l4{background:var(--l4)}
.lv.ref{background:var(--line);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lvdot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:3px}
/* KPIs básicos */
.kgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{border:1px solid var(--line);border-radius:12px;padding:12px;border-top:6px solid var(--line)}
.kpi.l0{border-top-color:var(--l0)}.kpi.l1{border-top-color:var(--l1)}.kpi.l2{border-top-color:var(--l2)}.kpi.l3{border-top-color:var(--l3)}.kpi.l4{border-top-color:var(--l4)}
.kpi .t{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .o{font-size:13px}
.kpi p{margin:6px 0 0;font-size:13px}
.kpi .how{margin-top:6px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.say{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 10px 10px 0;margin:8px 0}
/* Tabla */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.ficha{table-layout:fixed}
.ficha thead{position:sticky;top:var(--topH,100px);z-index:3}
.ficha thead th{background:var(--surface);box-shadow:0 2px 0 var(--accent),0 6px 10px rgba(0,0,0,.12);font-family:var(--display);font-size:14px;line-height:1.1;overflow-wrap:normal;word-break:normal;vertical-align:bottom}
.ficha th,.ficha td{padding:7px 3px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;overflow-wrap:anywhere}
.ficha th.grp{font-family:var(--display);font-size:17px;color:var(--accent);padding-top:14px;box-shadow:none;background:none}
.ficha td.ind{font-size:13px}
.ficha td.ind small{display:block;color:var(--muted);font-size:11px}
.cell .v{font-weight:600;font-size:13px;white-space:nowrap}
.ficha .lv{font-size:9px;padding:1px 3px;letter-spacing:-.02em}
.ficha td.ind{font-size:12.5px}
.cell small{display:block;color:var(--muted);font-size:11px;line-height:1.25;margin-top:3px}
.cell .lv{margin-top:3px}
.sd{color:var(--muted);font-style:italic;font-weight:400;font-size:12px}
.cell input{width:72px;border:1px solid var(--accent);border-radius:6px;padding:3px 5px;background:var(--surface)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}
.calc{border:1px solid var(--accent);color:var(--accent);background:none;border-radius:999px;font-size:11px;font-weight:700;line-height:1;padding:2px 5px;margin-left:3px;cursor:pointer;vertical-align:1px}
.dub{border:1px solid var(--warn);color:var(--warn);background:none;border-radius:999px;font-size:12px;line-height:1;padding:2px 5px;margin-left:3px;cursor:pointer;vertical-align:1px}
.q{border:1px solid var(--muted);color:var(--muted);background:none;border-radius:50%;width:20px;height:20px;font-size:12px;font-weight:700;line-height:1;cursor:pointer;vertical-align:2px;margin-left:4px;padding:0}
/* Correlaciones */
.corr{display:grid;gap:10px}
.cr{border:1px solid var(--line);border-radius:10px;padding:10px}
.cr .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.cr .rb{height:8px;background:var(--line);border-radius:4px;position:relative;margin:6px 0}
.cr .rb i{position:absolute;top:0;bottom:0;border-radius:4px}
.cr .rb:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
.cr p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.sources li{margin:6px 0}
.sources a{color:var(--accent)}
.sources{list-style:none;padding:0}
.sources .srcg{font-family:var(--display);font-size:18px;font-weight:700;margin-top:14px}
.calclist dt{font-weight:600;margin-top:10px}
.calclist dd{margin:2px 0 0;color:var(--muted);font-size:14px}
.steps{padding-left:18px}.steps li{margin:6px 0}
#splash{position:fixed;inset:0;z-index:20;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:opacity .5s}
#splash .m{font-family:var(--display);font-size:42px;font-weight:700;letter-spacing:.04em}
#splash .s{font-size:14px;opacity:.75}
#splash.hide{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
#pop{position:fixed;left:12px;right:12px;bottom:12px;z-index:15;max-width:540px;margin:0 auto;background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:70vh;overflow:auto}
#pop b{display:block;margin-bottom:6px}
#pop p{margin:0 0 10px;color:var(--muted);white-space:pre-line}
</style>
</head>

 series.forEach(se=>{const pts=se.values.map((v,i)=>v===N?null:[cx+sc(v)*Math.cos(ang(i)),cy+sc(v)*Math.sin(ang(i))]);

}

  C[c][area].forEach((v,i)=>{if(v===N){pen=false;return}d+=(pen?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1);pen=true});
  s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" ${c==="OECD"?'stroke-dasharray="6 4"':""}/>`;
  C[c][area].forEach((v,i)=>{if(v!==N)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${col}"/>`})});
 return s+"</svg>";
}

function vMetodo(){
 const g=Math.round(AUTO.V.mat.OECD-AUTO.V.mat.URY);
 let h=`<section class="card"><h2>¿Qué es PISA?</h2><p>Es una prueba de la OCDE que se hace cada tres años a alumnos de <b>15 años</b>, estén en el grado que estén. En 2025 participaron más de 760.000 estudiantes de 91 países.</p>
 <p>No pregunta lo que dice un programa de estudio: mide si los alumnos <b>saben usar</b> lo que aprendieron para resolver problemas de la vida real, por ejemplo leer un contrato, interpretar un gráfico o calcular un descuento.</p></section>
 <section class="card"><h2>¿Qué significan los puntos?</h2><ul class="steps">
  <li>La escala se armó para que el promedio de los países de la OCDE fuera cerca de <b>500</b>.</li>
  <li><b>20 puntos ≈ 1 año de escuela.</b> Es la estimación que usa la OCDE.</li>
  <li>Ejemplo: Uruguay está ${g} puntos debajo de la OCDE en matemática. Es como si nuestros alumnos de 15 años tuvieran unos <b>${yearsOf(g)} años menos de escuela</b> en esa materia.</li>
  <li>Hay niveles de desempeño. El <b>nivel 2</b> es el mínimo para desenvolverse: quien no llega, no puede resolver problemas simples aunque tenga todos los datos.</li></ul>
  <div class="say">Recuperar 20 puntos es recuperar un año entero de aprendizaje para todo un país. Por eso diferencias que parecen chicas en el número son enormes en la vida de los alumnos.</div></section>
 <section class="card"><h2>¿Qué refleja y qué no?</h2><ul class="steps">
  <li><b>Refleja</b> cuánto aprendieron los jóvenes a lo largo de toda su escolaridad, no solo en el último año.</li>
  <li><b>No mide</b> todo lo que hace la escuela (valores, convivencia, arte).</li>
  <li>Que dos cosas vayan juntas (por ejemplo, más inversión y mejores resultados) <b>no prueba</b> que una cause la otra, pero ayuda a ver qué hacen los sistemas que funcionan mejor.</li></ul></section>`;
 if(MODE==="avanzado")h+=`<section class="card"><h2>Detalles técnicos</h2><ul class="steps">
  <li><b>Muestra:</b> en cada país se sortean centros y alumnos; los resultados se ponderan para representar a todos los jóvenes de 15 años escolarizados.</li>
  <li><b>Promedio OCDE:</b> es el promedio simple de los países miembros, cada país pesa igual.</li>
  <li><b>Error:</b> cada puntaje tiene un margen; diferencias de pocos puntos pueden no ser reales. La OCDE marca cuáles diferencias son significativas.</li>
  <li><b>Cuestionarios:</b> alumnos y directores responden preguntas sobre su centro (falta de docentes, infraestructura, asistencia). Esos datos dependen de cómo responde cada uno y deben leerse con cuidado.</li>
  <li><b>Área principal 2025:</b> ciencias. Por eso los cuartiles de países de esta app se arman con el puntaje de ciencias.</li></ul></section>`;
 M.innerHTML=h+modeNote();
}

 Object.keys(RL).map(k=>[k,AUTO.S[k]]).filter(x=>x[1]&&x[1].r!=null).sort((x,y)=>Math.abs(y[1].r)-Math.abs(x[1].r)).forEach(([k,s])=>{const [w,lvl]=strength(s.r);const col=lvl===0?"var(--muted)":s.r>0?"var(--l3)":"var(--l0)";const u=(INDK[k]||{}).u||"";
  h+=`<div style="padding:10px 0;border-top:1px solid var(--line)"><div class="row" style="justify-content:space-between"><b>${esc(RL[k][0])}</b><span class="lv" style="background:${col}">${lvl===0?"":s.r>0?"▲ ":"▼ "}${w}</span></div>
  <div style="height:10px;background:var(--line);border-radius:6px;margin:6px 0;overflow:hidden"><div style="height:100%;width:${Math.round(Math.abs(s.r)*100)}%;background:${col}"></div></div>
  <div style="font-size:14px;color:var(--muted)">${esc(RL[k][1])}${MODE==="avanzado"&&s.qa?` <br><small>Países con mejores resultados: ${fmt(s.qa[0],u)} · con peores: ${fmt(s.qa[3],u)} · correlación ${s.r>0?"+":""}${s.r.toLocaleString("es-UY")}</small>`:""}</div></div>`});
 h+=`<p class="note">Relacionarse no es causar: los países ricos gastan más y además sus familias tienen más recursos. En modo Avanzado se ven los números.</p></section>`;
 M.innerHTML=h;
}
function vConcl(){
 M.innerHTML=`<section class="card"><h2>Conclusiones</h2><p class="lead">Razonando los resultados de PISA con la inversión, el aula y el liceo. Son interpretaciones a partir de datos oficiales; las cuentas están en las otras secciones.</p></section>
 <section class="card"><h3 style="margin-top:0">1. Dónde está Uruguay</h3><p>Uruguay saca 405 en matemática, 423 en lectura y 445 en ciencias, entre 37 y 58 puntos debajo de la OCDE: <b>dos a tres años de escuela</b> de diferencia (20 puntos ≈ un año). El 58% de los alumnos queda bajo el nivel mínimo en matemática, contra 35% en la OCDE. Chile está casi igual; España e Italia, cerca del promedio OCDE.</p></section>
 <section class="card"><h3 style="margin-top:0">2. Inversión: importa, pero no alcanza sola</h3><p>En la OCDE, los países que más gastan por alumno tienden a sacar más (correlación ≈ +0,4), y la inversión en edificios es de lo que más se relaciona (+0,54): el cuarto de países con mejores resultados invierte casi el doble por alumno en infraestructura que el peor cuarto.</p><p><b>Edificios en Uruguay:</b> ANEP ejecutó en 2025 $2.878 millones en obras y equipamiento, ≈100 dólares por alumno (≈130 sumando lo que paga Diversos Créditos). Comparar en dólares exagera la distancia, porque la OCDE usa dólares ajustados por poder de compra. La medida más justa es la <b>parte del presupuesto</b> que va a edificios: <b>Uruguay ≈2,5%</b>, el país OCDE típico <b>7,6%</b> (la mitad central de los países, entre 4,8% y 11%), España 5,2%, Italia 5,6% y Chile 5,7%. Uruguay destina a edificios cerca de <b>un tercio</b> de lo habitual.</p><p>Uruguay invierte por alumno de liceo ≈4.400 dólares por poder de compra, contra ≈14.000 en la OCDE y ≈8.400 en Chile. <b>Es un piso muy bajo.</b> Pero Chile muestra que gastar más no asegura resultados: con el doble de esfuerzo relativo, saca casi lo mismo. La plata es condición necesaria, no suficiente: depende de en qué se usa.</p><p>Y en Uruguay se suma un problema de uso: 2020–2025 fue el período con más dinero asignado y no gastado desde 1985, mientras el 46% de los alumnos está en liceos con falta de infraestructura (OCDE: 33%) y el 34% en liceos con falta de material (OCDE: 27%).</p></section>
 ${terSection()}
 <section class="card"><h3 style="margin-top:0">3. El aula: menos alumnos ayuda poco; el tiempo docente, más</h3><p>El tamaño de grupo se relaciona poco con los resultados en la OCDE (−0,26): bajar de 28 a 25 alumnos, por sí solo, no cambia mucho. Lo que más pesa es otra cosa: <b>las horas de clase del docente</b> (−0,57). Donde los docentes dan más horas frente a clase, los resultados son peores, porque queda menos tiempo para preparar, corregir y acompañar.</p><p>En Uruguay un profesor típico da ≈860 horas al año (OCDE: 710), repartidas en varios liceos y con multiempleo. Eso sugiere que reducir la carga y pagar horas de coordinación y apoyo podría rendir más que solo achicar grupos.</p></section>
 <section class="card"><h3 style="margin-top:0">4. El liceo: el problema está en la permanencia</h3><p>Lo que más distingue a Uruguay no es la repetición (bajó mucho) sino lo que pasa <b>dentro del año</b>: la mitad de los alumnos de 9° y 1° de bachillerato supera las 30 faltas, casi 1 de cada 5 deja 1° de bachillerato durante el año, y entre 14 y 24 de cada 100 pasan con materias pendientes. Un alumno que falta un cuarto del año pierde, solo por eso, buena parte de lo que mide PISA.</p><p>Ojo con una contradicción: en PISA, Uruguay aparece bien en "faltar un día entero" (13,9%, OCDE 22,4%), pero el Monitor muestra muchísimas faltas. Puede ser que en Uruguay se falte más a horas y materias sueltas que a días completos, o que la pregunta de PISA (últimas dos semanas) no capte el año entero. Es un dato a seguir.</p><p>La repetición acumulada se relaciona con peores resultados en la OCDE (−0,44); Uruguay la bajó, pero sin que subiera el aprendizaje en la misma medida: se pasa más, pero no se aprende más.</p></section>
 <section class="card"><h3 style="margin-top:0">5. Qué sugiere para las políticas</h3><ul><li><b>Asistencia y permanencia primero:</b> seguimiento de faltas, tutorías y equipos de apoyo en 8°, 9° y 1° de bachillerato, donde el desgaste es mayor.</li><li><b>Ejecutar lo asignado</b> y priorizar infraestructura y material, que en Uruguay están peor que en la OCDE.</li><li><b>Tiempo docente:</b> menos horas frente a clase por docente, más horas pagas de coordinación, cargos concentrados en un liceo.</li><li><b>Medir mejor:</b> publicar tamaño de grupo por liceo, asistencia por días completos y aprobación real, para que los datos oficiales muestren el aula como es.</li></ul></section>
 <section class="card"><h3 style="margin-top:0">6. El plano legal: ¿es irregular no gastar todo?</h3>
 <p><b>No es ilegal por sí mismo.</b> El presupuesto es un permiso para gastar hasta cierto monto, no plata que se entrega por adelantado. Según el TOCAF (la ley de contabilidad del Estado), los créditos anuales no ejecutados al cierre del ejercicio "quedarán sin valor ni efecto alguno". Las excepciones son las inversiones ya comprometidas y los gastos comprometidos y no pagados, que pasan al año siguiente.</p>
 <p><b>¿A dónde va esa plata?</b> Depende de la fuente:</p>
 <ul><li><b>Rentas Generales</b> (impuestos): lo no gastado nunca sale del Tesoro. No "se devuelve": simplemente no se usa, y queda para el resto del Estado o para bajar el déficit.</li>
 <li><b>Fondos propios de ANEP</b> (como el Fondo de Inasistencias): el saldo queda en ANEP y pasa al año siguiente. En 2025 fue la mayor parte de lo no gastado, y a fin de 2026 se estiman ≈$961 M sin usar.</li></ul>
 <p><b>Lo que sí es discutible</b> es que se deje plata sin usar todos los años mientras los directores informan falta de infraestructura y material, y que un fondo que nace del salario docente acumule una "reserva técnica" de $843 M.</p>
 <p><b>Lo que debería saberse con exactitud, y hoy no se publica claro:</b></p>
 <ul><li>Cada año, cuánto quedó sin gastar <b>por programa, por fuente y por motivo</b> (vacantes sin cubrir, obras demoradas, licitaciones caídas, reservas).</li>
 <li>El <b>saldo en caja</b> de cada fondo propio de ANEP al 31 de diciembre, en qué cuenta está y qué decisión lo mantiene inmovilizado.</li>
 <li>Las observaciones del <b>Tribunal de Cuentas</b> sobre esos gastos y saldos.</li></ul>
 <p>Quien controla esto es el <b>Parlamento</b>, que aprueba cada año la Rendición de Cuentas, con apoyo del Tribunal de Cuentas y la Contaduría General. Cualquier persona puede pedir esa información por la Ley 18.381 (ver "Pedir los datos").</p></section>
 <section class="card"><h3 style="margin-top:0">7. Lo que dicen dos evaluaciones del INEEd (2026)</h3>
 <p><b>¿A quién le llega la plata?</b> El gasto en educación pública es muy progresivo: el 10% de la población con menos ingresos recibe ≈35% del gasto por estudiante y el 10% más rico menos de 0,5%. En 2024 el Estado transfirió en educación el equivalente al 20% del ingreso de los hogares que la usan, y eso reduce la desigualdad (Gini) en 0,03 puntos. En un liceo común se gastaron $117.797 por alumno en 2024 (≈12% del PIB por habitante).</p>
 <p><b>¿Más tiempo y más recursos alcanza?</b> Los centros María Espínola (de 12 en 2021 a 59 en 2025) no mostraron, hasta 2025, efectos estadísticamente significativos en lectura ni matemática, y la promoción fue muy parecida a la de liceos comparables. El INEEd lo atribuye a un problema de diseño (no se diferenció lo suficiente de lo que ya existía), a una implementación muy desigual entre centros y a un monitoreo débil.</p>
 ${concl("La plata llega a quienes más la necesitan, y eso está bien. Pero agregar horas y programas no mejora los aprendizajes por sí solo: importa <b>cómo</b> se diseña, se implementa y se sigue cada política. Es la misma lección que deja la comparación con otros países.")}
 <p class="note">Fuentes: INEEd (2026), Impacto distributivo del gasto público en educación en Uruguay en 2024; INEEd (2026), Evaluación de los centros María Espínola.</p></section>
 <section class="card"><h3 style="margin-top:0">Límites de este análisis</h3><ul><li>Correlación no es causa: los países ricos gastan más y también tienen familias con más recursos, que explican buena parte de los puntajes.</li><li>Los datos de Uruguay mezclan fuentes (ANEP, OCDE, PISA) y años distintos.</li><li>Las conclusiones de políticas son lecturas posibles de los datos, no recomendaciones oficiales.</li></ul></section>`;
}

function vHall(){
 if(SUB==="tend"){vTend();return}
 if(SUB==="concl"){vConcl();return}
 if(SUB==="pedir"){M.innerHTML=`<section class="card"><h2>Cómo pedir los datos que ANEP no publica</h2><p class="lead">Cualquier persona puede pedir información pública por la Ley N° 18.381. Es gratis y no hay que explicar para qué.</p>
 <h3>Por dónde</h3><ul><li><b>En línea:</b> solicitudes.gub.uy, con usuario gub.uy (si ANEP figura en el sistema).</li><li><b>Web de ANEP:</b> sección Transparencia, formulario de Solicitud de Acceso a la Información Pública.</li><li><b>En persona:</b> nota escrita en Mesa de Entrada del CODICEN o de la Dirección General de Educación Secundaria.</li></ul>
 <h3>Plazos</h3><p>El organismo tiene <b>20 días hábiles</b> para responder (se puede prorrogar si lo justifica). Si no responde, se puede denunciar ante la Unidad de Acceso a la Información Pública (UAIP); ya hubo casos contra ANEP donde se configuró el "silencio positivo".</p>
 <h3>Qué pedir para que no lo rechacen</h3><p>La ley no obliga a <b>crear</b> información nueva, así que conviene pedir datos que ya existen en sus sistemas. El Monitor Liceal ya usa la matrícula y los grupos de cada liceo para calcular su promedio.</p>
 <h3>Texto listo para copiar</h3><div class="card" style="background:var(--bg)"><p style="margin:0">Al amparo de la Ley N° 18.381, solicito a la Dirección General de Educación Secundaria (ANEP), para los años 2024, 2025 y 2026, por cada liceo oficial (número y departamento) y grado: cantidad de grupos y matrícula. Asimismo, si existe en sus registros, la cantidad de estudiantes desvinculados durante el año por liceo y grado. No solicito datos personales de estudiantes. Formato preferido: planilla electrónica (xlsx o csv).</p><p class="note">Agregar nombre, cédula, domicilio y correo de contacto.</p></div>
 <button type="button" class="chip" id="cpy">Copiar texto</button>
 <h3>Segundo pedido: dónde están los fondos no gastados</h3><div class="card" style="background:var(--bg)"><p style="margin:0">Al amparo de la Ley N° 18.381, solicito a la ANEP (CODICEN – Dirección Sectorial de Programación y Presupuesto), para los ejercicios 2020 a 2025: (1) créditos asignados y ejecutados por programa, objeto del gasto y fuente de financiamiento, con el monto no ejecutado; (2) los motivos de no ejecución registrados para cada programa; (3) el saldo al 31 de diciembre de cada año de los recursos con afectación especial, en particular del Fondo de Inasistencias, indicando su destino o reserva; (4) las observaciones del Tribunal de Cuentas sobre dichos fondos. Formato preferido: planilla electrónica.</p></div>
 <h3>Posibles problemas</h3><ul><li>"Estudiantes activos al cierre" puede no existir como campo: por eso va en un punto aparte.</li><li>Pueden demorar o mandarlo en PDF.</li><li>Con grupos muy chicos podrían invocar privacidad, aunque se piden solo cantidades.</li></ul>
 <p class="note">Con esa planilla se calcula el tamaño de grupo real de cada liceo y el 70% central, sin estimaciones.</p></section>`;
  const b=document.getElementById("cpy");b.onclick=()=>{const tx=b.previousElementSibling.querySelector("p").textContent;try{navigator.clipboard.writeText(tx).then(()=>b.textContent="¡Copiado!",()=>b.textContent="Mantené apretado el texto para copiar")}catch(e){b.textContent="Mantené apretado el texto para copiar"}};return}
 M.innerHTML=`<section class="card"><h2>Lo que muestran los datos oficiales</h2><p class="lead">Resumen de Uruguay con datos de ANEP, el Monitor Liceal, la Contaduría General y PISA. Los detalles y cuentas están en Índices de confianza.</p>
 <ol><li><b>Tamaño de grupo.</b> El oficial (24,6 en ciclo básico, 2026) promedia grupos llenos con grupos chicos. Medido desde el alumno, como en la OCDE, da ≈28 en ciclo básico y ≈31,6 en 1° de bachillerato (2024).</li>
 <li><b>Se pierden alumnos durante el año:</b> 9% en ciclo básico y 18,7% en 1° de bachillerato (2025), en aumento.</li>
 <li><b>Faltas:</b> la mitad de los alumnos de 9° y de 1° de bachillerato supera las 30 faltas en el año. La asistencia calculada con las propias faltas da ≈75–80%, contra 86,5% oficial.</li>
 <li><b>Pasar no es aprobar:</b> entre 14 y 24 de cada 100 pasan de grado con materias pendientes; "aprueban todo" viene bajando mientras la promoción se mantiene.</li>
 <li><b>Presupuesto:</b> ANEP gasta ≈97% de lo asignado; el porcentaje bajó desde 2019 y 2020–2025 es el período con más dinero sin gastar desde 1985 (≈$18.200 millones de 2025). De los aumentos pedidos para 2026–2029 se aprobó el 17%.</li>
 <li><b>Lo que mejora:</b> la extraedad en 7° bajó de 45% (2008) a 19% (2026) y la desvinculación de un año a otro es ≈3%.</li>
 <li><b>⁈ Error oficial:</b> el Monitor informa 169.825 alumnos de ciclo básico en 2026, cuando la suma por grados da ≈96.000.</li></ol></section>
 <section class="card"><h2>Lectura general</h2><p class="lead">Interpretación de los datos anteriores; no es un dato oficial.</p>
 <p>El sistema retiene a los alumnos en la matrícula, pero no tanto en el aula. Inscriptos, promoción y asistencia oficial se ven bien; los indicadores más finos (faltas, aprobar todo, abandono durante el año) muestran un desgaste que empeoró desde 2023, sobre todo en 8°, 9° y 1° de bachillerato.</p>
 <p>Los datos oficiales no son falsos, pero suelen usar la medida más favorable: promedio de grupos y no de alumnos, presente si fue parte del día, promovido aunque deba materias. Por eso esta app muestra la otra medida al lado.</p>
 <p>En la plata, dejar ≈3% sin gastar no es raro en un organismo grande; lo llamativo es que aumentara en años de reclamos por falta de recursos.</p>
 <p class="note">Límite: casi todo es a nivel país. Para confirmar grupos de 30 o más hace falta el dato por liceo, que se puede pedir (pestaña "Pedir los datos").</p></section>`;
}

function vFuentes(){

 }else{

   <li><b>Si no está, el del ministerio del país</b> (ANEP, INEEd, Mineduc, MIM, Ministerio de Educación de España).</li>
   <li><b>Si hay que calcularlo</b>, se usan las técnicas de medición del INEEd con datos oficiales de instituciones gubernamentales de cada país, y se marca con <b style="color:var(--accent)">M</b>.</li>

   <li><b>Clase media:</b> método estándar de la OCDE: entre el 75% y el 200% del ingreso mediano del país; hogar de 3 personas.</li></ul></section>

 }
}
