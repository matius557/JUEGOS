<script>
const $=i=>document.getElementById(i),cv=$('cv'),ctx=cv.getContext('2d');
let W=800,H=500;
function rs(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);
const M={glu:{n:'Glucosa',t:'Carbohidrato',c:'#f4c542',f:'Glucosa: monómero de los carbohidratos. Unida en cadenas forma almidón o glucógeno, la reserva de energía.'},
lip:{n:'Ácido graso',t:'Lípido',c:'#ff8a4c',f:'Ácidos grasos: forman fosfolípidos que se ordenan en bicapa y crean la membrana que separa la célula del exterior.'},
aa:{n:'Aminoácido',t:'Proteína',c:'#5aa9ff',f:'Aminoácidos: hay 20 tipos. Unidos por enlaces peptídicos forman proteínas: enzimas, transportadores, estructura.'},
nuc:{n:'Nucleótido',t:'Ácido nucleico',c:'#6fdc7a',f:'Nucleótidos (A, T/U, C, G): su secuencia en el ADN guarda la información genética de la célula.'},
rad:{n:'Radical libre',t:'',c:'#c05cff'}};
const PARTS={fla:{n:'Flagelo',c:2,d:'Más velocidad: filamentos de proteína que giran como hélice.'},
mit:{n:'Mitocondria',c:3,d:'Comida da 60% más energía: produce ATP en la respiración celular.'},
rib:{n:'Ribosoma',c:2,d:'Creces más rápido: sintetizan proteínas a partir del ARN.'},
nuc:{n:'Núcleo',c:3,d:'Más salud máxima: protege y organiza el ADN.'},
chl:{n:'Cloroplasto',c:3,d:'Energía gratis en la zona iluminada: fotosíntesis.'},
vac:{n:'Vacuola',c:2,d:'Gastas energía más lento: almacena agua y nutrientes.'},lis:{n:'Lisosoma',c:3,d:'Digiere a los virus que te tocan: contiene enzimas digestivas.'},eye:{n:'Mancha ocular',c:2,d:'Fotorreceptor: marca con un aro a los peligros cercanos.'},pil:{n:'Pili',c:2,d:'Atrae biomoléculas cercanas: filamentos de adhesión.'},wal:{n:'Pared celular',c:2,d:'Recibes 40% menos daño: refuerzo rígido externo.'}};
const TYPES={pro:{n:'Procariota',a:['fla','pil','rib','wal'],d:'Sin núcleo ni mitocondrias: pequeña, rápida y ahorrativa.'},euk:{n:'Eucariota animal',a:['fla','pil','mit','rib','nuc','vac','lis','eye'],d:'Núcleo y mitocondrias; sin pared ni cloroplastos.'},veg:{n:'Eucariota vegetal',a:['mit','rib','nuc','chl','wal','vac','eye'],d:'Pared y cloroplastos; algo más lenta pero autosuficiente.'}};
const LV=[{n:'Charco',g:14,v:2,f:0},{n:'Estanque',g:20,v:3,f:1},{n:'Pantano',g:24,v:4,f:2},{n:'Arrecife',g:28,v:5,f:3},{n:'Colonia multicelular',g:28,v:4,f:2,m:1},{n:'Tejidos y órganos',g:36,v:5,f:3,m:1}];
const QZ=[{q:'¿Qué biomolécula forma la membrana celular?',o:['Fosfolípidos','Almidón','ADN'],a:0,e:'Los fosfolípidos forman una bicapa con las colas hidrofóbicas hacia dentro.'},{q:'¿Dónde se produce la mayor parte del ATP en una célula eucariota?',o:['Ribosoma','Mitocondria','Núcleo'],a:1,e:'La mitocondria realiza la respiración celular y produce ATP.'},{q:'¿Qué caracteriza a una célula procariota?',o:['No tiene núcleo definido','No tiene ADN','No tiene membrana'],a:0,e:'Su ADN está libre en el citoplasma, en una zona llamada nucleoide.'},{q:'¿Qué hacen los ribosomas?',o:['Digieren lípidos','Sintetizan proteínas','Almacenan ADN'],a:1,e:'Traducen el ARN mensajero en cadenas de aminoácidos.'},{q:'¿Qué organelo realiza la fotosíntesis?',o:['Cloroplasto','Lisosoma','Aparato de Golgi'],a:0,e:'Los cloroplastos convierten luz, agua y CO₂ en glucosa y oxígeno.'},{q:'¿Cómo se llama la unión entre dos aminoácidos?',o:['Enlace glucosídico','Enlace peptídico','Enlace fosfodiéster'],a:1,e:'El enlace peptídico une el grupo carboxilo de un aminoácido con el grupo amino del siguiente.'}];
const ACH={bio:['Químico','Completaste las 4 biomoléculas.'],clean:['Intocable','Superaste un nivel sin recibir daño.'],fag:['Fagocitador','Devoraste un fagocito.'],euk:['Eucariota','Superaste un nivel como eucariota.'],pho:['Fotosintético','Superaste un nivel con cloroplasto.'],mul:['Multicelular','Completaste la colonia multicelular.'],sab:['Sabio','Respondiste bien 4 preguntas.'],fin:['Evolución completa','Terminaste los 6 niveles.'],cac:['Superdepredador','Cazaste 10 presas en una partida.'],mut:['Mutante','Resististe 45 s en Mutaciones.']};
const DF={f:{v:.6,d:.65,e:.8,n:'Fácil'},n:{v:1,d:1,e:1,n:'Normal'},h:{v:1.4,d:1.3,e:1.2,n:'Difícil'}};
const LES=['La célula es la unidad básica de la vida: una membrana encierra el citoplasma, el ADN y los ribosomas. Come para obtener energía (ATP) y crece hasta dividirse.','Procariotas (bacterias): sin núcleo, ADN libre. Eucariotas: núcleo y organelos con membrana. Los organelos reparten el trabajo de la célula.','Respiración celular: la mitocondria usa glucosa y oxígeno para producir ATP. Fotosíntesis: el cloroplasto usa luz para fabricar glucosa. Son dos formas de obtener energía.','Mitosis: la célula copia su ADN, reparte los cromosomas y se divide en dos células hijas idénticas. Así crecen los tejidos y se reproducen los seres unicelulares.','Multicelularidad: células que no se separan tras dividirse y cooperan. Con el tiempo se especializan: dividir el trabajo hace al organismo más eficiente.','Células similares forman tejidos y varios tejidos forman órganos. Cada tipo de célula usa solo una parte de su ADN (diferenciación celular).'];
const INFO='<h3>Biomoléculas</h3><p><b>Carbohidratos</b> (glucosa, almidón): energía rápida. <b>Lípidos</b> (fosfolípidos): membrana y reserva. <b>Proteínas</b> (cadenas de aminoácidos): enzimas, transporte, estructura. <b>Ácidos nucleicos</b> (ADN, ARN): guardan y copian la información genética.</p><h3>Organelos</h3><p><b>Núcleo</b>: guarda el ADN. <b>Ribosoma</b>: fabrica proteínas. <b>Mitocondria</b>: produce ATP. <b>Cloroplasto</b>: fotosíntesis. <b>Pared celular</b>: soporte y protección. <b>Flagelo</b>: movimiento. <b>Pili</b>: adhesión a superficies y a otras células.</p><h3>Tipos de célula</h3><p><b>Procariota</b>: sin núcleo, pequeña (bacterias). <b>Eucariota animal</b>: núcleo y organelos, sin pared. <b>Eucariota vegetal</b>: pared celular y cloroplastos.</p><h3>Ciclo celular</h3><p>Interfase (crece y copia el ADN), mitosis (profase, metafase, anafase, telofase) y citocinesis: nacen dos células hijas idénticas.</p><h3>Multicelularidad</h3><p>Células que cooperan y se especializan forman tejidos; los tejidos forman órganos.</p><h3>Peligros del juego</h3><p><b>Virus</b>: no son células; invaden y usan tu maquinaria. <b>Fagocito</b>: célula que engulle partículas (fagocitosis). <b>Radicales libres</b>: moléculas inestables que dañan otras por oxidación.</p>';
function go2(g){gen=g;pts=mode==='lab'?20:14;for(const p in parts)parts[p]=0;lin=[];edit()}
function info(){if(tr)return;tr={p:st,h:$('ov').innerHTML};if(st==='s1'||st==='s3')st='pause';else if(st==='wait'){tr=null;return}ov('<div class="card"><h2>📖 Bioenciclopedia</h2>'+INFO+'<button class="go" onclick="back()">Volver</button></div>')}
const SC=[220,261.63,293.66,329.63,392,440,523.25,659.25],RT=[110,87.31,130.81,98];
function loadO(){try{const o=JSON.parse(localStorage.getItem('biospore_o')||'{}');if(o.vol!=null)vol=o.vol;if(o.mus!=null)mus=o.mus;if(o.sf!=null)sf=o.sf;if(o.df)df=o.df}catch(e){}try{const s=JSON.parse(localStorage.getItem('biospore')||'null');if(s&&s.ach)ach=s.ach}catch(e){}}

function save(){try{localStorage.setItem('biospore',JSON.stringify({mode,df,gen,pts,parts,type,lin,ach,qOk,sp}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem('biospore')||'null')}catch(e){return null}}
function ainit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();bus=AC.createGain();bus.gain.value=0;bus.connect(AC.destination);dl=AC.createDelay(1);dl.delayTime.value=.55;const fb=AC.createGain();fb.gain.value=.45;dl.connect(fb);fb.connect(dl);dl.connect(bus);ap();setInterval(tick,2200);tick()}catch(e){AC=null}}
function au(){ainit();if(AC&&AC.state==='suspended')AC.resume()}
function ap(){if(AC)bus.gain.setTargetAtTime(mus?vol*.55:0,AC.currentTime,.15)}
function nt(f,d,ty,g,w){const t=AC.currentTime+(w||0),o=AC.createOscillator(),e=AC.createGain();o.type=ty;o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.05);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(bus);e.connect(dl);o.start(t);o.stop(t+d+.1)}
function pad(r){const t=AC.currentTime,fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=700;fl.connect(bus);[r,r*1.5,r*2,r*2.5].forEach((f,i)=>{const o=AC.createOscillator(),e=AC.createGain();o.type=i%2?'sine':'triangle';o.frequency.value=f;o.detune.value=(i-1.5)*6;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(.12,t+3);e.gain.linearRampToValueAtTime(0,t+9);o.connect(e);e.connect(fl);o.start(t);o.stop(t+9.5)})}
function tick(){if(!AC||AC.state!=='running'||!mus)return;aN++;if(aN%4===1)pad(RT[(aN>>2)%4]);const pl=st==='s3'||st==='over';if(Math.random()<.75)nt(SC[rnd(8)],3.5,'sine',.07);if(pl){nt(SC[(aN*3)%8]*2,.9,'triangle',.04);nt(SC[(aN*3+2)%8]*2,.9,'triangle',.03,1.1)}else if(Math.random()<.4)nt(SC[rnd(4)]/2,2,'sine',.09)}

function menu(){st='menu';tr=null;$('toast').style.display='none';P={x:-999,y:-999,vx:0,vy:0,a:0,r:14};preds=[];mols=[];for(let i=0;i<22;i++)mols.push(newMol());const s=load();
 ov(`<div class="card mm" style="text-align:center"><h2>BioSpore</h2><p>De molécula a organismo · biología celular</p><button class="pt mb" onclick="ng()"><b>Nueva partida</b></button><button class="pt mb" onclick="cont()"${s?'':' disabled'}><b>Continuar</b>${s?'<br><small>'+(s.mode==='sur'?'Supervivencia':s.mode==='cac'?'Cacería':s.mode==='lab'?'Laboratorio':'Aventura')+' · Nivel '+Math.min(s.gen||1,LV.length)+'</small>':'<br><small>No hay partida guardada</small>'}</button><button class="pt mb" onclick="opts()"><b>Opciones</b></button><button class="pt mb" onclick="quit()"><b>Salir</b></button>${AC?'':'<p><small>🎵 La música empieza cuando toques la pantalla.</small></p>'}</div>`)}

function drawMol(k,x,y,r,t,lab){const c=ctx;c.save();c.translate(x,y);c.rotate(t*.4+x*.01);c.strokeStyle=M[k].c;c.fillStyle=M[k].c+'66';c.lineWidth=2;c.shadowColor=M[k].c;c.shadowBlur=14;c.beginPath();

 else if(k==='lip'){c.arc(0,-r*.35,r*.55,0,6.3);c.fill();c.stroke();c.beginPath();c.moveTo(-r*.25,r*.2);c.lineTo(-r*.3,r);c.moveTo(r*.25,r*.2);c.lineTo(r*.3,r);c.stroke()}

 else if(k==='nuc'){c.moveTo(0,-r);c.lineTo(r*.8,0);c.lineTo(0,r);c.lineTo(-r*.8,0);c.closePath();c.fill();c.stroke()}
 else{for(let i=0;i<16;i++){const a=i*Math.PI/8,rr=i%2?r*.55:r*1.1;c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.closePath();c.fill();c.stroke()}

 if(pp.fla){c.strokeStyle='#9ff5df';c.lineWidth=2.5;c.beginPath();for(let i=0;i<=20;i++){const u=i/20;c.lineTo(-r-u*r*1.3,Math.sin(u*9-t*12)*r*.18*u)}c.stroke()}
 const gr=c.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);gr.addColorStop(0,'rgba(190,255,235,.55)');gr.addColorStop(.7,'rgba(70,200,170,.28)');gr.addColorStop(1,'rgba(40,150,150,.45)');c.save();c.shadowColor='#5ff5d0';c.shadowBlur=r*.6;c.beginPath();c.arc(0,0,r,0,6.3);c.fillStyle=gr;c.fill();c.restore();c.beginPath();c.arc(0,0,r,0,6.3);c.strokeStyle='#9ff5df';c.lineWidth=2;c.stroke();c.beginPath();c.arc(0,0,r-3,0,6.3);c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1;c.stroke();c.beginPath();c.ellipse(-r*.35,-r*.45,r*.25,r*.12,-.6,0,6.3);c.fillStyle='rgba(255,255,255,.35)';c.fill();
 if(pp.wal){c.beginPath();c.arc(0,0,r+4,0,6.3);c.strokeStyle='#e8d28a';c.lineWidth=3;c.stroke()}
 if(pp.vac){c.beginPath();c.arc(-r*.1,r*.1,r*.3,0,6.3);c.fillStyle='rgba(180,230,255,.25)';c.fill();c.strokeStyle='rgba(200,240,255,.6)';c.lineWidth=1;c.stroke()}if(pp.lis){c.fillStyle='#ff6a4a';[[.45,.1],[.2,.55],[-.2,-.6]].forEach(m=>{c.beginPath();c.arc(r*m[0],r*m[1],r*.08,0,6.3);c.fill()})}if(pp.eye){c.beginPath();c.arc(r*.72,-r*.15,r*.17,0,6.3);c.fillStyle='#fff';c.fill();c.beginPath();c.arc(r*.77,-r*.15,r*.09,0,6.3);c.fillStyle='#d2203a';c.fill()}if(pp.nuc){const ng=c.createRadialGradient(r*.05,-r*.05,1,r*.1,0,r*.4);ng.addColorStop(0,'#c9b8ff');ng.addColorStop(1,'#6a4fd8');c.beginPath();c.arc(r*.1,0,r*.38,0,6.3);c.fillStyle=ng;c.fill();c.strokeStyle='#e6dcff';c.lineWidth=1.5;c.stroke();c.beginPath();c.arc(r*.1,0,r*.43,0,6.3);c.strokeStyle='rgba(230,220,255,.5)';c.setLineDash([2,3]);c.stroke();c.setLineDash([]);c.beginPath();c.arc(r*.16,-r*.06,r*.11,0,6.3);c.fillStyle='#fff3c9';c.fill()}

function scene(){const c=ctx;
 for(let i=0;i<3;i++){const x=W*(.18+.3*i)+Math.sin(time*.07+i)*30,l=c.createLinearGradient(x,0,x+80,H);l.addColorStop(0,'rgba(180,255,240,.10)');l.addColorStop(1,'rgba(180,255,240,0)');c.fillStyle=l;c.beginPath();c.moveTo(x,0);c.lineTo(x+60,0);c.lineTo(x+220,H);c.lineTo(x+90,H);c.fill()}

 const s1b=st==='s1'||st==='wait',g=ctx.createRadialGradient(W/2,H*.4,20,W/2,H/2,Math.max(W,H)*.8);g.addColorStop(0,s1b?'#3a2236':'#12414a');g.addColorStop(.6,s1b?'#161226':'#08242e');g.addColorStop(1,'#02070b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<4;i++){const bx=W*(.2+.2*i)+Math.sin(time*.1+i)*40,by=H*(.3+.15*((i*7)%4))+Math.cos(time*.12+i*2)*30,bg=ctx.createRadialGradient(bx,by,0,bx,by,170);bg.addColorStop(0,s1b?'rgba(255,140,80,.12)':'rgba(80,220,200,.10)');bg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H)}
 if(parts.chl&&(st==='s3'||st==='over')){const l=ctx.createLinearGradient(0,0,0,H*.5);l.addColorStop(0,'rgba(255,240,150,.22)');l.addColorStop(1,'rgba(255,240,150,0)');ctx.fillStyle=l;ctx.fillRect(0,0,W,H*.5)}
 if(bub.length<30)for(let i=0;i<30;i++)bub.push({x:Math.random(),y:Math.random(),r:2+Math.random()*6,s:.01+Math.random()*.02});
 ctx.fillStyle='rgba(160,230,220,.07)';for(const b of bub){b.y-=b.s*.016;if(b.y<-.05)b.y=1.05;ctx.beginPath();ctx.arc(b.x*W,b.y*H,b.r,0,6.3);ctx.fill()}

   if(q.t==='vir'){ctx.rotate(time);ctx.strokeStyle='#ff5a6a';ctx.fillStyle='#7a1a2a';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.lineTo(Math.cos(a)*q.r,Math.sin(a)*q.r)}ctx.closePath();ctx.fill();ctx.stroke();for(let i=0;i<6;i++){const a=i*Math.PI/3;ctx.beginPath();ctx.moveTo(Math.cos(a)*q.r,Math.sin(a)*q.r);ctx.lineTo(Math.cos(a)*(q.r+7),Math.sin(a)*(q.r+7));ctx.stroke()}}
